<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="468" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">HashMap의 키 → 버킷 인덱스 변환</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">탐색이 아니라 계산이기 때문에 평균 O(1)이다</text>
<rect x="34" y="100" width="330" height="46" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.4"/>
<text x="48" y="120" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start">key  "A"</text>
<text x="48" y="137" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">저장할 키</text>
<line x1="199" y1="147" x2="199" y2="160" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="34" y="162" width="330" height="46" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.4"/>
<text x="48" y="182" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start">hashCode() = 65</text>
<text x="48" y="199" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">32비트 정수</text>
<line x1="199" y1="209" x2="199" y2="222" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="34" y="224" width="330" height="46" rx="8" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.4"/>
<text x="48" y="244" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start">h ^ (h >>> 16) = 65</text>
<text x="48" y="261" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">보조 해시 — 상위 비트를 하위로 섞음</text>
<line x1="199" y1="271" x2="199" y2="284" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="34" y="286" width="330" height="46" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.4"/>
<text x="48" y="306" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start">(16 - 1) &amp; 65 = 1</text>
<text x="48" y="323" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">버킷 인덱스 (용량이 2의 거듭제곱이라 비트 AND)</text>
<text x="420" y="96" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start">table (버킷 배열)</text>
<rect x="420" y="110" width="44" height="38" rx="4" fill="#f4f4f2" stroke="#898781" stroke-width="1.3"/>
<text x="442.0" y="133.32" font-size="12" fill="#52514e" font-weight="600" text-anchor="middle">0</text>
<rect x="486" y="110" width="74" height="38" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3" stroke-dasharray="3 3"/>
<text x="523.0" y="133.14" font-size="11.5" fill="#898781" font-weight="400" text-anchor="middle">null</text>
<rect x="420" y="156" width="44" height="38" rx="4" fill="#f4f4f2" stroke="#898781" stroke-width="1.3"/>
<text x="442.0" y="179.32" font-size="12" fill="#52514e" font-weight="600" text-anchor="middle">1</text>
<rect x="486" y="156" width="74" height="38" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="523.0" y="179.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">"A"=1</text>
<line x1="562" y1="175" x2="586" y2="175" stroke="#2a78d6" stroke-width="1.3" marker-end="url(#ahb)"/>
<rect x="588" y="156" width="74" height="38" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="625.0" y="179.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">"Q"=9</text>
<text x="672" y="180" font-size="11.5" fill="#e34948" font-weight="700" text-anchor="start">충돌</text>
<rect x="420" y="202" width="44" height="38" rx="4" fill="#f4f4f2" stroke="#898781" stroke-width="1.3"/>
<text x="442.0" y="225.32" font-size="12" fill="#52514e" font-weight="600" text-anchor="middle">2</text>
<rect x="486" y="202" width="74" height="38" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="523.0" y="225.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">"B"=2</text>
<rect x="420" y="248" width="44" height="38" rx="4" fill="#f4f4f2" stroke="#898781" stroke-width="1.3"/>
<text x="442.0" y="271.32" font-size="12" fill="#52514e" font-weight="600" text-anchor="middle">3</text>
<rect x="486" y="248" width="74" height="38" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3" stroke-dasharray="3 3"/>
<text x="523.0" y="271.14" font-size="11.5" fill="#898781" font-weight="400" text-anchor="middle">null</text>
<text x="442" y="320" font-size="18" fill="#898781" font-weight="700" text-anchor="middle">⋮</text>
<line x1="370" y1="288" x2="414" y2="175" stroke="#eb6834" stroke-width="1.6" marker-end="url(#aho)"/>
<rect x="30" y="356" width="700" height="92" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="44" y="377" font-size="13" fill="#008300" font-weight="700" text-anchor="start">충돌 처리 — 같은 버킷에 여러 개가 모이면</text>
<text x="50" y="404" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">연결 리스트로 이어 붙임</text>
<line x1="215" y1="399" x2="250" y2="399" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="262" y="404" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">한 버킷 8개 이상 + table 길이 64 이상</text>
<line x1="530" y1="399" x2="565" y2="399" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="577" y="404" font-size="13" fill="#008300" font-weight="700" text-anchor="start">레드-블랙 트리</text>
<text x="50" y="428" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">→ 최악의 경우도 O(log n)으로 방어된다 (Java 8 이상, 그 이전은 O(n))</text>
</svg>