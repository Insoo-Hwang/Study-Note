<text x="34" y="220" font-size="13" fill="#7a3ba7" font-weight="700" text-anchor="start">비트 하나만 확인해 두 리스트로 나눈다</text>
<text x="34" y="264" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">확장 후  capacity = 32</text>
