<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">리사이즈 — 해시를 다시 계산하지 않는다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">용량이 2배가 되면 각 노드는 '원래 자리' 또는 '원래 자리 + 기존 용량' 둘 중 하나로만 간다</text>
<text x="34" y="106" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">확장 전  capacity = 16,  table[3] 의 연결 리스트</text>
