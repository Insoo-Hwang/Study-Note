<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="398" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">덱 — 사용하는 끝에 따라 스택도 되고 큐도 된다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">앞뒤 모두 O(1)이므로 ArrayDeque 하나로 Stack과 Queue를 모두 대체한다</text>
<rect x="250" y="122" width="66" height="44" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="283.0" y="149.4" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="middle">A</text>
<rect x="320" y="122" width="66" height="44" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="353.0" y="149.4" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="middle">B</text>
<rect x="390" y="122" width="66" height="44" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="423.0" y="149.4" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="middle">C</text>
<rect x="460" y="122" width="66" height="44" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="493.0" y="149.4" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="middle">D</text>
<text x="242" y="150" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="end">first</text>
<text x="534" y="150" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start">last</text>
<line x1="190" y1="96" x2="256" y2="116" stroke="#008300" stroke-width="1.6" marker-end="url(#ahg)"/>
<text x="184" y="92" font-size="12" fill="#008300" font-weight="700" text-anchor="end">addFirst</text>
<line x1="586" y1="96" x2="522" y2="116" stroke="#008300" stroke-width="1.6" marker-end="url(#ahg)"/>
<text x="592" y="92" font-size="12" fill="#008300" font-weight="700" text-anchor="start">addLast</text>
<line x1="256" y1="172" x2="190" y2="194" stroke="#e34948" stroke-width="1.6" marker-end="url(#ahr)"/>
<text x="184" y="200" font-size="12" fill="#e34948" font-weight="700" text-anchor="end">pollFirst</text>
<line x1="522" y1="172" x2="586" y2="194" stroke="#e34948" stroke-width="1.6" marker-end="url(#ahr)"/>
<text x="592" y="200" font-size="12" fill="#e34948" font-weight="700" text-anchor="start">pollLast</text>
<rect x="30" y="232" width="340" height="130" rx="9" fill="#7a3ba7" fill-opacity="0.07" stroke="#7a3ba7" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="44" y="253" font-size="13" fill="#7a3ba7" font-weight="700" text-anchor="start">스택으로 쓰기 — 앞쪽만 사용</text>
<text x="50" y="288" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">push  =  addFirst</text>
<text x="50" y="312" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">pop   =  removeFirst</text>
<text x="50" y="340" font-size="12" fill="#7a3ba7" font-weight="700" text-anchor="start">넣고 빼는 곳이 같음  →  LIFO</text>
<rect x="390" y="232" width="340" height="130" rx="9" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="404" y="253" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start">큐로 쓰기 — 뒤로 넣고 앞에서 빼기</text>
<text x="410" y="288" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">offer =  addLast</text>
<text x="410" y="312" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">poll  =  pollFirst</text>
<text x="410" y="340" font-size="12" fill="#eb6834" font-weight="700" text-anchor="start">넣고 빼는 곳이 반대  →  FIFO</text>
<text x="34" y="388" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">Java 9부터는 2의 거듭제곱 제약이 사라져 기본 용량이 17이고 inc/dec 헬퍼로 순환한다</text>
</svg>