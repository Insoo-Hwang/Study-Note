<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="418" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">스택의 LIFO 동작과 괄호 검사</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">접근 지점이 top 하나뿐이라 push · pop · peek 이 모두 O(1)이다</text>
<rect x="30" y="84" width="300" height="300" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="44" y="105" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start">LIFO — 마지막에 넣은 것이 먼저 나온다</text>
<rect x="110" y="300" width="130" height="40" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="175.0" y="324.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">A</text>
<rect x="110" y="256" width="130" height="40" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="175.0" y="280.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">B</text>
<rect x="110" y="212" width="130" height="40" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="175.0" y="236.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">C</text>
<line x1="286" y1="150" x2="252" y2="190" stroke="#008300" stroke-width="1.6" marker-end="url(#ahg)"/>
<text x="292" y="146" font-size="12.5" fill="#008300" font-weight="700" text-anchor="start">push</text>
<line x1="98" y1="190" x2="64" y2="150" stroke="#e34948" stroke-width="1.6" marker-end="url(#ahr)"/>
<text x="58" y="146" font-size="12.5" fill="#e34948" font-weight="700" text-anchor="end">pop</text>
<text x="252" y="218" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start">← top</text>
<text x="175.0" y="364" font-size="11.5" fill="#898781" font-weight="400" text-anchor="middle">bottom</text>
<rect x="350" y="84" width="380" height="300" rx="9" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="364" y="105" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start">괄호 검사 —  ( [ ] )</text>
<text x="364" y="122" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">여는 괄호는 push, 닫는 괄호는 pop해서 짝을 맞춘다</text>
<text x="370" y="146" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">'('  push</text>
<rect x="570" y="130" width="26" height="22" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="583.0" y="145.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">(</text>
<text x="370" y="200" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">'['  push</text>
<rect x="570" y="184" width="26" height="22" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="583.0" y="199.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">(</text>
<rect x="600" y="184" width="26" height="22" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="613.0" y="199.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">[</text>
<text x="370" y="254" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">']'  pop → '[' 짝 맞음</text>
<rect x="570" y="238" width="26" height="22" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="583.0" y="253.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">(</text>
<text x="370" y="308" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">')'  pop → '(' 짝 맞음</text>
<rect x="570" y="292" width="116" height="22" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="628.0" y="306.96" font-size="11" fill="#008300" font-weight="700" text-anchor="middle">비어 있음 → 올바름</text>
<text x="370" y="356" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">마지막에 스택이 비어야 올바른 괄호다</text>
<text x="34" y="406" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">Java에서는 Vector를 상속한 java.util.Stack 대신 ArrayDeque를 쓴다</text>
</svg>