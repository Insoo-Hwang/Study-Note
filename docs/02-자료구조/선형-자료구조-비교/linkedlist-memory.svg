<rect x="320" y="138" width="48" height="34" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="344.0" y="159.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">F</text>
<rect x="372" y="138" width="48" height="34" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="396.0" y="159.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">G</text>
<rect x="424" y="138" width="48" height="34" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="448.0" y="159.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">H</text>
<rect x="56" y="134" width="212" height="42" rx="6" fill="none" stroke="#008300" stroke-width="2"/>
<text x="490" y="160" font-size="12" fill="#008300" font-weight="600" text-anchor="start">한 번의 메모리 읽기로 A~D 확보</text>
<rect x="30" y="212" width="700" height="134" rx="9" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="44" y="233" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start">LinkedList — 힙 여기저기에 흩어진 노드</text>
<text x="44" y="250" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">노드마다 다른 위치 → 매번 캐시 미스, 객체 헤더와 참조 2개도 추가 비용</text>
<rect x="70" y="268" width="34" height="30" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<rect x="104" y="268" width="34" height="30" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
