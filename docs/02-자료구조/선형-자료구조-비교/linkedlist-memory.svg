<rect x="216" y="138" width="48" height="34" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="240.0" y="159.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">D</text>
<rect x="268" y="138" width="48" height="34" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
