<text x="70" y="318" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">prev | 값 | next</text>
<text x="34" y="370" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">복잡도는 둘 다 O(n)이지만 상수 계수가 다르다 — 순회가 잦으면 ArrayList가 유리하다</text>
