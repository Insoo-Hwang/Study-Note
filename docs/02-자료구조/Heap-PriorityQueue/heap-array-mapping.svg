<text x="494" y="117" font-size="13" fill="#7a3ba7" font-weight="700" text-anchor="start">인덱스 계산</text>
<text x="498" y="148" font-size="13.5" fill="#0b0b0b" font-weight="600" text-anchor="start">부모  =  (i - 1) / 2</text>
<text x="498" y="180" font-size="13.5" fill="#0b0b0b" font-weight="600" text-anchor="start">왼쪽 자식  =  2i + 1</text>
<text x="498" y="212" font-size="13.5" fill="#0b0b0b" font-weight="600" text-anchor="start">오른쪽 자식  =  2i + 2</text>
<text x="498" y="246" font-size="11.5" fill="#7a3ba7" font-weight="600" text-anchor="start">예) i=1 → 부모 0, 자식 3과 4</text>
<text x="34" y="386" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">부모 ≥ 자식만 지키는 부분 정렬이다 — 루트는 최댓값이지만 형제끼리는 순서가 없다</text>
