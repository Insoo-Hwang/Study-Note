<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="418" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">정렬된 값을 넣을 때 — 일반 BST는 퇴화하고 레드-블랙 트리는 버틴다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">1, 2, 3, 4, 5 를 순서대로 삽입한 결과. 실무 데이터는 대부분 정렬되어 들어온다</text>
<rect x="30" y="84" width="340" height="296" rx="9" fill="#e34948" fill-opacity="0.07" stroke="#e34948" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="44" y="105" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">일반 이진 탐색 트리 — 한쪽으로 쏠림</text>
<text x="44" y="122" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">높이 5 · 탐색 O(n) — 사실상 연결 리스트</text>
<circle cx="90" cy="146" r="19" fill="#eb6834" stroke="#eb6834"/>
<text x="90" y="151" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<line x1="100" y1="162" x2="90" y2="174" stroke="#eb6834" stroke-width="1.6"/>
<circle cx="98" cy="190" r="19" fill="#eb6834" stroke="#eb6834"/>
<text x="98" y="195" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<line x1="108" y1="206" x2="98" y2="218" stroke="#eb6834" stroke-width="1.6"/>
<circle cx="106" cy="234" r="19" fill="#eb6834" stroke="#eb6834"/>
<text x="106" y="239" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<line x1="116" y1="250" x2="106" y2="262" stroke="#eb6834" stroke-width="1.6"/>
<circle cx="114" cy="278" r="19" fill="#eb6834" stroke="#eb6834"/>
<text x="114" y="283" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<line x1="124" y1="294" x2="114" y2="306" stroke="#eb6834" stroke-width="1.6"/>
<circle cx="122" cy="322" r="19" fill="#eb6834" stroke="#eb6834"/>
<text x="122" y="327" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
<text x="210" y="214" font-size="12.5" fill="#e34948" font-weight="600" text-anchor="start">비교 횟수가</text>
<text x="210" y="234" font-size="12.5" fill="#e34948" font-weight="600" text-anchor="start">원소 수만큼 늘어난다</text>
<rect x="390" y="84" width="340" height="296" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="404" y="105" font-size="13" fill="#008300" font-weight="700" text-anchor="start">레드-블랙 트리 — 자동으로 균형 유지</text>
<text x="404" y="122" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">높이 3 · 탐색 O(log n) 보장</text>
<circle cx="560" cy="168" r="19" fill="#0b0b0b" stroke="#0b0b0b"/>
<text x="560" y="173" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<circle cx="495" cy="240" r="19" fill="#0b0b0b" stroke="#0b0b0b"/>
<text x="495" y="245" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<circle cx="625" cy="240" r="19" fill="#0b0b0b" stroke="#0b0b0b"/>
<text x="625" y="245" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<circle cx="580" cy="312" r="19" fill="#e34948" stroke="#e34948"/>
<text x="580" y="317" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<circle cx="670" cy="312" r="19" fill="#e34948" stroke="#e34948"/>
<text x="670" y="317" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
<line x1="560" y1="187" x2="495" y2="221" stroke="#898781" stroke-width="1.6"/>
<line x1="560" y1="187" x2="625" y2="221" stroke="#898781" stroke-width="1.6"/>
<line x1="625" y1="259" x2="580" y2="293" stroke="#898781" stroke-width="1.6"/>
<line x1="625" y1="259" x2="670" y2="293" stroke="#898781" stroke-width="1.6"/>
<circle cx="424" cy="316" r="8" fill="#0b0b0b"/>
<text x="438" y="321" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">검정</text>
<circle cx="424" cy="342" r="8" fill="#e34948"/>
<text x="438" y="347" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">빨강</text>
<text x="34" y="404" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">빨강이 연속될 수 없고 리프까지의 검정 수가 같다 → 최장 경로 ≤ 최단 경로 × 2 → 높이가 O(log n)</text>
</svg>