<text x="44" y="259" font-size="13" fill="#008300" font-weight="700" text-anchor="start">poll() 반복 — 매번 루트를 꺼내고 재조정</text>
<text x="44" y="276" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">이 방법으로만 정렬된 결과를 얻을 수 있다</text>
