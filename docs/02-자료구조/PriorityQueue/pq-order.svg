<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">PriorityQueue의 가장 흔한 함정</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">순회 순서는 정렬 순서가 아니다 — 원소가 적으면 우연히 맞아 보여 더 위험하다</text>
<text x="34" y="104" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">offer(5), offer(1), offer(9), offer(3), offer(7), offer(2), offer(8) 실행 후</text>
<rect x="30" y="122" width="700" height="96" rx="9" fill="#e34948" fill-opacity="0.07" stroke="#e34948" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="44" y="143" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">for-each · toString() — 내부 배열 순서 그대로</text>
<text x="44" y="160" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">부모-자식 관계만 정렬된 부분 정렬 상태다</text>
