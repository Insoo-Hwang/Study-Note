<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="358" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">HashSet의 정체 — 내부는 HashMap 그대로</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">값을 키로 넣고, 값 자리에는 모든 항목이 공유하는 더미 객체 하나를 넣는다</text>
<rect x="34" y="94" width="250" height="196" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/>
<text x="50" y="120" font-size="15" fill="#2a78d6" font-weight="700" text-anchor="start">HashSet</text>
<text x="50" y="148" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start" font-family="ui-monospace, Consolas, monospace">add("apple")</text>
<text x="50" y="174" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start" font-family="ui-monospace, Consolas, monospace">add("banana")</text>
<text x="50" y="200" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start" font-family="ui-monospace, Consolas, monospace">contains("apple")</text>
<text x="50" y="240" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">자체 저장 구조가 없다</text>
<text x="50" y="262" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">모든 연산을 그대로 위임한다</text>
<line x1="292" y1="192" x2="336" y2="192" stroke="#7a3ba7" stroke-width="2" marker-end="url(#ah)"/>
<text x="314" y="180" font-size="11.5" fill="#7a3ba7" font-weight="700" text-anchor="middle">위임</text>
<rect x="344" y="94" width="386" height="196" rx="10" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.6"/>
<text x="362" y="120" font-size="15" fill="#7a3ba7" font-weight="700" text-anchor="start">HashMap&lt;E, Object&gt;</text>
<rect x="362" y="136" width="130" height="34" rx="4" fill="#f4f4f2" stroke="#898781" stroke-width="1.3"/>
<text x="427.0" y="157.32" font-size="12" fill="#52514e" font-weight="600" text-anchor="middle">key</text>
<rect x="500" y="136" width="130" height="34" rx="4" fill="#f4f4f2" stroke="#898781" stroke-width="1.3"/>
<text x="565.0" y="157.32" font-size="12" fill="#52514e" font-weight="600" text-anchor="middle">value</text>
<rect x="362" y="176" width="130" height="34" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="427.0" y="197.5" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">"apple"</text>
<rect x="500" y="176" width="130" height="34" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="565.0" y="197.5" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">PRESENT</text>
<rect x="362" y="216" width="130" height="34" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="427.0" y="237.5" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">"banana"</text>
<rect x="500" y="216" width="130" height="34" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="565.0" y="237.5" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">PRESENT</text>
<path d="M 640 193 Q 690 193 690 216 Q 690 233 644 233" fill="none" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="700" y="208" font-size="11" fill="#eb6834" font-weight="700" text-anchor="start">같은</text>
<text x="700" y="222" font-size="11" fill="#eb6834" font-weight="700" text-anchor="start">객체 1개</text>
<rect x="30" y="306" width="700" height="40" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="44" y="327" font-size="13" fill="#008300" font-weight="700" text-anchor="start"></text>
<text x="50" y="332" font-size="13" fill="#008300" font-weight="700" text-anchor="start">add 는  map.put(e, PRESENT) == null  을 반환한다 → 존재 확인과 추가를 한 번의 연산으로 끝낸다</text>
</svg>