<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="418" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">순환 배열로 만드는 큐</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">배열 끝에 도달하면 0번으로 돌아가 앞의 빈 공간을 재사용한다 — 원소 이동이 0</text>
<rect x="30" y="84" width="700" height="148" rx="9" fill="#e34948" fill-opacity="0.07" stroke="#e34948" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="44" y="105" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">단순 배열이면 생기는 문제</text>
<rect x="70" y="130" width="52" height="36" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3" stroke-dasharray="3 3"/>
<rect x="126" y="130" width="52" height="36" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="152.0" y="152.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">B</text>
<rect x="182" y="130" width="52" height="36" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="208.0" y="152.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">C</text>
<rect x="238" y="130" width="52" height="36" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="264.0" y="152.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">D</text>
<text x="96" y="184" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle">↑ front=1</text>
<text x="268" y="184" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle">rear=4 ↑</text>
<text x="360" y="140" font-size="12.5" fill="#e34948" font-weight="600" text-anchor="start">poll 후 앞칸이 비었는데 rear는 이미 배열 끝</text>
<text x="360" y="162" font-size="12.5" fill="#e34948" font-weight="600" text-anchor="start">→ 전부 앞으로 당기면 O(n)</text>
<rect x="30" y="252" width="700" height="128" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="44" y="273" font-size="13" fill="#008300" font-weight="700" text-anchor="start">순환 배열 — 다음 위치 = (현재 + 1) % capacity</text>
<rect x="70" y="296" width="56" height="38" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="98.0" y="319.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">F</text>
<text x="98" y="350" font-size="11" fill="#898781" font-weight="400" text-anchor="middle">0</text>
<rect x="130" y="296" width="56" height="38" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3" stroke-dasharray="3 3"/>
<text x="158" y="350" font-size="11" fill="#898781" font-weight="400" text-anchor="middle">1</text>
<rect x="190" y="296" width="56" height="38" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="218.0" y="319.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">C</text>
<text x="218" y="350" font-size="11" fill="#898781" font-weight="400" text-anchor="middle">2</text>
<rect x="250" y="296" width="56" height="38" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="278.0" y="319.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">D</text>
<text x="278" y="350" font-size="11" fill="#898781" font-weight="400" text-anchor="middle">3</text>
<rect x="310" y="296" width="56" height="38" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="338.0" y="319.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">E</text>
<text x="338" y="350" font-size="11" fill="#898781" font-weight="400" text-anchor="middle">4</text>
<text x="218" y="290" font-size="11.5" fill="#2a78d6" font-weight="700" text-anchor="middle">front</text>
<text x="158" y="290" font-size="11.5" fill="#eb6834" font-weight="700" text-anchor="middle">rear</text>
<path d="M 98 296 Q 60 262 60 316 Q 60 352 92 340" fill="none" stroke="#eb6834" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#aho)"/>
<text x="400" y="306" font-size="12.5" fill="#008300" font-weight="600" text-anchor="start">인덱스 4 다음은 0 → 앞의 빈칸을 그대로 재사용</text>
<text x="400" y="328" font-size="12.5" fill="#008300" font-weight="600" text-anchor="start">offer · poll 모두 인덱스만 이동 → O(1)</text>
<text x="34" y="406" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">front == rear 만으로는 빈 상태와 가득 찬 상태를 구분할 수 없어 size를 따로 센다</text>
</svg>