<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">시스템 설계 답변 8단계</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">단축 URL 예제 — 각 단계의 답이 다음 단계의 입력이 된다</text>
