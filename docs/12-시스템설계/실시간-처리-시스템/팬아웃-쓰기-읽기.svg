<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" width="760" height="404" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="402" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">새 글을 팔로워에게 — 비용을 언제 낼 것인가</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">쓰기 팬아웃은 글을 쓸 때, 읽기 팬아웃은 타임라인을 열 때 비용을 낸다</text>
<rect x="34" y="78" width="692" height="128" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="99" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start">쓰기 팬아웃 (push)</text>
<text x="48" y="116" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">글 1개 → 팔로워 수만큼 쓰기 · 원격 저장소에 초당 1만 건이면 100초</text>
<rect x="60" y="126" width="190" height="54" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="155.0" y="149" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="middle">글 작성</text>
<text x="155.0" y="168" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle">팔로워 100만 명</text>
<line x1="254" y1="153" x2="281" y2="153" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ahb)"/>
<rect x="286" y="126" width="190" height="54" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="381.0" y="149" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="middle">타임라인 100만 곳 기록</text>
<text x="381.0" y="168" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle">메모리 안에서 8~12 ms</text>
<line x1="480" y1="153" x2="507" y2="153" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ahb)"/>
<rect x="512" y="126" width="190" height="54" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="607.0" y="149" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="middle">타임라인 열기</text>
<text x="607.0" y="168" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle">내 목록 1회 조회</text>
<rect x="34" y="220" width="692" height="128" rx="9" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="241" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start">읽기 팬아웃 (pull)</text>
<text x="48" y="258" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">글 1개 → 내 글 목록에 한 번 · 읽을 때마다 팔로우한 300곳을 조회</text>
<rect x="60" y="268" width="190" height="54" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="155.0" y="291" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="middle">글 작성</text>
<text x="155.0" y="310" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle">내 글 목록에 1회</text>
<line x1="254" y1="295" x2="281" y2="295" stroke="#eb6834" stroke-width="1.4" marker-end="url(#aho)"/>
<rect x="286" y="268" width="190" height="54" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="381.0" y="291" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="middle">타임라인 열기</text>
<text x="381.0" y="310" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle">팔로우 300명의 최근 글</text>
<line x1="480" y1="295" x2="507" y2="295" stroke="#eb6834" stroke-width="1.4" marker-end="url(#aho)"/>
<rect x="512" y="268" width="190" height="54" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="607.0" y="291" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="middle">300개 목록 병합</text>
<text x="607.0" y="310" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle">메모리 안에서 6.5~8.4 µs</text>
<text x="56" y="374" font-size="12" fill="#008300" font-weight="700" text-anchor="start">하이브리드: 팔로워가 많은 계정의 글만 읽을 때 병합하고, 나머지는 쓸 때 밀어 넣는다</text>
</svg>