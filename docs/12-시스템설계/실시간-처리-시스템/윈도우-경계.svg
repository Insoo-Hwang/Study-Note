<text x="56" y="312" font-size="11.5" fill="#0b0b0b" font-weight="700" text-anchor="start">실측: 고정 윈도우는 1.99초 동안 200건 허용 · 슬라이딩 로그는 100건 — 대신 요청마다 타임스탬프를 저장한다</text>
