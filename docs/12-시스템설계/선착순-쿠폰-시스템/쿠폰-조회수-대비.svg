<text x="467.0" y="318" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">100 ms · 1 s</text>
<line x1="540" y1="303" x2="563" y2="303" stroke="#eb6834" stroke-width="1.4" marker-end="url(#aho)"/>
<rect x="567" y="276" width="140" height="54" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="637.0" y="299" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="middle">증분 반영</text>
<text x="637.0" y="318" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">views = views + n</text>
<text x="57" y="352" font-size="11.5" fill="#eb6834" font-weight="700" text-anchor="start">결과: 조회 64,000회 → UPDATE 1번 — 대신 최대 유실 = 초당 건수 × 반영 주기</text>
