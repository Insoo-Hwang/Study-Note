<text x="48" y="99" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start">쿠폰 — 요청마다 원자적으로 판정</text>
<text x="48" y="116" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">틀리면 비용이 생긴다 · 장애 시 거절</text>
<rect x="57" y="126" width="140" height="54" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
