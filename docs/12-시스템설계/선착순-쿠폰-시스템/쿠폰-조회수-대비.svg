<text x="297.0" y="318" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">LongAdder</text>
<line x1="370" y1="303" x2="393" y2="303" stroke="#eb6834" stroke-width="1.4" marker-end="url(#aho)"/>
<rect x="397" y="276" width="140" height="54" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
