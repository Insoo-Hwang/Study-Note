<text x="48" y="249" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start">조회수 — 모았다가 한 번에</text>
<text x="48" y="266" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">틀려도 아무도 모른다 · 장애 시 유실 허용</text>
<rect x="57" y="276" width="140" height="54" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
