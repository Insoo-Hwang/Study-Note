<rect x="227" y="126" width="140" height="54" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="297.0" y="149" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="middle">매진 플래그</text>
<text x="297.0" y="168" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">99%는 여기서 거절</text>
<line x1="370" y1="153" x2="393" y2="153" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ahb)"/>
<rect x="397" y="126" width="140" height="54" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="467.0" y="149" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="middle">원자적 판정</text>
<text x="467.0" y="168" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">WHERE issued&lt;total</text>
<line x1="540" y1="153" x2="563" y2="153" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ahb)"/>
<rect x="567" y="126" width="140" height="54" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="637.0" y="149" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="middle">유니크 제약</text>
<text x="637.0" y="168" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">(coupon, user)</text>
<text x="57" y="202" font-size="11.5" fill="#2a78d6" font-weight="700" text-anchor="start">결과: 100장 정확 · 중복 0건 — 대신 요청마다 한 행의 잠금을 지난다</text>
