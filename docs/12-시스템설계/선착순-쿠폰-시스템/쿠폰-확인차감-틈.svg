<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="428" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">확인과 차감 사이의 틈</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">재고 100장 · 이미 99장 발급 — 두 요청이 같은 99를 읽으면 둘 다 통과한다</text>
<rect x="34" y="78" width="692" height="160" rx="9" fill="#e34948" fill-opacity="0.07" stroke="#e34948" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="99" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">읽은 값으로 쓰는 코드 (check-then-act)</text>
<text x="58" y="136" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start">요청 A</text>
<text x="58" y="196" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start">요청 B</text>
<line x1="150" y1="131" x2="712" y2="131" stroke="#898781" stroke-width="1.4" stroke-dasharray="3 4"/>
<line x1="150" y1="191" x2="712" y2="191" stroke="#898781" stroke-width="1.4" stroke-dasharray="3 4"/>
<rect x="150" y="116" width="110" height="30" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="205.0" y="135.14" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">① 읽기: 99</text>
<rect x="270" y="116" width="110" height="30" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="325.0" y="135.14" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">② 99 &lt; 100 통과</text>
<rect x="560" y="116" width="110" height="30" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="615.0" y="135.14" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">③ 100 쓰기</text>
<rect x="210" y="176" width="110" height="30" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="265.0" y="195.14" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">① 읽기: 99</text>
<rect x="330" y="176" width="110" height="30" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="385.0" y="195.14" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">② 99 &lt; 100 통과</text>
<rect x="600" y="176" width="110" height="30" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="655.0" y="195.14" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">③ 100 쓰기</text>
<line x1="260" y1="146" x2="260" y2="172" stroke="#e34948" stroke-width="1.4" marker-end="url(#ahr)"/>
<text x="268" y="166" font-size="11.5" fill="#e34948" font-weight="700" text-anchor="start">A가 쓰기 전이라 B도 99를 본다</text>
<text x="48" y="228" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">결과: 두 명 발급, 카운터는 100 — +1 하나가 사라졌다(갱신 손실). 이것이 반복되면 카운터가 계속 작게 남는다.</text>
<rect x="34" y="256" width="692" height="158" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="277" font-size="13" fill="#008300" font-weight="700" text-anchor="start">1,000명 동시 요청 결과 (H2 · 스레드 32개 · 3회 모두 같음)</text>
<text x="238" y="316" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="end" font-family="ui-monospace, Consolas, monospace">읽고 → 확인 → 읽은 값+1</text>
<rect x="250" y="300" width="290.0" height="22" rx="3" fill="#e34948" fill-opacity="0.85"/>
<text x="548.0" y="316" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start">1,000장 발급 (10배 초과)</text>
<text x="238" y="352" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="end" font-family="ui-monospace, Consolas, monospace">SELECT ... FOR UPDATE</text>
<rect x="250" y="336" width="29.0" height="22" rx="3" fill="#2a78d6" fill-opacity="0.85"/>
<text x="287.0" y="352" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start">100장</text>
<text x="238" y="388" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="end" font-family="ui-monospace, Consolas, monospace">조건부 UPDATE</text>
<rect x="250" y="372" width="29.0" height="22" rx="3" fill="#008300" fill-opacity="0.85"/>
<text x="287.0" y="388" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start">100장</text>
<line x1="279.0" y1="292" x2="279.0" y2="408" stroke="#898781" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="283.0" y="406" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">재고 100</text>
</svg>