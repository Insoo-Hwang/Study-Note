<text x="56" y="364" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">재시도는 미도착을, 멱등 키는 이중 청구를, 조회는 끝까지 모르는 1건을 해결한다 — 셋 다 있어야 0</text>
