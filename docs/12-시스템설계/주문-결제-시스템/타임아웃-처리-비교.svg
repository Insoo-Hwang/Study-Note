<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">타임아웃을 어떻게 처리하느냐가 틀리는 건수를 정한다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">주문 1만 건 · 요청 유실 1% · 승인 후 응답 유실 3% · 재시도 최대 3회 (시드 고정 모델)</text>
