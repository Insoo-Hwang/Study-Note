<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="370" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">청크 하나가 트랜잭션 하나다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">커서로 읽고 · 벌크로 쓰고 · 체크포인트와 함께 커밋한다</text>
<rect x="57" y="80" width="250" height="40" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="72" y="98" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start">시작: 체크포인트 읽기</text>
<text x="72" y="114" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">재시작하면 여기서부터 이어 간다</text>
<line x1="127" y1="120" x2="127" y2="170" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="40" y="140" width="680" height="132" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="706" y="161" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="end">BEGIN ─ COMMIT : 청크 하나 = 트랜잭션 하나</text>
<rect x="57" y="172" width="140" height="78" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="127.0" y="196" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="middle">① 커서로 읽기</text>
<text x="127.0" y="217" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">WHERE id &gt; last_id</text>
<text x="127.0" y="234" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">LIMIT 1000</text>
<line x1="200" y1="211" x2="223" y2="211" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ahb)"/>
<rect x="227" y="172" width="140" height="78" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="297.0" y="196" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="middle">② 처리 · 벌크 쓰기</text>
<text x="297.0" y="217" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">addBatch()</text>
<text x="297.0" y="234" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">executeBatch()</text>
<line x1="370" y1="211" x2="393" y2="211" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ahb)"/>
<rect x="397" y="172" width="140" height="78" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="467.0" y="196" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="middle">③ 체크포인트 갱신</text>
<text x="467.0" y="217" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">last_id =</text>
<text x="467.0" y="234" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">청크 마지막 id</text>
<line x1="540" y1="211" x2="563" y2="211" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ahb)"/>
<rect x="567" y="172" width="140" height="78" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="637.0" y="196" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="middle">④ COMMIT</text>
<text x="637.0" y="217" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">②와 ③이</text>
<text x="637.0" y="234" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">함께 확정</text>
<line x1="637.0" y1="250" x2="637.0" y2="296" stroke="#2a78d6" stroke-width="1.4"/>
<line x1="637.0" y1="296" x2="127.0" y2="296" stroke="#2a78d6" stroke-width="1.4"/>
<line x1="127.0" y1="296" x2="127.0" y2="254" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ahb)"/>
<text x="382.0" y="290" font-size="11.5" fill="#2a78d6" font-weight="700" text-anchor="middle">다음 청크 — 빈 결과가 나올 때까지 반복</text>
<text x="57" y="326" font-size="11.5" fill="#008300" font-weight="700" text-anchor="start">④ 전에 죽으면 ②와 ③이 함께 롤백된다 → 재시작하면 같은 청크를 정확히 한 번 다시 한다 (실측 중복 0건)</text>
<text x="57" y="348" font-size="11.5" fill="#e34948" font-weight="700" text-anchor="start">③을 커밋 뒤에 따로 쓰면 그 사이에 죽을 때 청크 하나가 두 번 처리된다 (실측 중복 1,000건)</text>
</svg>