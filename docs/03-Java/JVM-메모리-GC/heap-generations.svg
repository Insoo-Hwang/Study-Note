<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="778" height="398" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">힙의 세대 구조 — 객체는 어디서 태어나 어디로 가는가</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">근거는 하나다: 대부분의 객체는 만들어지고 아주 금방 죽는다</text>
<rect x="34" y="92" width="430" height="150" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="113" font-size="13" fill="#008300" font-weight="700" text-anchor="start">Young Generation</text>
<text x="48" y="130" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">Minor GC — 자주, 그리고 싸게</text>
<rect x="54" y="146" width="150" height="76" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="129" y="176" font-size="15" fill="#008300" font-weight="700" text-anchor="middle">Eden</text>
<text x="129" y="200" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">new 로 만든 객체</text>
<rect x="222" y="146" width="108" height="76" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="276" y="176" font-size="12" fill="#008300" font-weight="700" text-anchor="middle">Survivor 0</text>
<text x="276" y="198" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">사용 중</text>
<rect x="340" y="146" width="108" height="76" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3" stroke-dasharray="4,3"/>
<text x="394" y="176" font-size="12" fill="#52514e" font-weight="700" text-anchor="middle">Survivor 1</text>
<text x="394" y="198" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">항상 비어 있음</text>
<rect x="480" y="92" width="266" height="150" rx="9" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="494" y="113" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start">Old Generation</text>
<text x="494" y="130" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">Full GC — 드물게, 그러나 길게</text>
<rect x="500" y="146" width="226" height="76" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="613" y="176" font-size="15" fill="#eb6834" font-weight="700" text-anchor="middle">Old</text>
<text x="613" y="200" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">여러 번 살아남은 소수</text>
<line x1="206" y1="184" x2="218" y2="184" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)"/>
<line x1="452" y1="184" x2="496" y2="184" stroke="#eb6834" stroke-width="1.4" marker-end="url(#aho)"/>
<text x="474" y="172" font-size="10" fill="#eb6834" font-weight="700" text-anchor="middle">나이 15</text>
<text x="34" y="268" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start">① Eden 이 차면 Minor GC — 살아남은 것만 Survivor 로 복사하고 Eden 을 통째로 비운다</text>
<text x="34" y="290" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start">② 두 Survivor 를 번갈아 쓰며 나이를 올린다 — 한쪽으로만 복사하므로 빈 공간이 항상 연속된다</text>
<text x="34" y="312" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start">③ 나이가 임계값(기본 15)을 넘거나 Survivor 가 좁으면 Old 로 승격된다</text>
<line x1="34" y1="330" x2="746" y2="330" stroke="#898781" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="34" y="354" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start">실측 (JDK 17)   500KB × 2,000개 = 약 1 GB 생성  →  GC 8회, 누적 18 ms, 생존 10개</text>
<text x="34" y="378" font-size="11.5" fill="#008300" font-weight="700" text-anchor="start">GC 비용은 '만든 양'이 아니라 '살아남은 양'에 비례한다  —  죽은 것은 아예 건드리지 않는다</text>
</svg>