<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 384" width="780" height="384" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="778" height="382" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">LSP 위반 — 컴파일도 되고 예외도 없이 값만 틀린다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">void resize(Rectangle r) { r.setWidth(5); r.setHeight(4); return r.area(); }</text>
<rect x="34" y="96" width="348" height="214" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="117" font-size="13" fill="#008300" font-weight="700" text-anchor="start">Rectangle 을 넣으면</text>
<text x="48" y="134" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">부모 그대로 — 기대한 대로 동작</text>
<rect x="60" y="150" width="150" height="96" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="135" y="176" font-size="20" fill="#008300" font-weight="700" text-anchor="middle">5 × 4</text>
<text x="135" y="200" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle">가로 5</text>
<text x="135" y="218" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle">세로 4</text>
<text x="236" y="176" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">area()</text>
<text x="236" y="200" font-size="20" fill="#008300" font-weight="700" text-anchor="start">= 20</text>
<text x="236" y="224" font-size="11.5" fill="#008300" font-weight="700" text-anchor="start">기대대로</text>
<text x="60" y="278" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">setWidth(5) → w=5</text>
<text x="60" y="296" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">setHeight(4) → h=4</text>
<rect x="398" y="96" width="348" height="214" rx="9" fill="#e34948" fill-opacity="0.07" stroke="#e34948" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="412" y="117" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">Square 로 바꿔 넣으면</text>
<text x="412" y="134" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">자식인데 부모 자리에서 다르게 동작</text>
<rect x="424" y="150" width="96" height="96" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="472" y="176" font-size="20" fill="#e34948" font-weight="700" text-anchor="middle">4 × 4</text>
<text x="472" y="200" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle">가로 4</text>
<text x="472" y="218" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle">세로 4</text>
<text x="546" y="176" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">area()</text>
<text x="546" y="200" font-size="20" fill="#e34948" font-weight="700" text-anchor="start">= 16</text>
<text x="546" y="224" font-size="11.5" fill="#e34948" font-weight="700" text-anchor="start">기대와 다름</text>
<text x="424" y="278" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">setWidth(5) → w=5, h=5</text>
<text x="424" y="296" font-size="11.5" fill="#e34948" font-weight="700" text-anchor="start">setHeight(4) → w=4, h=4</text>
<text x="34" y="344" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start">가로를 세운 5 가 setHeight(4) 에 덮여 사라졌다  —  부모의 '가로세로를 따로 바꾼다'는 약속을 자식이 어겼다</text>
<text x="34" y="366" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">실측 (JDK 17)   Rectangle 20   /   Square 16   —  컴파일 성공, 예외 없음</text>
</svg>