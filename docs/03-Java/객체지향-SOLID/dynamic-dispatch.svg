<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="778" height="398" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">메서드는 실행 시점, 필드는 컴파일 시점</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">Parent p = new Child();  —  같은 변수인데 결과가 다른 이유</text>
<rect x="34" y="88" width="300" height="40" rx="4" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.3"/>
<text x="184.0" y="113.04" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="middle">Parent p = new Child();</text>
<text x="348" y="113" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">변수 타입 = Parent   /   실제 객체 = Child</text>
<rect x="34" y="150" width="348" height="200" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="171" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start">p.who()  →  "Child"</text>
<text x="48" y="188" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">메서드 = 동적 바인딩 (dynamic binding)</text>
<rect x="56" y="208" width="130" height="34" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="121.0" y="229.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">컴파일 시점</text>
<text x="200" y="230" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">Parent 에 who() 가</text>
<text x="200" y="245" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">있는지만 확인</text>
<line x1="121" y1="248" x2="121" y2="274" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ahb)"/>
<rect x="56" y="280" width="130" height="34" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="121.0" y="301.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">실행 시점</text>
<text x="200" y="296" font-size="11.5" fill="#2a78d6" font-weight="400" text-anchor="start">실제 객체가 Child 임을</text>
<text x="200" y="311" font-size="11.5" fill="#2a78d6" font-weight="700" text-anchor="start">보고 Child.who() 실행</text>
<rect x="398" y="150" width="348" height="200" rx="9" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="412" y="171" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start">p.name  →  "Parent"</text>
<text x="412" y="188" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">필드 = 정적 바인딩 (static binding)</text>
<rect x="420" y="208" width="130" height="34" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="485.0" y="229.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">컴파일 시점</text>
<text x="564" y="224" font-size="11.5" fill="#eb6834" font-weight="400" text-anchor="start">변수 타입 Parent 만 보고</text>
<text x="564" y="239" font-size="11.5" fill="#eb6834" font-weight="700" text-anchor="start">Parent.name 으로 확정</text>
<line x1="420" y1="262" x2="726" y2="262" stroke="#898781" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="420" y="284" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="start">Child 객체 안에 두 필드가 함께 있다</text>
<text x="420" y="303" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">Parent.name = "Parent"   ·   Child.name = "Child"</text>
<text x="420" y="322" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">덮어쓴 것이 아니라 가려진 것 (field hiding)</text>
<text x="34" y="375" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start">실측 (JDK 17)   p.who() = Child   ·   p.name = Parent   ·   ((Child)p).name = Child</text>
</svg>