<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 452" width="780" height="452" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="778" height="450" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">SOLID — 어떤 냄새에 대한 처방인가</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">정의를 외우기보다 '이 증상이 보이면 이 원칙'으로 기억한다</text>
<circle cx="58" cy="111" r="19" fill="#2a78d6" stroke="#2a78d6"/>
<text x="58" y="116.4" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">S</text>
<text x="90" y="105" font-size="13.5" fill="#2a78d6" font-weight="700" text-anchor="start">SRP</text>
<text x="90" y="123" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">단일 책임</text>
<rect x="200" y="90" width="246" height="42" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="212" y="108" font-size="10.5" fill="#e34948" font-weight="700" text-anchor="start">냄새</text>
<text x="212" y="125" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start">한 클래스를 고칠 이유가 여럿이다</text>
<line x1="454" y1="111" x2="480" y2="111" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ahb)"/>
<rect x="488" y="90" width="258" height="42" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="500" y="108" font-size="10.5" fill="#2a78d6" font-weight="700" text-anchor="start">처방</text>
<text x="500" y="125" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start">변경 이유별로 클래스를 나눈다</text>
<circle cx="58" cy="173" r="19" fill="#008300" stroke="#008300"/>
<text x="58" y="178.4" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">O</text>
<text x="90" y="167" font-size="13.5" fill="#008300" font-weight="700" text-anchor="start">OCP</text>
<text x="90" y="185" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">개방-폐쇄</text>
<rect x="200" y="152" width="246" height="42" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="212" y="170" font-size="10.5" fill="#e34948" font-weight="700" text-anchor="start">냄새</text>
<text x="212" y="187" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start">기능 추가마다 같은 if-else 를 고친다</text>
<line x1="454" y1="173" x2="480" y2="173" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)"/>
<rect x="488" y="152" width="258" height="42" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="500" y="170" font-size="10.5" fill="#008300" font-weight="700" text-anchor="start">처방</text>
<text x="500" y="187" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start">인터페이스 + 구현체로 분기를 없앤다</text>
<circle cx="58" cy="235" r="19" fill="#e34948" stroke="#e34948"/>
<text x="58" y="240.4" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">L</text>
<text x="90" y="229" font-size="13.5" fill="#e34948" font-weight="700" text-anchor="start">LSP</text>
<text x="90" y="247" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">리스코프 치환</text>
<rect x="200" y="214" width="246" height="42" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="212" y="232" font-size="10.5" fill="#e34948" font-weight="700" text-anchor="start">냄새</text>
<text x="212" y="249" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start">자식이 부모 메서드를 못 쓰게 막는다</text>
<line x1="454" y1="235" x2="480" y2="235" stroke="#e34948" stroke-width="1.4" marker-end="url(#ahr)"/>
<rect x="488" y="214" width="258" height="42" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="500" y="232" font-size="10.5" fill="#e34948" font-weight="700" text-anchor="start">처방</text>
<text x="500" y="249" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start">상속을 끊고 합성으로 바꾼다</text>
<circle cx="58" cy="297" r="19" fill="#eb6834" stroke="#eb6834"/>
<text x="58" y="302.4" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">I</text>
<text x="90" y="291" font-size="13.5" fill="#eb6834" font-weight="700" text-anchor="start">ISP</text>
<text x="90" y="309" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">인터페이스 분리</text>
<rect x="200" y="276" width="246" height="42" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="212" y="294" font-size="10.5" fill="#e34948" font-weight="700" text-anchor="start">냄새</text>
<text x="212" y="311" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start">안 쓰는 메서드까지 구현하게 만든다</text>
<line x1="454" y1="297" x2="480" y2="297" stroke="#eb6834" stroke-width="1.4" marker-end="url(#aho)"/>
<rect x="488" y="276" width="258" height="42" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="500" y="294" font-size="10.5" fill="#eb6834" font-weight="700" text-anchor="start">처방</text>
<text x="500" y="311" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start">인터페이스를 작게 쪼갠다</text>
<circle cx="58" cy="359" r="19" fill="#7a3ba7" stroke="#7a3ba7"/>
<text x="58" y="364.4" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">D</text>
<text x="90" y="353" font-size="13.5" fill="#7a3ba7" font-weight="700" text-anchor="start">DIP</text>
<text x="90" y="371" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">의존관계 역전</text>
<rect x="200" y="338" width="246" height="42" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="212" y="356" font-size="10.5" fill="#e34948" font-weight="700" text-anchor="start">냄새</text>
<text x="212" y="373" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start">상위 코드가 new 로 구현체를 만든다</text>
<line x1="454" y1="359" x2="480" y2="359" stroke="#7a3ba7" stroke-width="1.4" marker-end="url(#ahp)"/>
<rect x="488" y="338" width="258" height="42" rx="4" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="500" y="356" font-size="10.5" fill="#7a3ba7" font-weight="700" text-anchor="start">처방</text>
<text x="500" y="373" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start">인터페이스에 의존하고 밖에서 주입</text>
<text x="34" y="428" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start">다섯 개 모두 결국 한 가지 말이다  —  변할 것과 변하지 않을 것을 분리하라</text>
</svg>