<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 424" width="780" height="424" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="778" height="422" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">예외 계층 — checked / unchecked 경계는 어디인가</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">컴파일러가 강제하는가, 그리고 호출자가 복구할 수 있는가</text>
<rect x="320" y="84" width="140" height="38" rx="4" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.3"/>
<text x="390.0" y="107.86" font-size="13.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">Throwable</text>
<line x1="390" y1="122" x2="390" y2="142" stroke="#898781" stroke-width="1.4"/>
<line x1="180" y1="142" x2="600" y2="142" stroke="#898781" stroke-width="1.4"/>
<line x1="180" y1="142" x2="180" y2="164" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="600" y1="142" x2="600" y2="164" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="110" y="168" width="140" height="38" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="180.0" y="191.86" font-size="13.5" fill="#e34948" font-weight="600" text-anchor="middle">Error</text>
<text x="180" y="226" font-size="11.5" fill="#e34948" font-weight="700" text-anchor="middle">복구 불가</text>
<text x="180" y="246" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle">OutOfMemoryError</text>
<text x="180" y="264" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle">StackOverflowError</text>
<rect x="530" y="168" width="140" height="38" rx="4" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.3"/>
<text x="600.0" y="191.86" font-size="13.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">Exception</text>
<line x1="600" y1="206" x2="600" y2="222" stroke="#898781" stroke-width="1.4"/>
<line x1="450" y1="222" x2="690" y2="222" stroke="#898781" stroke-width="1.4"/>
<line x1="450" y1="222" x2="450" y2="244" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="690" y1="222" x2="690" y2="244" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="374" y="248" width="152" height="38" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="450.0" y="271.32" font-size="12" fill="#eb6834" font-weight="600" text-anchor="middle">RuntimeException</text>
<text x="450" y="306" font-size="11.5" fill="#eb6834" font-weight="700" text-anchor="middle">unchecked</text>
<text x="450" y="326" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle">NullPointerException</text>
<text x="450" y="343" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle">IllegalArgumentException</text>
<rect x="618" y="248" width="152" height="38" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="694.0" y="271.32" font-size="12" fill="#008300" font-weight="600" text-anchor="middle">그 외 Exception</text>
<text x="694" y="306" font-size="11.5" fill="#008300" font-weight="700" text-anchor="middle">checked</text>
<text x="694" y="326" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle">IOException</text>
<text x="694" y="343" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle">SQLException</text>
<line x1="34" y1="372" x2="746" y2="372" stroke="#898781" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="34" y="396" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start">경계는 RuntimeException 이 긋는다  —  그 아래와 Error 가 unchecked, 나머지 Exception 이 checked</text>
<text x="34" y="416" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">선택 기준은 하나다  —  호출한 쪽이 뭔가 조치할 수 있으면 checked, 코드 버그면 unchecked</text>
</svg>