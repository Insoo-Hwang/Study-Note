<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 392" width="780" height="392" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="778" height="390" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">타입 소거 — 제네릭은 실행 시점에 남지 않는다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">컴파일러가 검사하고, 캐스팅을 대신 넣고, 타입 정보는 지운다</text>
<rect x="34" y="92" width="330" height="190" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="113" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start">내가 쓴 코드</text>
<text x="48" y="130" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">컴파일러가 타입을 검사한다</text>
<text x="52" y="152" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">List&lt;String&gt; list</text>
<text x="52" y="174" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">    = new ArrayList&lt;String&gt;();</text>
<text x="52" y="212" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">list.add("hello");</text>
<text x="52" y="250" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">String s = list.get(0);</text>
<line x1="376" y1="186" x2="412" y2="186" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="394" y="174" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle">javac</text>
<rect x="422" y="92" width="324" height="190" rx="9" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="436" y="113" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start">컴파일된 바이트코드</text>
<text x="436" y="130" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">제네릭이 사라지고 캐스팅이 삽입된다</text>
<text x="440" y="152" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">List list</text>
<text x="440" y="174" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">    = new ArrayList();</text>
<text x="440" y="212" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">list.add("hello");</text>
<text x="440" y="250" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">String s =</text>
<text x="440" y="268" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">  (String) list.get(0);</text>
<text x="34" y="314" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start">결과 — 실행 시점에는 List&lt;String&gt; 과 List&lt;Integer&gt; 를 구별할 방법이 없다</text>
<text x="34" y="338" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">실측 (JDK 17)   ls.getClass() == li.getClass()  →  true   ·   둘 다 java.util.ArrayList</text>
<text x="34" y="362" font-size="11.5" fill="#e34948" font-weight="700" text-anchor="start">그래서 raw 타입으로 Integer 를 넣어도 그 순간엔 조용하고, 꺼낼 때서야 ClassCastException 이 난다</text>
</svg>