<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="778" height="418" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">지연 평가 — 원소 하나가 파이프라인 전체를 통과한다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">Stream.of(1..10).filter(짝수).map(×10).findFirst()</text>
<text x="60" y="106" font-size="12.5" fill="#898781" font-weight="700" text-anchor="middle">원소</text>
<text x="250" y="106" font-size="12.5" fill="#2a78d6" font-weight="700" text-anchor="middle">filter(짝수)</text>
<text x="450" y="106" font-size="12.5" fill="#008300" font-weight="700" text-anchor="middle">map(×10)</text>
<text x="670" y="106" font-size="12.5" fill="#7a3ba7" font-weight="700" text-anchor="middle">findFirst</text>
<rect x="30" y="140" width="60" height="36" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="60.0" y="163.04" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="middle">1</text>
<line x1="96" y1="158" x2="186" y2="158" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="192" y="140" width="116" height="36" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="250.0" y="162.32" font-size="12" fill="#e34948" font-weight="600" text-anchor="middle">탈락 (홀수)</text>
<rect x="30" y="196" width="60" height="36" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="60.0" y="219.04" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="middle">2</text>
<line x1="96" y1="214" x2="186" y2="214" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="192" y="196" width="116" height="36" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="250.0" y="218.32" font-size="12" fill="#008300" font-weight="600" text-anchor="middle">통과</text>
<line x1="314" y1="214" x2="386" y2="214" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="392" y="196" width="116" height="36" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="450.0" y="219.04" font-size="14" fill="#008300" font-weight="600" text-anchor="middle">20</text>
<line x1="514" y1="214" x2="586" y2="214" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="592" y="196" width="156" height="36" rx="4" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="670.0" y="218.14" font-size="11.5" fill="#7a3ba7" font-weight="600" text-anchor="middle">만족 → 즉시 종료</text>
<line x1="30" y1="252" x2="746" y2="252" stroke="#898781" stroke-width="1.4" stroke-dasharray="4,4"/>
<text x="30" y="278" font-size="13" fill="#52514e" font-weight="700" text-anchor="start">3 ~ 10 은 쳐다보지도 않는다</text>
<text x="30" y="300" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">원소 2 가 findFirst 를 만족한 순간 파이프라인 전체가 멈추기 때문이다.</text>
<rect x="34" y="322" width="348" height="68" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="343" font-size="13" fill="#008300" font-weight="700" text-anchor="start">실측 (JDK 17)</text>
<text x="48" y="360" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">filter 2회   ·   map 1회</text>
<rect x="398" y="322" width="348" height="68" rx="9" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="412" y="343" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start">전부 돌았다면</text>
<text x="412" y="360" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">filter 10회   ·   map 5회</text>
</svg>