<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="370" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">for-each 중 remove — 위치에 따라 결과가 다르다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">원소 5개 리스트에서 값 하나를 지울 때 실제로 관찰된 결과 (JDK 17)</text>
<text x="34" y="100" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="start">대상 리스트</text>
<rect x="130" y="86" width="50" height="30" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="155.0" y="105.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">0</text>
<rect x="188" y="86" width="50" height="30" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="213.0" y="105.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">1</text>
<rect x="246" y="86" width="50" height="30" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="271.0" y="105.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">2</text>
<rect x="304" y="86" width="50" height="30" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="329.0" y="105.68" font-size="13" fill="#eb6834" font-weight="600" text-anchor="middle">3</text>
<rect x="362" y="86" width="50" height="30" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="387.0" y="105.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">4</text>
<text x="357" y="132" font-size="10.5" fill="#eb6834" font-weight="700" text-anchor="middle">끝에서 두 번째</text>
<text x="34" y="171" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">값 0 을 삭제</text>
<rect x="130" y="152" width="300" height="26" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="280.0" y="168.96" font-size="11" fill="#e34948" font-weight="600" text-anchor="middle">ConcurrentModificationException</text>
<text x="34" y="204" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">값 1 을 삭제</text>
<rect x="130" y="185" width="300" height="26" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="280.0" y="201.96" font-size="11" fill="#e34948" font-weight="600" text-anchor="middle">ConcurrentModificationException</text>
<text x="34" y="237" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">값 2 을 삭제</text>
<rect x="130" y="218" width="300" height="26" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="280.0" y="234.96" font-size="11" fill="#e34948" font-weight="600" text-anchor="middle">ConcurrentModificationException</text>
<text x="34" y="270" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">값 3 을 삭제</text>
<rect x="130" y="251" width="300" height="26" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="280.0" y="267.96" font-size="11" fill="#eb6834" font-weight="600" text-anchor="middle">예외 없음 — 4개만 순회하고 조용히 종료</text>
<text x="34" y="303" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">값 4 을 삭제</text>
<rect x="130" y="284" width="300" height="26" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="280.0" y="300.96" font-size="11" fill="#e34948" font-weight="600" text-anchor="middle">ConcurrentModificationException</text>
<rect x="454" y="148" width="278" height="165" rx="9" fill="#7a3ba7" fill-opacity="0.07" stroke="#7a3ba7" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="468" y="169" font-size="13" fill="#7a3ba7" font-weight="700" text-anchor="start">왜 3만 통과하는가</text>
<text x="468" y="186" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">hasNext() 는 modCount 를 보지 않는다</text>
<text x="468" y="208" font-size="10.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">public boolean hasNext() {</text>
<text x="468" y="224" font-size="10.5" fill="#7a3ba7" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">    return cursor != size;</text>
<text x="468" y="240" font-size="10.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">}</text>
<text x="468" y="266" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">끝에서 두 번째를 지우면</text>
<text x="468" y="282" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">size 가 줄어 cursor 와 같아진다</text>
<text x="468" y="300" font-size="11" fill="#eb6834" font-weight="700" text-anchor="start">→ next() 가 호출되지 않는다</text>
<text x="34" y="340" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">예외가 나는 쪽이 오히려 안전하다 — 3번은 마지막 원소를 건너뛴 채 성공한 것처럼 끝난다</text>
</svg>