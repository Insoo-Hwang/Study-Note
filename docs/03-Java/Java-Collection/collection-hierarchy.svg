<rect x="198" y="172" width="130" height="28" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="263.0" y="190.5" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">Collection</text>
<line x1="263" y1="200" x2="263" y2="214" stroke="#898781" stroke-width="1.4"/>
<line x1="93" y1="214" x2="433" y2="214" stroke="#898781" stroke-width="1.4"/>
<line x1="93" y1="214" x2="93" y2="232" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="263" y1="214" x2="263" y2="232" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="433" y1="214" x2="433" y2="232" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="38" y="232" width="110" height="28" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="93.0" y="250.5" font-size="12.5" fill="#2a78d6" font-weight="600" text-anchor="middle">List</text>
<text x="93" y="275" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">순서 O · 중복 O</text>
<text x="93" y="297" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">ArrayList</text>
<text x="93" y="316" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">LinkedList</text>
<text x="93" y="335" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">Vector (레거시)</text>
<rect x="208" y="232" width="110" height="28" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="263.0" y="250.5" font-size="12.5" fill="#008300" font-weight="600" text-anchor="middle">Set</text>
<text x="263" y="275" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">순서 X · 중복 X</text>
<text x="263" y="297" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">HashSet</text>
<text x="263" y="316" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">LinkedHashSet</text>
<text x="263" y="335" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">TreeSet</text>
<rect x="378" y="232" width="110" height="28" rx="4" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
