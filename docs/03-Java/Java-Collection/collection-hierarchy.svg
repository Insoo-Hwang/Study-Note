<text x="433" y="297" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">ArrayDeque</text>
<text x="433" y="316" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">PriorityQueue</text>
<text x="433" y="335" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">LinkedList</text>
<rect x="557" y="172" width="130" height="28" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="622.0" y="190.5" font-size="12.5" fill="#eb6834" font-weight="600" text-anchor="middle">Map</text>
<text x="622" y="219" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">키 → 값</text>
<text x="622" y="243" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">HashMap</text>
<text x="622" y="264" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">LinkedHashMap</text>
<text x="622" y="285" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">TreeMap</text>
<text x="622" y="306" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">Hashtable (레거시)</text>
<text x="622" y="337" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">keySet() · values()</text>
<text x="622" y="352" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">entrySet() 뷰로 연결</text>
<text x="38" y="364" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">LinkedList 는 List 와 Deque 를 모두 구현한다</text>
