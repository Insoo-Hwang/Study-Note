<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">Collection Framework 계층</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">Map 만 Collection 바깥에 있고, LinkedList 는 List 이자 Deque 다</text>
<rect x="28" y="80" width="470" height="296" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="42" y="101" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start">Collection 계층</text>
<text x="42" y="118" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">Iterable 을 상속한다</text>
<rect x="512" y="80" width="220" height="296" rx="9" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="526" y="101" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start">Map 계층</text>
<text x="526" y="118" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">Collection 이 아니다</text>
