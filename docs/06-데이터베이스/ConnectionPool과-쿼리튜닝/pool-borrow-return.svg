<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="778" height="378" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">커넥션을 빌리고 반납하는 흐름</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">풀이 다 차면 새로 만들지 않고 기다린다 — 이 대기가 타임아웃을 넘으면 실패한다</text>
<rect x="34" y="100" width="140" height="40" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="104.0" y="124.14" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">getConnection()</text>
<line x1="178" y1="120" x2="208" y2="120" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="214" y="100" width="176" height="40" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="302.0" y="124.14" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="middle">유휴 커넥션 있나?</text>
<line x1="394" y1="120" x2="424" y2="120" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)"/>
<rect x="430" y="100" width="150" height="40" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="505.0" y="124.14" font-size="11.5" fill="#008300" font-weight="600" text-anchor="middle">즉시 대여</text>
<line x1="302" y1="144" x2="302" y2="168" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="310" y="162" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="start">없다</text>
<rect x="214" y="172" width="176" height="40" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="302.0" y="196.14" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="middle">최대치에 안 찼나?</text>
<line x1="394" y1="192" x2="424" y2="192" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)"/>
<rect x="430" y="172" width="150" height="40" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="505.0" y="196.14" font-size="11.5" fill="#008300" font-weight="600" text-anchor="middle">새로 만들어 대여</text>
<line x1="302" y1="216" x2="302" y2="240" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="310" y="234" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="start">찼다</text>
<rect x="214" y="244" width="176" height="40" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="302.0" y="268.14" font-size="11.5" fill="#eb6834" font-weight="600" text-anchor="middle">반납을 기다린다</text>
<line x1="394" y1="264" x2="424" y2="264" stroke="#e34948" stroke-width="1.4" marker-end="url(#ahr)"/>
<rect x="430" y="244" width="290" height="40" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="575.0" y="268.14" font-size="11.5" fill="#e34948" font-weight="600" text-anchor="middle">connectionTimeout 초과 → 예외</text>
<line x1="34" y1="304" x2="746" y2="304" stroke="#898781" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="34" y="328" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start">실측 (풀 2개 · 동시 10건 · 각 400ms · 타임아웃 1초)   성공 6건 / 실패 4건, 최대 대기 811 ms</text>
<text x="34" y="352" font-size="11" fill="#e34948" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">SQLTransientConnectionException: Connection is not available, request timed out after 1005ms</text>
<text x="34" y="374" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">close() 는 끊는 게 아니라 반납이다  —  try-with-resources 를 빠뜨리면 누수가 된다</text>
</svg>