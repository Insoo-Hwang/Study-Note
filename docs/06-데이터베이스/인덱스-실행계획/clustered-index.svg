<text x="48" y="368" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">결과 10,000행 실측  ·  SELECT created_at  5.9 ms   /   SELECT created_at, amount, memo  65.8 ms   =   11배</text>
