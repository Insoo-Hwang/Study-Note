<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">복합 인덱스는 선두 컬럼부터 연속으로만 쓰인다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">CREATE INDEX idx_c ON orders(user_id, status, created_at) · 100만 행 실측</text>
<text x="60" y="100" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="start">조건</text>
<text x="218.0" y="100" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="middle">user_id</text>
<text x="310.0" y="100" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="middle">status</text>
<text x="402.0" y="100" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="middle">created_at</text>
<text x="470" y="100" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="start">실행 계획</text>
<text x="716" y="100" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="end">시간</text>
