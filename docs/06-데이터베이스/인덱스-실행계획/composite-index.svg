<text x="74" y="395" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start">선두 컬럼 user_id 가 있으면 0.1 ms 이하, 없으면 74~83 ms</text>
<text x="74" y="412" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">830배 차이가 컬럼 순서 하나에서 나온다  ·  인덱스 이름이 찍혀도 SEARCH 인지 SCAN 인지를 봐야 한다</text>
