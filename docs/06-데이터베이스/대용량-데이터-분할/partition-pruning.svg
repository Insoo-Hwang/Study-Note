<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="760" height="396" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="394" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">파티셔닝의 이득은 전적으로 프루닝에 달렸다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">100만 행 orders 를 연도별로 분할 — 같은 데이터, 조건만 다르게 실측</text>
<rect x="34" y="80" width="692" height="118" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="101" font-size="13" fill="#008300" font-weight="700" text-anchor="start">조건에 파티션 키가 있다   WHERE created_at LIKE '2024-%'</text>
<text x="48" y="118" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">2024년 파티션(271,000행) 하나만 읽으면 된다</text>
<text x="104" y="147" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="end">단일 테이블</text>
<rect x="116" y="132" width="239.3625" height="21" rx="4" fill="#898781" stroke="#898781" stroke-width="1.3"/>
<text x="363.3625" y="147" font-size="11.5" fill="#898781" font-weight="700" text-anchor="start">147.3 ms</text>
<text x="104" y="177" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="end">파티션 하나만</text>
<rect x="116" y="162" width="58.5" height="21" rx="4" fill="#008300" stroke="#008300" stroke-width="1.3"/>
<text x="182.5" y="177" font-size="11.5" fill="#008300" font-weight="700" text-anchor="start">36.0 ms</text>
<text x="708" y="164" font-size="17" fill="#008300" font-weight="700" text-anchor="end">4.1배 빠름</text>
<rect x="34" y="212" width="692" height="118" rx="9" fill="#e34948" fill-opacity="0.07" stroke="#e34948" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="233" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">조건에 파티션 키가 없다   WHERE status = 'REFUNDED'</text>
<text x="48" y="250" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">어느 파티션에 있을지 알 수 없어 전부 뒤져야 한다</text>
<text x="104" y="279" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="end">단일 테이블</text>
<rect x="116" y="264" width="208.8125" height="21" rx="4" fill="#898781" stroke="#898781" stroke-width="1.3"/>
<text x="332.8125" y="279" font-size="11.5" fill="#898781" font-weight="700" text-anchor="start">128.5 ms</text>
<text x="104" y="309" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="end">전 파티션 순회</text>
<rect x="116" y="294" width="220.675" height="21" rx="4" fill="#e34948" stroke="#e34948" stroke-width="1.3"/>
<text x="344.675" y="309" font-size="11.5" fill="#e34948" font-weight="700" text-anchor="start">135.8 ms</text>
<text x="708" y="296" font-size="17" fill="#e34948" font-weight="700" text-anchor="end">1.06배 느림</text>
<rect x="34" y="344" width="692" height="46" rx="9" fill="#7a3ba7" fill-opacity="0.07" stroke="#7a3ba7" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="365" font-size="13" fill="#7a3ba7" font-weight="700" text-anchor="start">판단 기준은 하나 — 거의 모든 쿼리에 파티션 키가 조건으로 들어가는가</text>
<text x="48" y="382" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">폐기에서는 격차가 더 크다: DELETE 36.4만 행 565.5 ms  vs  DROP PARTITION 32.0 ms (18배)</text>
</svg>