<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="370" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">Snowflake ID — 64비트 안에 시간 · 머신 · 순번을 담는다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">상위 비트가 타임스탬프라서 값이 시간순으로 증가한다</text>
<rect x="44" y="100" width="10.5" height="56" rx="4" fill="#898781" stroke="#898781" stroke-width="1.3"/>
<text x="49.25" y="133" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">0</text>
<text x="49.25" y="176" font-size="11.5" fill="#898781" font-weight="700" text-anchor="middle">항상 0</text>
<rect x="54.5" y="100" width="430.5" height="56" rx="4" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.3"/>
<text x="269.75" y="127" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">타임스탬프 (ms)</text>
<text x="269.75" y="144" font-size="11" fill="#ffffff" font-weight="400" text-anchor="middle">41비트</text>
<text x="269.75" y="176" font-size="11.5" fill="#2a78d6" font-weight="700" text-anchor="middle">약 69년</text>
<rect x="485.0" y="100" width="105.0" height="56" rx="4" fill="#eb6834" stroke="#eb6834" stroke-width="1.3"/>
<text x="537.5" y="127" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">머신 ID</text>
<text x="537.5" y="144" font-size="11" fill="#ffffff" font-weight="400" text-anchor="middle">10비트</text>
<text x="537.5" y="176" font-size="11.5" fill="#eb6834" font-weight="700" text-anchor="middle">서버 1,024대</text>
<rect x="590.0" y="100" width="126.0" height="56" rx="4" fill="#008300" stroke="#008300" stroke-width="1.3"/>
<text x="653.0" y="127" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">시퀀스</text>
<text x="653.0" y="144" font-size="11" fill="#ffffff" font-weight="400" text-anchor="middle">12비트</text>
<text x="653.0" y="176" font-size="11.5" fill="#008300" font-weight="700" text-anchor="middle">ms 당 4,096개</text>
<text x="44" y="90" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">63</text>
<text x="716" y="90" font-size="11" fill="#52514e" font-weight="400" text-anchor="end">0</text>
<text x="380.0" y="90" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle">64비트 부호 있는 정수 하나</text>
<text x="44" y="214" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start">서버당 초당 4,096 x 1,000 = 409만 개를 충돌 없이 발급한다</text>
<rect x="34" y="232" width="350" height="62" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="253" font-size="13" fill="#008300" font-weight="700" text-anchor="start">삽입 성능 — 30만 건 실측</text>
<text x="48" y="270" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">순차 정수 326.9 ms  ·  ULID형 585.1 ms (1.8배)</text>
<text x="48" y="288" font-size="11.5" fill="#e34948" font-weight="700" text-anchor="start">랜덤 UUIDv4 는 5,209.0 ms (15.9배)</text>
<rect x="396" y="232" width="330" height="62" rx="9" fill="#e34948" fill-opacity="0.07" stroke="#e34948" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="410" y="253" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">실무에서 걸리는 두 가지</text>
<text x="410" y="270" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">시계가 뒤로 가면 ID 가 중복될 수 있다</text>
<text x="410" y="288" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">머신 ID 할당도 직접 관리해야 한다</text>
<rect x="34" y="304" width="692" height="46" rx="9" fill="#7a3ba7" fill-opacity="0.07" stroke="#7a3ba7" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="325" font-size="13" fill="#7a3ba7" font-weight="700" text-anchor="start">왜 순차성이 중요한가 — 랜덤 PK 는 B-트리의 임의 위치에 삽입된다</text>
<text x="48" y="342" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">해당 페이지를 디스크에서 읽어 와야 하고, 꽉 차 있으면 페이지 분할이 일어난다</text>
</svg>