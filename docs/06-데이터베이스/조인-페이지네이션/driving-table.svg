<text x="475.0" y="143.5" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">users</text>
<text x="475" y="172" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">VIP 회원 25,000명</text>
<line x1="548" y1="139" x2="588" y2="139" stroke="#e34948" stroke-width="1.6" marker-end="url(#ahr)"/>
<rect x="596" y="122" width="114" height="34" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="653.0" y="143.5" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">orders</text>
<text x="653" y="172" font-size="11.5" fill="#e34948" font-weight="700" text-anchor="middle">25,000번 조회</text>
<rect x="410" y="196" width="300" height="40" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="560" y="221" font-size="18" fill="#e34948" font-weight="700" text-anchor="middle">1,726.6 ms</text>
<text x="560" y="258" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle">안쪽 반복 25,000회</text>
<text x="380" y="300" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="middle">반복 횟수 25배 차이가 시간으로는 283배가 됐다</text>
<rect x="34" y="314" width="692" height="50" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="335" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start">기준은 테이블 크기가 아니라 '조건을 적용한 뒤의 행 수'다</text>
<text x="48" y="352" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">users 10만 행 · orders 100만 행이지만, 조건을 걸면 25,000행 대 1,000행으로 뒤집힌다</text>
