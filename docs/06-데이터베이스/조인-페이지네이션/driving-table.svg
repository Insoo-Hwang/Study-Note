<text x="117.0" y="143.5" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">orders</text>
<text x="117" y="172" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">조건 적용 후 1,000행</text>
<line x1="190" y1="139" x2="232" y2="139" stroke="#008300" stroke-width="1.6" marker-end="url(#ahg)"/>
<rect x="240" y="122" width="118" height="34" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="299.0" y="143.5" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">users</text>
<text x="299" y="172" font-size="11.5" fill="#008300" font-weight="700" text-anchor="middle">1,000번 조회</text>
<rect x="52" y="196" width="306" height="40" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="205" y="221" font-size="18" fill="#008300" font-weight="700" text-anchor="middle">6.1 ms</text>
<text x="205" y="258" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle">안쪽 반복 1,000회</text>
<rect x="392" y="82" width="334" height="196" rx="9" fill="#e34948" fill-opacity="0.07" stroke="#e34948" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="406" y="103" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">users 를 바깥에 둔다</text>
