<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">어느 테이블을 먼저 도느냐로 283배가 갈린다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">같은 결과를 내는 조인 — CROSS JOIN 으로 순서만 강제해 실측</text>
<rect x="34" y="82" width="340" height="196" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="103" font-size="13" fill="#008300" font-weight="700" text-anchor="start">orders 를 바깥에 둔다</text>
