<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">N+1 은 쿼리 횟수의 문제이고, 왕복 지연이 그걸 증폭한다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">주문 1,000건에 회원 이름을 붙이는 같은 작업을 세 방식으로 실측</text>
<line x1="150" y1="214" x2="650" y2="214" stroke="#898781" stroke-width="1.2"/>
<rect x="209.0" y="201.54742857142858" width="88" height="12.452571428571428" rx="4" fill="#008300" stroke="#008300" stroke-width="1.3"/>
