<text x="253.0" y="193.54742857142858" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle">쿼리 1회</text>
<text x="253.0" y="232" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">JOIN 한 번</text>
<rect x="356.0" y="200.52342857142858" width="88" height="13.476571428571429" rx="4" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.3"/>
<text x="400.0" y="178.52342857142858" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="middle">7.37 ms</text>
<text x="400.0" y="192.52342857142858" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle">쿼리 2회</text>
<text x="400.0" y="232" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">IN 절 배치</text>
<rect x="503.0" y="102.84114285714286" width="88" height="111.15885714285714" rx="4" fill="#e34948" stroke="#e34948" stroke-width="1.3"/>
<text x="547.0" y="80.84114285714286" font-size="13" fill="#e34948" font-weight="700" text-anchor="middle">60.79 ms</text>
<text x="547.0" y="94.84114285714286" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle">쿼리 1,001회</text>
<text x="547.0" y="232" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">N+1</text>
<text x="136" y="96" font-size="12" fill="#52514e" font-weight="700" text-anchor="end">실측</text>
<text x="136" y="112" font-size="11" fill="#52514e" font-weight="400" text-anchor="end">(왕복 0)</text>
<text x="34" y="276" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start">여기에 네트워크 왕복 지연을 더하면 — JOIN 은 1회, N+1 은 1,001회 부담한다</text>
<text x="52" y="298" font-size="11" fill="#52514e" font-weight="700" text-anchor="start">조건</text>
