<text x="542" y="322" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">DB 가 같은 머신이라</text>
<text x="542" y="340" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">왕복이 0 에 가깝다</text>
