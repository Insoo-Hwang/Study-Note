<text x="551" y="236" font-size="9.5" fill="#52514e" font-weight="400" text-anchor="start">락 TTL 300ms (여기서 만료)</text>
<line x1="261" y1="102" x2="261" y2="240" stroke="#e34948" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="402" y1="102" x2="402" y2="240" stroke="#e34948" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="30" y="256" width="700" height="50" rx="9" fill="#e34948" fill-opacity="0.07" stroke="#e34948" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="44" y="277" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">실측 — 임계 구역 동시 진입 최대 3명, 겹친 진입 7회</text>
<text x="44" y="294" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">락은 제대로 썼다. TTL 이 만료됐을 뿐인데 상호 배제가 무너졌다. 워치독(TTL 연장)이 필요한 이유다</text>
