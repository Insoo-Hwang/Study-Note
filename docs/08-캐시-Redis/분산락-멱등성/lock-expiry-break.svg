<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">락 TTL 보다 작업이 길면 상호 배제가 깨진다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">락 TTL 300 ms, 작업 900 ms, 스레드 8개 — 임계 구역 동시 진입 최대 3명</text>
<line x1="120" y1="94" x2="684" y2="94" stroke="#898781" stroke-width="1.1"/>
