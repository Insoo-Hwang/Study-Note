<text x="684" y="84" font-size="10" fill="#52514e" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">1200ms</text>
<text x="46" y="126" font-size="12" fill="#2a78d6" font-weight="700" text-anchor="start">스레드 A</text>
<rect x="120" y="108" width="423" height="26" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="331.5" y="124.78" font-size="10.5" fill="#2a78d6" font-weight="600" text-anchor="middle">임계 구역 안</text>
