<text x="410" y="190" font-size="9.5" fill="#52514e" font-weight="400" text-anchor="start">락 TTL 300ms (여기서 만료)</text>
<text x="46" y="218" font-size="12" fill="#e34948" font-weight="700" text-anchor="start">스레드 C</text>
