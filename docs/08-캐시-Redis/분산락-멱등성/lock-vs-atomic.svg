<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 316" width="760" height="316" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="314" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">락으로 할 수 있는 일을 원자 연산으로 하면 89배 빠르다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">카운터 2,000회 증가 (스레드 50개) — 두 방식 모두 결과는 정확히 2,000</text>
<text x="34" y="118" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start">분산 락 + GET/SET</text>
<text x="34" y="136" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">SET NX → GET → SET → EVAL   왕복 4번 + 경합 시 폴링</text>
<rect x="250" y="104" width="340" height="26" rx="4" fill="#e34948" stroke="#e34948" stroke-width="1.3"/>
<text x="600" y="122" font-size="12" fill="#e34948" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">10,765 ms</text>
<text x="726" y="122" font-size="12.5" fill="#e34948" font-weight="700" text-anchor="end">186 req/s</text>
<text x="34" y="184" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start">INCR 원자 연산</text>
<text x="34" y="202" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">INCR   왕복 1번</text>
<rect x="250" y="170" width="4" height="26" rx="4" fill="#008300" stroke="#008300" stroke-width="1.3"/>
<text x="264" y="188" font-size="12" fill="#008300" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">121 ms</text>
<text x="726" y="188" font-size="12.5" fill="#008300" font-weight="700" text-anchor="end">16,479 req/s</text>
<text x="726" y="240" font-size="17" fill="#008300" font-weight="700" text-anchor="end">89배</text>
<text x="34" y="240" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">재고 차감에서도 같았다 — 분산 락 1,750 ms  vs  DECR 96 ms (18배)</text>
<rect x="30" y="258" width="700" height="48" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="44" y="279" font-size="13" fill="#008300" font-weight="700" text-anchor="start">가장 좋은 락은 필요 없는 락이다</text>
<text x="44" y="296" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">INCR / DECR, UPDATE ... WHERE qty &gt; 0, 유니크 제약으로 표현되면 락을 쓰지 않는다</text>
</svg>