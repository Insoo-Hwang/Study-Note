<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">같은 TTL 로 넣으면 같은 순간에 사라진다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">키 10,000개를 서버에서 한 번에 넣고 1초마다 남은 키 수를 측정 (Redis 7.4.10)</text>
<text x="34" y="82" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">모두 TTL 5초</text>
<text x="34" y="98" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">6초 구간에 10,000개가 통째로 사라졌다 — 그 순간 원본이 받는 부하가 최대가 된다</text>
