<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 316" width="760" height="316" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="314" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">같은 데이터를 어떻게 담느냐에 따라 메모리가 3배 차이 난다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">사용자 1,000명의 이름을 세 가지 방법으로 저장하고 used_memory 증가분을 측정</text>
<text x="34" y="109" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start">String 1,000개</text>
<text x="34" y="126" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">user:1:name, user:2:name, …</text>
<rect x="250" y="96" width="300" height="24" rx="4" fill="#e34948" stroke="#e34948" stroke-width="1.3"/>
<text x="560" y="113" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">80,256 B</text>
<text x="726" y="113" font-size="12" fill="#e34948" font-weight="700" text-anchor="end">기준</text>
<text x="34" y="165" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start">Hash 1개 (1,000필드)</text>
<text x="34" y="182" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">hashtable — 512필드를 넘겨 전환됨</text>
<rect x="250" y="152" width="237" height="24" rx="4" fill="#eb6834" stroke="#eb6834" stroke-width="1.3"/>
<text x="497" y="169" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">63,608 B</text>
<text x="726" y="169" font-size="12" fill="#eb6834" font-weight="700" text-anchor="end">1.26배 절약</text>
<text x="34" y="221" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start">Hash 10개 (각 100필드)</text>
<text x="34" y="238" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">listpack — 임계값 아래로 유지됨</text>
<rect x="250" y="208" width="98" height="24" rx="4" fill="#008300" stroke="#008300" stroke-width="1.3"/>
<text x="358" y="225" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">26,352 B</text>
<text x="726" y="225" font-size="12" fill="#008300" font-weight="700" text-anchor="end">3.05배 절약</text>
<rect x="34" y="262" width="692" height="40" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="283" font-size="13" fill="#008300" font-weight="700" text-anchor="start">키를 잘게 쪼개는 것이 아니라, listpack 에 머무를 만큼만 담는 것이 핵심이다</text>
<text x="48" y="300" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">키 1개당 오버헤드가 약 80 B 인데, listpack 원소 1개는 포인터가 없어 약 26 B 다</text>
</svg>