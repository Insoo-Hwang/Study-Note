<text x="48" y="311" font-size="13" fill="#52514e" font-weight="700" text-anchor="start">임계값을 넘는 순간 촘촘한 배열(listpack · intset)을 버리고 포인터가 있는 구조로 바꾼다</text>
<text x="48" y="328" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">OBJECT ENCODING 으로 확인할 수 있다. 임계값 기본값은 버전 · 배포판마다 다르니 CONFIG GET 으로 본다</text>
