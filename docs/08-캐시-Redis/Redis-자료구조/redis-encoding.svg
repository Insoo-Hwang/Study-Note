<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">원소 하나 차이로 메모리가 계단처럼 뛴다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">내부 인코딩이 바뀌는 임계값에서 실측한 MEMORY USAGE (Redis 7.4.10 기본 설정)</text>
<text x="34" y="107" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start" font-family="ui-monospace, Consolas, monospace">Set  정수 512개</text>
