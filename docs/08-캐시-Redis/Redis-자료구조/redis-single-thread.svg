<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="334" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">Redis 싱글 스레드 — 느린 명령 하나가 전부를 세운다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">명령을 실행하는 스레드는 하나뿐이라, 앞의 명령이 끝나야 다음이 시작된다</text>
<text x="34" y="92" font-size="12" fill="#52514e" font-weight="700" text-anchor="start">클라이언트</text>
<rect x="34" y="100" width="104" height="26" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="86.0" y="117.14" font-size="11.5" fill="#e34948" font-weight="600" text-anchor="middle">A  KEYS *</text>
<line x1="142" y1="113" x2="172" y2="113" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="34" y="134" width="104" height="26" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="86.0" y="151.14" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="middle">B  GET</text>
<line x1="142" y1="147" x2="172" y2="147" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="34" y="168" width="104" height="26" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="86.0" y="185.14" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="middle">C  GET</text>
<line x1="142" y1="181" x2="172" y2="181" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="34" y="202" width="104" height="26" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="86.0" y="219.14" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="middle">D  INCR</text>
<line x1="142" y1="215" x2="172" y2="215" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="178" y="86" width="316" height="128" rx="9" fill="#898781" fill-opacity="0.07" stroke="#898781" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="192" y="107" font-size="13" fill="#898781" font-weight="700" text-anchor="start">명령 큐 (도착 순)</text>
<text x="192" y="124" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">먼저 온 순서대로 한 줄로 선다</text>
<rect x="192" y="130" width="96" height="40" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="240.0" y="154.32" font-size="12" fill="#e34948" font-weight="600" text-anchor="middle">KEYS *</text>
<text x="240" y="186" font-size="11" fill="#e34948" font-weight="700" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">158 ms</text>
<rect x="296" y="130" width="56" height="40" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="324.0" y="154.14" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="middle">GET</text>
<rect x="358" y="130" width="56" height="40" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="386.0" y="154.14" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="middle">GET</text>
<rect x="420" y="130" width="56" height="40" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="448.0" y="154.14" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="middle">INCR</text>
<text x="389" y="186" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle">각 0.005 ms 인데 158 ms 를 기다린다</text>
<line x1="498" y1="150" x2="532" y2="150" stroke="#7a3ba7" stroke-width="1.4" marker-end="url(#ahp)"/>
<rect x="538" y="108" width="188" height="84" rx="9" fill="#7a3ba7" fill-opacity="0.07" stroke="#7a3ba7" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="552" y="129" font-size="13" fill="#7a3ba7" font-weight="700" text-anchor="start">실행 스레드 1개</text>
<text x="552" y="146" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">한 번에 하나씩만 처리한다</text>
<text x="632" y="172" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle">io-threads 를 켜도</text>
<text x="632" y="187" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle">이 부분은 그대로다</text>
<rect x="34" y="230" width="692" height="88" rx="9" fill="#e34948" fill-opacity="0.07" stroke="#e34948" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="251" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">실측 — KEYS 를 반복 실행하는 동안 다른 클라이언트의 응답 지연</text>
<text x="48" y="268" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">redis-cli --latency, 키 100만 개, Redis 7.4.10</text>
<text x="48" y="288" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start">한가할 때</text>
<text x="150" y="288" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">평균 0.35 ms   /   최대 2 ms</text>
<text x="48" y="308" font-size="12" fill="#e34948" font-weight="700" text-anchor="start">KEYS 실행 중</text>
<text x="150" y="308" font-size="12" fill="#e34948" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">평균 14.87 ms  /   최대 636 ms</text>
<text x="430" y="288" font-size="12" fill="#52514e" font-weight="700" text-anchor="start">→  평균 42배</text>
<text x="430" y="308" font-size="12" fill="#e34948" font-weight="700" text-anchor="start">→  최대 318배</text>
</svg>