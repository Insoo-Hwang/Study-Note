<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="334" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">트랜잭션 하나가 옛 버전 전체의 정리를 막는다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">옛 버전은 살아 있는 모든 트랜잭션보다 오래돼야 지울 수 있다</text>
<line x1="60" y1="150" x2="700" y2="150" stroke="#898781" stroke-width="1.6"/>
<text x="700" y="168" font-size="11" fill="#52514e" font-weight="400" text-anchor="end">시간</text>
<line x1="300" y1="104" x2="300" y2="176" stroke="#e34948" stroke-width="2"/>
<text x="300" y="96" font-size="11.5" fill="#e34948" font-weight="700" text-anchor="middle">가장 오래된 트랜잭션의 시점</text>
<rect x="60" y="122" width="236" height="26" rx="4" fill="#008300" stroke="#008300" stroke-width="1.3"/>
<text x="178" y="139" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">지워도 된다</text>
<rect x="304" y="122" width="396" height="26" rx="4" fill="#e34948" stroke="#e34948" stroke-width="1.3"/>
<text x="502" y="139" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">누군가 보고 있을 수 있다 — 못 지운다</text>
<text x="60" y="202" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start">읽기 트랜잭션 하나를 안 닫았을 때 (실측, SQLite WAL)</text>
<text x="60" y="232" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">읽기 트랜잭션 없음</text>
<rect x="280" y="218" width="9.069767441860465" height="20" rx="4" fill="#008300" stroke="#008300" stroke-width="1.3"/>
<text x="299.06976744186045" y="233" font-size="12" fill="#008300" font-weight="700" text-anchor="start">0.21 MB</text>
<text x="60" y="262" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">읽기 트랜잭션 하나 유지</text>
<rect x="280" y="248" width="260.0" height="20" rx="4" fill="#e34948" stroke="#e34948" stroke-width="1.3"/>
<text x="550.0" y="263" font-size="12" fill="#e34948" font-weight="700" text-anchor="start">6.02 MB</text>
<text x="660" y="262" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle">28.7배</text>
<text x="34" y="314" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">그 트랜잭션은 아무것도 하지 않았다 — 그냥 열려 있기만 했다.</text>
</svg>