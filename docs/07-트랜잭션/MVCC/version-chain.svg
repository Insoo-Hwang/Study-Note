<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="328" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">테이블에는 최신만, 과거는 언두 로그에 사슬로 매달린다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">InnoDB 는 모든 행에 DB_TRX_ID 와 DB_ROLL_PTR 을 숨겨 둔다</text>
<text x="34" y="106" font-size="12" fill="#2a78d6" font-weight="700" text-anchor="start">테이블</text>
<rect x="34" y="116" width="250" height="56" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="48" y="140" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start">balance = 3000</text>
<text x="48" y="160" font-size="11" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">trx = 300</text>
<text x="34" y="214" font-size="12" fill="#eb6834" font-weight="700" text-anchor="start">언두 로그</text>
<rect x="34" y="224" width="210" height="56" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="48" y="248" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start">balance = 2000</text>
<text x="48" y="268" font-size="11" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">trx = 200</text>
<rect x="280" y="224" width="210" height="56" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="294" y="248" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start">balance = 1000</text>
<text x="294" y="268" font-size="11" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">trx = 100</text>
<rect x="526" y="224" width="210" height="56" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="540" y="248" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start">(체인 끝)</text>
<text x="540" y="268" font-size="11" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">trx = NULL</text>
<line x1="160" y1="176" x2="130" y2="218" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ahb)"/>
<text x="196" y="202" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">DB_ROLL_PTR</text>
<line x1="248" y1="252" x2="274" y2="252" stroke="#eb6834" stroke-width="1.4" marker-end="url(#aho)"/>
<line x1="494" y1="252" x2="520" y2="252" stroke="#eb6834" stroke-width="1.4" marker-end="url(#aho)"/>
<rect x="310" y="108" width="416" height="72" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="326" y="132" font-size="12.5" fill="#008300" font-weight="700" text-anchor="start">Read View 판정</text>
<text x="326" y="152" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">내가 시작하기 전에 커밋됐나?  →  예: 본다</text>
<text x="326" y="170" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">아니오  →  DB_ROLL_PTR 을 따라 내려가서 다시 판정</text>
<text x="34" y="312" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">커밋 안 된 버전도, 내가 시작한 뒤 커밋된 버전도 건너뛴다 — 그래서 팬텀까지 막힌다.</text>
</svg>