<text x="716" y="288" font-size="12" fill="#008300" font-weight="700" text-anchor="end">멱등</text>
<text x="34" y="338" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">PATCH 의 +1 은 몇 번 했는지가 결과에 남고, PUT 의 = 10 은 남지 않는다</text>
