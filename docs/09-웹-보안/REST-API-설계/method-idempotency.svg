<line x1="252" y1="284" x2="288" y2="284" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)"/>
<rect x="300" y="270" width="40" height="26" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
