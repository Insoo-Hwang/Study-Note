<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 314" width="760" height="314" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="312" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">CORS 프리플라이트</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">JSON API 는 사실상 항상 붙는다 — 왕복이 한 번 더 생긴다</text>
<rect x="40" y="92" width="130" height="150" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="105" y="114" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="middle">브라우저</text>
<text x="105" y="132" font-size="10" fill="#52514e" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">shop.example.com</text>
<rect x="600" y="92" width="130" height="150" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="665" y="114" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="middle">서버</text>
<text x="665" y="132" font-size="10" fill="#52514e" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">api.example.com</text>
<line x1="172" y1="160" x2="596" y2="160" stroke="#eb6834" stroke-width="1.4" marker-end="url(#aho)"/>
<text x="190" y="152" font-size="11" fill="#eb6834" font-weight="600" text-anchor="start" font-family="ui-monospace, Consolas, monospace">OPTIONS /orders   Access-Control-Request-Method: DELETE</text>
<line x1="596" y1="186" x2="172" y2="186" stroke="#eb6834" stroke-width="1.4" marker-end="url(#aho)"/>
<text x="190" y="178" font-size="11" fill="#eb6834" font-weight="600" text-anchor="start" font-family="ui-monospace, Consolas, monospace">204   Allow-Origin · Allow-Methods · Max-Age: 3600</text>
<line x1="172" y1="216" x2="596" y2="216" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ahb)"/>
<text x="190" y="208" font-size="11" fill="#2a78d6" font-weight="600" text-anchor="start" font-family="ui-monospace, Consolas, monospace">DELETE /orders/1</text>
<line x1="596" y1="238" x2="172" y2="238" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ahb)"/>
<text x="190" y="230" font-size="11" fill="#2a78d6" font-weight="600" text-anchor="start" font-family="ui-monospace, Consolas, monospace">200 OK</text>
<rect x="28" y="252" width="348" height="48" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="42" y="273" font-size="13" fill="#008300" font-weight="700" text-anchor="start">Max-Age 동안은 다시 안 묻는다</text>
<text x="42" y="290" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">프리플라이트 응답을 캐시한다</text>
<rect x="392" y="252" width="340" height="48" rx="9" fill="#e34948" fill-opacity="0.07" stroke="#e34948" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="406" y="273" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">CORS 오류는 서버 거부가 아니다</text>
<text x="406" y="290" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">서버는 이미 처리했다 — 브라우저가 안 넘긴 것</text>
</svg>