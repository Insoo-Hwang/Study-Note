<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 364" width="760" height="364" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="362" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">비밀번호 해시는 일부러 느리게 만든다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">해시 1회 소요 (로그 스케일) · 느릴수록 공격자의 초당 시도가 줄어든다</text>
<text x="34" y="92" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="start">알고리즘</text>
<text x="502" y="92" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="start">1회 소요</text>
<text x="720" y="92" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="end">공격자 초당 시도</text>
<text x="34" y="125" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">SHA-256 단순</text>
<rect x="186" y="112" width="3.0" height="17" rx="3" fill="#e34948" fill-opacity="0.75" stroke="#e34948"/>
<text x="502" y="125" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">0.388 us</text>
<text x="720" y="125" font-size="11.5" fill="#e34948" font-weight="700" text-anchor="end" font-family="ui-monospace, Consolas, monospace">2,580,440 회</text>
<text x="34" y="155" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">PBKDF2 1,000회</text>
<rect x="186" y="142" width="170.9" height="17" rx="3" fill="#eb6834" fill-opacity="0.75" stroke="#eb6834"/>
<text x="502" y="155" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">1.6 ms</text>
<text x="720" y="155" font-size="11.5" fill="#eb6834" font-weight="700" text-anchor="end" font-family="ui-monospace, Consolas, monospace">623 회</text>
<text x="34" y="185" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">PBKDF2 10,000회</text>
<rect x="186" y="172" width="225.0" height="17" rx="3" fill="#eb6834" fill-opacity="0.75" stroke="#eb6834"/>
<text x="502" y="185" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">22.4 ms</text>
<text x="720" y="185" font-size="11.5" fill="#eb6834" font-weight="700" text-anchor="end" font-family="ui-monospace, Consolas, monospace">44 회</text>
<text x="34" y="215" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">PBKDF2 100,000회</text>
<rect x="186" y="202" width="262.7" height="17" rx="3" fill="#008300" fill-opacity="0.75" stroke="#008300"/>
<text x="502" y="215" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">140.2 ms</text>
<text x="720" y="215" font-size="11.5" fill="#008300" font-weight="700" text-anchor="end" font-family="ui-monospace, Consolas, monospace">7 회</text>
<text x="34" y="245" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">PBKDF2 210,000회</text>
<rect x="186" y="232" width="275.5" height="17" rx="3" fill="#008300" fill-opacity="0.75" stroke="#008300"/>
<text x="502" y="245" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">262.1 ms</text>
<text x="720" y="245" font-size="11.5" fill="#008300" font-weight="700" text-anchor="end" font-family="ui-monospace, Consolas, monospace">3 회</text>
<text x="34" y="275" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">PBKDF2 600,000회</text>
<rect x="186" y="262" width="300.0" height="17" rx="3" fill="#008300" fill-opacity="0.75" stroke="#008300"/>
<text x="502" y="275" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">864.4 ms</text>
<text x="720" y="275" font-size="11.5" fill="#008300" font-weight="700" text-anchor="end" font-family="ui-monospace, Consolas, monospace">1 회</text>
<rect x="28" y="302" width="704" height="48" rx="9" fill="#e34948" fill-opacity="0.07" stroke="#e34948" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="42" y="323" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">SHA-256 이면 8자리 소문자+숫자 전체가 303.7시간</text>
<text x="42" y="340" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">PBKDF2 60만 회면 같은 계산이 223만 배 느려진다 — 공격자는 초당 1회밖에 못 시험한다</text>
</svg>