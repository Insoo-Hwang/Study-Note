<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 308" width="760" height="308" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="306" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">인증과 인가는 순서가 있다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">인증이 '누구인지'를 정하고, 인가가 '해도 되는지'를 정한다</text>
<rect x="34" y="96" width="96" height="64" rx="7" fill="#898781" fill-opacity="0.10" stroke="#898781" stroke-width="1.4"/>
<text x="82.0" y="122" font-size="12.5" fill="#898781" font-weight="700" text-anchor="middle">요청</text>
<line x1="134" y1="128" x2="156" y2="128" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="160" y="96" width="176" height="64" rx="7" fill="#2a78d6" fill-opacity="0.10" stroke="#2a78d6" stroke-width="1.4"/>
<text x="248.0" y="122" font-size="12.5" fill="#2a78d6" font-weight="700" text-anchor="middle">① 인증 필터</text>
<text x="248.0" y="140" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">토큰·세션을 읽어</text>
<text x="248.0" y="154" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">누구인지 정한다</text>
<line x1="340" y1="128" x2="362" y2="128" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="366" y="96" width="176" height="64" rx="7" fill="#eb6834" fill-opacity="0.10" stroke="#eb6834" stroke-width="1.4"/>
<text x="454.0" y="122" font-size="12.5" fill="#eb6834" font-weight="700" text-anchor="middle">② 인가 검사</text>
<text x="454.0" y="140" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">그 사람이 이 자원에</text>
<text x="454.0" y="154" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">접근해도 되는가</text>
<line x1="546" y1="128" x2="568" y2="128" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="572" y="96" width="176" height="64" rx="7" fill="#008300" fill-opacity="0.10" stroke="#008300" stroke-width="1.4"/>
<text x="660.0" y="122" font-size="12.5" fill="#008300" font-weight="700" text-anchor="middle">③ 컨트롤러</text>
<text x="660.0" y="140" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">여기서야 비즈니스</text>
<text x="660.0" y="154" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">로직이 돈다</text>
<line x1="222" y1="168" x2="222" y2="200" stroke="#e34948" stroke-width="1.4" marker-end="url(#ahr)"/>
<text x="210" y="194" font-size="11.5" fill="#e34948" font-weight="700" text-anchor="end">401 Unauthorized — 누군지 모르겠다</text>
<text x="210" y="210" font-size="11" fill="#52514e" font-weight="400" text-anchor="end">다시 로그인하면 해결된다</text>
<line x1="428" y1="168" x2="428" y2="240" stroke="#e34948" stroke-width="1.4" marker-end="url(#ahr)"/>
<text x="440" y="234" font-size="11.5" fill="#e34948" font-weight="700" text-anchor="start">403 Forbidden — 누군지 알지만 권한이 없다</text>
<text x="440" y="250" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">다시 로그인해도 소용없다</text>
<text x="34" y="290" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">소유자 확인을 빠뜨리면 오류도 안 나고 테스트도 통과한다 — 남의 데이터가 보일 뿐이다</text>
</svg>