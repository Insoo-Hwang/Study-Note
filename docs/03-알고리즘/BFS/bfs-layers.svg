<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 392" width="780" height="392" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="778" height="390" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">BFS — 층을 다 비운 뒤에 다음 층으로 넘어간다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">그래프 0─1, 0─2, 1─3, 2─4, 3─5, 4─5 · JDK 17 실측 dist = [0,1,1,2,2,3]</text>
<line x1="250.0" y1="137" x2="195.0" y2="167" stroke="#898781" stroke-width="1.4"/>
<line x1="250.0" y1="137" x2="305.0" y2="167" stroke="#898781" stroke-width="1.4"/>
<line x1="195.0" y1="205" x2="195.0" y2="235" stroke="#898781" stroke-width="1.4"/>
<line x1="305.0" y1="205" x2="305.0" y2="235" stroke="#898781" stroke-width="1.4"/>
<line x1="195.0" y1="273" x2="250.0" y2="303" stroke="#898781" stroke-width="1.4"/>
<line x1="305.0" y1="273" x2="250.0" y2="303" stroke="#898781" stroke-width="1.4"/>
<text x="60" y="123" font-size="12" fill="#7a3ba7" font-weight="700" text-anchor="start">거리 0</text>
<line x1="120" y1="118" x2="160" y2="118" stroke="#7a3ba7" stroke-width="1.2" stroke-dasharray="3 3"/>
<circle cx="250.0" cy="118" r="19" fill="#7a3ba7" stroke="#7a3ba7"/>
<text x="250.0" y="122.86" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">0</text>
<text x="60" y="191" font-size="12" fill="#2a78d6" font-weight="700" text-anchor="start">거리 1</text>
<line x1="120" y1="186" x2="160" y2="186" stroke="#2a78d6" stroke-width="1.2" stroke-dasharray="3 3"/>
<circle cx="195.0" cy="186" r="19" fill="#2a78d6" stroke="#2a78d6"/>
<text x="195.0" y="190.86" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<circle cx="305.0" cy="186" r="19" fill="#2a78d6" stroke="#2a78d6"/>
<text x="305.0" y="190.86" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="60" y="259" font-size="12" fill="#008300" font-weight="700" text-anchor="start">거리 2</text>
<line x1="120" y1="254" x2="160" y2="254" stroke="#008300" stroke-width="1.2" stroke-dasharray="3 3"/>
<circle cx="195.0" cy="254" r="19" fill="#008300" stroke="#008300"/>
<text x="195.0" y="258.86" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<circle cx="305.0" cy="254" r="19" fill="#008300" stroke="#008300"/>
<text x="305.0" y="258.86" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<text x="60" y="327" font-size="12" fill="#eb6834" font-weight="700" text-anchor="start">거리 3</text>
<line x1="120" y1="322" x2="160" y2="322" stroke="#eb6834" stroke-width="1.2" stroke-dasharray="3 3"/>
<circle cx="250.0" cy="322" r="19" fill="#eb6834" stroke="#eb6834"/>
<text x="250.0" y="326.86" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
<rect x="430" y="106" width="316" height="130" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="444" y="127" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start">큐 안의 거리는 항상 두 종류뿐</text>
<text x="444" y="144" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">거리 d 를 전부 꺼낸 뒤에야 d+1 이 나온다</text>
<text x="446" y="160" font-size="11" fill="#0b0b0b" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">[0]</text>
<text x="560" y="160" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">거리 0</text>
<text x="446" y="179" font-size="11" fill="#0b0b0b" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">[1, 2]</text>
<text x="560" y="179" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">거리 1</text>
<text x="446" y="198" font-size="11" fill="#0b0b0b" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">[3, 4]</text>
<text x="560" y="198" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">거리 2</text>
<text x="446" y="217" font-size="11" fill="#0b0b0b" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">[5]</text>
<text x="560" y="217" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">거리 3</text>
<rect x="430" y="248" width="316" height="92" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="444" y="269" font-size="13" fill="#008300" font-weight="700" text-anchor="start">그래서 처음 도달이 곧 최단이다</text>
<text x="444" y="286" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">더 짧은 경로가 있었다면 더 먼저 들어왔을 것이다</text>
<text x="446" y="302" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">한 번 확정한 거리는 갱신하지 않는다.</text>
<text x="446" y="322" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">갱신하는 것은 다익스트라다.</text>
<text x="34" y="372" font-size="11.5" fill="#e34948" font-weight="700" text-anchor="start">단, 간선 가중치가 모두 같을 때만이다 — 실측에서 BFS 는 비용 100 인 경로를 최단이라 답했다 (실제 최소 3)</text>
</svg>