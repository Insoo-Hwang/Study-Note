<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" width="760" height="344" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="342" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">반환값은 크기가 아니라 부호만 읽힌다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">compare(a, b) 의 부호가 a 를 앞에 둘지 뒤에 둘지 결정한다</text>
<rect x="34" y="92" width="208" height="132" rx="9" fill="#e34948" fill-opacity="0.07" stroke="#e34948" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="113" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">음수 반환</text>
<text x="48" y="130" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">a 가 앞에 온다</text>
<text x="48" y="158" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">return -1;  또는  -32;</text>
<text x="48" y="182" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="start">정렬 결과</text>
<rect x="48" y="188" width="84" height="30" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="90.0" y="207.32" font-size="12" fill="#e34948" font-weight="600" text-anchor="middle">a</text>
<rect x="140" y="188" width="84" height="30" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="182.0" y="207.32" font-size="12" fill="#e34948" font-weight="600" text-anchor="middle">b</text>
<rect x="276" y="92" width="208" height="132" rx="9" fill="#898781" fill-opacity="0.07" stroke="#898781" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="290" y="113" font-size="13" fill="#898781" font-weight="700" text-anchor="start">0 반환</text>
<text x="290" y="130" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">순서를 바꾸지 않는다</text>
<text x="290" y="158" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">return 0;</text>
<text x="290" y="182" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="start">정렬 결과</text>
<rect x="290" y="188" width="84" height="30" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="332.0" y="207.32" font-size="12" fill="#898781" font-weight="600" text-anchor="middle">a</text>
<rect x="382" y="188" width="84" height="30" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="424.0" y="207.32" font-size="12" fill="#898781" font-weight="600" text-anchor="middle">b</text>
<rect x="518" y="92" width="208" height="132" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="532" y="113" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start">양수 반환</text>
<text x="532" y="130" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">a 가 뒤로 간다</text>
<text x="532" y="158" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">return 1;  또는  1000;</text>
<text x="532" y="182" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="start">정렬 결과</text>
<rect x="532" y="188" width="84" height="30" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="574.0" y="207.32" font-size="12" fill="#2a78d6" font-weight="600" text-anchor="middle">b</text>
<rect x="624" y="188" width="84" height="30" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="666.0" y="207.32" font-size="12" fill="#2a78d6" font-weight="600" text-anchor="middle">a</text>
<text x="34" y="254" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start">실측 확인 — 반환값의 크기는 제각각이지만 정렬 결과에는 부호만 반영된다</text>
<text x="34" y="276" font-size="11" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">"apple".compareTo("banana") = −1   /   "abc".compareTo("ab") = 1   /   "Apple".compareTo("apple") = −32</text>
<rect x="34" y="290" width="692" height="44" rx="9" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="328" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">그래서 a − b 로 만들면 안 된다. 오버플로로 부호가 뒤집혀 예외 없이 틀린 순서가 나온다 (Integer.compare 사용).</text>
</svg>