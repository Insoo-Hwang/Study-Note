<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="778" height="428" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">Arrays.sort 는 자료형에 따라 다른 알고리즘으로 갈라진다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">JDK 17.0.12 에서 리플렉션으로 직접 읽은 임계값</text>
<rect x="285" y="88" width="210" height="38" rx="4" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.3"/>
<text x="390.0" y="111.86" font-size="13.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">Arrays.sort(...)</text>
<line x1="340" y1="128" x2="205" y2="158" stroke="#eb6834" stroke-width="1.4" marker-end="url(#aho)"/>
<line x1="440" y1="128" x2="578" y2="158" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ahb)"/>
<rect x="34" y="162" width="348" height="224" rx="9" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="183" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start">기본형  int[] long[] double[] ...</text>
<text x="48" y="200" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">DualPivotQuicksort · 불안정 · 추가 메모리 O(log n)</text>
<rect x="50" y="214" width="316" height="32" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="208.0" y="234.32" font-size="12" fill="#0b0b0b" font-weight="500" text-anchor="middle">크기 ≤ 44 → 삽입 정렬</text>
<rect x="50" y="252" width="316" height="32" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="208.0" y="272.32" font-size="12" fill="#0b0b0b" font-weight="500" text-anchor="middle">크기 ≤ 65 → 혼합 삽입 정렬</text>
<rect x="50" y="290" width="316" height="32" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="208.0" y="310.32" font-size="12" fill="#0b0b0b" font-weight="500" text-anchor="middle">크기 ≥ 4096 → 정렬된 구간(run) 먼저 확인</text>
<rect x="50" y="328" width="316" height="32" rx="4" fill="#fdeee7" stroke="#e34948" stroke-width="1.3"/>
<text x="208.0" y="348.32" font-size="12" fill="#e34948" font-weight="600" text-anchor="middle">깊이 카운터 &gt; 384 → 힙 정렬로 전환</text>
<rect x="398" y="162" width="348" height="224" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="412" y="183" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start">객체  Integer[] String[] List&lt;T&gt; ...</text>
<text x="412" y="200" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">TimSort · 안정 · 추가 메모리 O(n)</text>
<rect x="414" y="214" width="316" height="32" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="572.0" y="234.32" font-size="12" fill="#0b0b0b" font-weight="500" text-anchor="middle">이미 정렬된 구간(run)을 먼저 찾는다</text>
<rect x="414" y="252" width="316" height="32" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="572.0" y="272.32" font-size="12" fill="#0b0b0b" font-weight="500" text-anchor="middle">run 이 32 미만 → 이진 삽입 정렬로 채움</text>
<rect x="414" y="290" width="316" height="32" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="572.0" y="310.32" font-size="12" fill="#0b0b0b" font-weight="500" text-anchor="middle">run 들을 크기 균형에 맞춰 병합</text>
<rect x="414" y="328" width="316" height="32" rx="4" fill="#e7f0fb" stroke="#008300" stroke-width="1.3"/>
<text x="572.0" y="348.32" font-size="12" fill="#008300" font-weight="600" text-anchor="middle">정렬된 입력이면 O(n) — 실측 약 93배 빠름</text>
<text x="34" y="406" font-size="11.5" fill="#e34948" font-weight="700" text-anchor="start">널리 인용되는 임계값 47 · 286 은 JDK 13 이전 값이다. JDK 14 에서 전면 재작성되었다.</text>
</svg>