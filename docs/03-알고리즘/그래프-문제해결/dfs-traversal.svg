<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="778" height="418" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">DFS — 깊이부터 내려가고 막히면 되돌아온다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">방문 순서 0 → 1 → 3 → 4 → 2 → 5 → 6 (JDK 17 실측)</text>
<line x1="200" y1="140" x2="120" y2="170" stroke="#898781" stroke-width="1.4"/>
<line x1="200" y1="140" x2="280" y2="170" stroke="#898781" stroke-width="1.4"/>
<line x1="120" y1="210" x2="80" y2="242" stroke="#898781" stroke-width="1.4"/>
<line x1="120" y1="210" x2="160" y2="242" stroke="#898781" stroke-width="1.4"/>
<line x1="280" y1="210" x2="240" y2="242" stroke="#898781" stroke-width="1.4"/>
<line x1="280" y1="210" x2="320" y2="242" stroke="#898781" stroke-width="1.4"/>
<circle cx="200" cy="120" r="20" fill="#2a78d6" stroke="#2a78d6"/>
<text x="200" y="124.86" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">0</text>
<text x="174" y="104" font-size="10" fill="#eb6834" font-weight="700" text-anchor="middle">#1</text>
<circle cx="120" cy="190" r="20" fill="#2a78d6" stroke="#2a78d6"/>
<text x="120" y="194.86" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="94" y="174" font-size="10" fill="#eb6834" font-weight="700" text-anchor="middle">#2</text>
<circle cx="280" cy="190" r="20" fill="#2a78d6" stroke="#2a78d6"/>
<text x="280" y="194.86" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="254" y="174" font-size="10" fill="#eb6834" font-weight="700" text-anchor="middle">#5</text>
<circle cx="80" cy="262" r="20" fill="#2a78d6" stroke="#2a78d6"/>
<text x="80" y="266.86" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="54" y="246" font-size="10" fill="#eb6834" font-weight="700" text-anchor="middle">#3</text>
<circle cx="160" cy="262" r="20" fill="#2a78d6" stroke="#2a78d6"/>
<text x="160" y="266.86" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<text x="134" y="246" font-size="10" fill="#eb6834" font-weight="700" text-anchor="middle">#4</text>
<circle cx="240" cy="262" r="20" fill="#2a78d6" stroke="#2a78d6"/>
<text x="240" y="266.86" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
<text x="214" y="246" font-size="10" fill="#eb6834" font-weight="700" text-anchor="middle">#6</text>
<circle cx="320" cy="262" r="20" fill="#2a78d6" stroke="#2a78d6"/>
<text x="320" y="266.86" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">6</text>
<text x="294" y="246" font-size="10" fill="#eb6834" font-weight="700" text-anchor="middle">#7</text>
<text x="60" y="320" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">동그라미 안 = 정점 번호   /   왼쪽 위 #n = 방문 순서</text>
<rect x="400" y="96" width="346" height="210" rx="9" fill="#7a3ba7" fill-opacity="0.07" stroke="#7a3ba7" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="414" y="117" font-size="13" fill="#7a3ba7" font-weight="700" text-anchor="start">호출 스택 (정점 3 에 도달했을 때)</text>
<text x="414" y="134" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">막다른 길에서 가장 최근 갈림길로 되돌아온다</text>
<rect x="418" y="148" width="56" height="36" rx="4" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="446.0" y="171.04" font-size="14" fill="#7a3ba7" font-weight="600" text-anchor="middle">3</text>
<text x="486" y="170" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">막다른 길 — 복귀</text>
<rect x="418" y="194" width="56" height="36" rx="4" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="446.0" y="217.04" font-size="14" fill="#7a3ba7" font-weight="600" text-anchor="middle">1</text>
<text x="486" y="216" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">아직 4 가 남음</text>
<rect x="418" y="240" width="56" height="36" rx="4" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="446.0" y="263.04" font-size="14" fill="#7a3ba7" font-weight="600" text-anchor="middle">0</text>
<text x="486" y="262" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">아직 2 가 남음</text>
<text x="418" y="296" font-size="10" fill="#7a3ba7" font-weight="700" text-anchor="start">top</text>
<line x1="404" y1="152" x2="404" y2="132" stroke="#7a3ba7" stroke-width="1.4" marker-end="url(#ahp)"/>
<rect x="34" y="334" width="712" height="74" rx="9" fill="#e34948" fill-opacity="0.07" stroke="#e34948" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="355" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">재귀와 명시적 스택은 방문 순서가 다르다</text>
<text x="48" y="372" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">스택은 LIFO 라 인접 리스트를 그대로 push 하면 뒤집힌다</text>
<text x="48" y="390" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">재귀 0 1 3 4 2 5 6   /   그대로 push 0 2 6 5 1 4 3   /   역순 push 0 1 3 4 2 5 6</text>
</svg>