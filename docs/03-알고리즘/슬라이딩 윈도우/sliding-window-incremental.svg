<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="778" height="398" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">슬라이딩 윈도우 — 바뀌는 건 양 끝 두 개뿐</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">배열 [3 1 4 1 5 9 2] · 창 크기 k = 3</text>
<text x="209.0" y="88" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">0</text>
<text x="291.0" y="88" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">1</text>
<text x="373.0" y="88" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">2</text>
<text x="455.0" y="88" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">3</text>
<text x="537.0" y="88" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">4</text>
<text x="619.0" y="88" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">5</text>
<text x="701.0" y="88" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">6</text>
<text x="34" y="120" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start">첫 창</text>
<text x="34" y="138" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">합 = 3+1+4 = 8</text>
<rect x="172" y="100" width="74" height="38" rx="4" fill="#e7f0fb" stroke="#2a78d6" stroke-width="1.3"/>
<text x="209.0" y="123.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">3</text>
<rect x="254" y="100" width="74" height="38" rx="4" fill="#e7f0fb" stroke="#2a78d6" stroke-width="1.3"/>
<text x="291.0" y="123.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">1</text>
<rect x="336" y="100" width="74" height="38" rx="4" fill="#e7f0fb" stroke="#2a78d6" stroke-width="1.3"/>
<text x="373.0" y="123.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">4</text>
<rect x="418" y="100" width="74" height="38" rx="4" fill="#ffffff" stroke="#d5d3cf" stroke-width="1.3"/>
<text x="455.0" y="123.68" font-size="13" fill="#a8a6a2" font-weight="600" text-anchor="middle">1</text>
<rect x="500" y="100" width="74" height="38" rx="4" fill="#ffffff" stroke="#d5d3cf" stroke-width="1.3"/>
<text x="537.0" y="123.68" font-size="13" fill="#a8a6a2" font-weight="600" text-anchor="middle">5</text>
<rect x="582" y="100" width="74" height="38" rx="4" fill="#ffffff" stroke="#d5d3cf" stroke-width="1.3"/>
<text x="619.0" y="123.68" font-size="13" fill="#a8a6a2" font-weight="600" text-anchor="middle">9</text>
<rect x="664" y="100" width="74" height="38" rx="4" fill="#ffffff" stroke="#d5d3cf" stroke-width="1.3"/>
<text x="701.0" y="123.68" font-size="13" fill="#a8a6a2" font-weight="600" text-anchor="middle">2</text>
<text x="172" y="160" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">여기만 O(k) — 이후로는 전부 O(1)</text>
<text x="34" y="202" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start">한 칸 이동</text>
<text x="34" y="220" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">합 = 8 − 3 + 1 = 6</text>
<rect x="172" y="182" width="74" height="38" rx="4" fill="#fdeee7" stroke="#e34948" stroke-width="1.3"/>
<text x="209.0" y="205.68" font-size="13" fill="#e34948" font-weight="600" text-anchor="middle">3</text>
<rect x="254" y="182" width="74" height="38" rx="4" fill="#e7f0fb" stroke="#2a78d6" stroke-width="1.3"/>
<text x="291.0" y="205.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">1</text>
<rect x="336" y="182" width="74" height="38" rx="4" fill="#e7f0fb" stroke="#2a78d6" stroke-width="1.3"/>
<text x="373.0" y="205.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">4</text>
<rect x="418" y="182" width="74" height="38" rx="4" fill="#eaf5ea" stroke="#008300" stroke-width="1.3"/>
<text x="455.0" y="205.68" font-size="13" fill="#008300" font-weight="600" text-anchor="middle">1</text>
<rect x="500" y="182" width="74" height="38" rx="4" fill="#ffffff" stroke="#d5d3cf" stroke-width="1.3"/>
<text x="537.0" y="205.68" font-size="13" fill="#a8a6a2" font-weight="600" text-anchor="middle">5</text>
<rect x="582" y="182" width="74" height="38" rx="4" fill="#ffffff" stroke="#d5d3cf" stroke-width="1.3"/>
<text x="619.0" y="205.68" font-size="13" fill="#a8a6a2" font-weight="600" text-anchor="middle">9</text>
<rect x="664" y="182" width="74" height="38" rx="4" fill="#ffffff" stroke="#d5d3cf" stroke-width="1.3"/>
<text x="701.0" y="205.68" font-size="13" fill="#a8a6a2" font-weight="600" text-anchor="middle">2</text>
<text x="209.0" y="242" font-size="10.5" fill="#e34948" font-weight="700" text-anchor="middle">나감 −3</text>
<text x="455.0" y="242" font-size="10.5" fill="#008300" font-weight="700" text-anchor="middle">들어옴 +1</text>
<text x="254" y="262" font-size="11.5" fill="#2a78d6" font-weight="700" text-anchor="start">가운데 [1][4] 는 그대로다 — 다시 더할 필요가 없다</text>
<rect x="34" y="278" width="356" height="62" rx="9" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="299" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start">매번 다시 계산</text>
<text x="48" y="316" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">이동마다 k번 덧셈 → O(n × k)</text>
<text x="48" y="330" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">n=20만, k=1000 실측 : 58.90 ms</text>
<rect x="406" y="278" width="340" height="62" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="420" y="299" font-size="13" fill="#008300" font-weight="700" text-anchor="start">슬라이딩 윈도우</text>
<text x="420" y="316" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">이동마다 2번 연산 → O(n)</text>
<text x="420" y="330" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">같은 조건 실측 : 1.6131 ms</text>
<text x="34" y="368" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start">창 크기 k 와 무관하다 — '최근 1분'이든 '최근 24시간'이든 비용이 같다 (약 37배 차이)</text>
</svg>