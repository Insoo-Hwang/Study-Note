<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 767" width="880" height="767" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="878" height="765" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">01. 복잡도 · 자료구조 — 한 장 요약</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">노트 6개의 핵심을 한 장으로 — 무엇으로 재고, 무엇을 고르고, 왜 그렇게 고르는가</text>
<rect x="32" y="84" width="254.7" height="34" rx="8" fill="#2a78d6" fill-opacity="0.09" stroke="#2a78d6" stroke-opacity="0.35" stroke-width="1.1"/>
<text x="159.33333333333331" y="106" font-size="12.5" fill="#2a78d6" font-weight="700" text-anchor="middle">① 비용을 재는 자를 갖고</text>
<line x1="291.66666666666663" y1="101" x2="306.66666666666663" y2="101" stroke="#898781" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="312.66666666666663" y="84" width="254.7" height="34" rx="8" fill="#eb6834" fill-opacity="0.09" stroke="#eb6834" stroke-opacity="0.35" stroke-width="1.1"/>
<text x="439.99999999999994" y="106" font-size="12.5" fill="#eb6834" font-weight="700" text-anchor="middle">② 구조의 성질을 알고</text>
<line x1="572.3333333333333" y1="101" x2="587.3333333333333" y2="101" stroke="#898781" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="593.3333333333333" y="84" width="254.7" height="34" rx="8" fill="#008300" fill-opacity="0.09" stroke="#008300" stroke-opacity="0.35" stroke-width="1.1"/>
<text x="720.6666666666666" y="106" font-size="12.5" fill="#008300" font-weight="700" text-anchor="middle">③ 네 질문으로 고른다</text>
<rect x="32" y="140" width="402" height="155" rx="10" fill="#ffffff" stroke="rgba(11,11,11,0.13)" stroke-width="1.2"/>
<path d="M32 150 a10,10 0 0 1 10,-10 h0 v155 h0 a10,10 0 0 1 -10,-10 Z" fill="#2a78d6"/>
<text x="52" y="166" font-size="15" fill="#2a78d6" font-weight="700" text-anchor="start">시간 복잡도와 공간 복잡도</text>
<text x="418" y="166" font-size="14" fill="#898781" font-weight="700" text-anchor="end">①</text>
<text x="52" y="187" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">실행 시간이 아니라 입력이 커질 때의 증가율을 본다</text>
<line x1="52" y1="198" x2="420" y2="198" stroke="rgba(11,11,11,0.09)" stroke-width="1"/>
<circle cx="55" cy="215" r="2.4" fill="#2a78d6" fill-opacity="0.65"/>
<text x="65" y="219" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">O(1) &lt; O(log n) &lt; O(n) &lt; O(n log n) &lt; O(n²)</text>
<circle cx="55" cy="234.5" r="2.4" fill="#2a78d6" fill-opacity="0.65"/>
<text x="65" y="238.5" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">시간은 연산 횟수 · 공간은 추가 메모리, 항상 같이 본다</text>
<circle cx="55" cy="254.0" r="2.4" fill="#2a78d6" fill-opacity="0.65"/>
<text x="65" y="258.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">같은 알고리즘도 최선 · 평균 · 최악이 다르다</text>
<circle cx="55" cy="273.5" r="2.4" fill="#2a78d6" fill-opacity="0.65"/>
<text x="65" y="277.5" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">메모리를 더 써서 시간을 줄이는 트레이드오프가 핵심</text>
<rect x="446" y="140" width="402" height="155" rx="10" fill="#ffffff" stroke="rgba(11,11,11,0.13)" stroke-width="1.2"/>
<path d="M446 150 a10,10 0 0 1 10,-10 h0 v155 h0 a10,10 0 0 1 -10,-10 Z" fill="#2a78d6"/>
<text x="466" y="166" font-size="15" fill="#2a78d6" font-weight="700" text-anchor="start">Amortized Analysis</text>
<text x="832" y="166" font-size="14" fill="#898781" font-weight="700" text-anchor="end">①</text>
<text x="466" y="187" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">한 번의 최악이 아니라 연속 n번의 총합으로 나눈다</text>
<line x1="466" y1="198" x2="834" y2="198" stroke="rgba(11,11,11,0.09)" stroke-width="1"/>
<circle cx="469" cy="215" r="2.4" fill="#2a78d6" fill-opacity="0.65"/>
<text x="479" y="219" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">ArrayList.add는 최악 O(n)이지만 상각 O(1)</text>
<circle cx="469" cy="234.5" r="2.4" fill="#2a78d6" fill-opacity="0.65"/>
<text x="479" y="238.5" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">용량을 일정 배율로 늘리면 복사 비용이 분산된다</text>
<circle cx="469" cy="254.0" r="2.4" fill="#2a78d6" fill-opacity="0.65"/>
<text x="479" y="258.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">입력 확률을 가정하는 평균 분석과는 다르다</text>
<circle cx="469" cy="273.5" r="2.4" fill="#2a78d6" fill-opacity="0.65"/>
<text x="479" y="277.5" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">상각 O(1)이 매 연산이 빠르다는 뜻은 아니다</text>
<rect x="32" y="307" width="402" height="155" rx="10" fill="#ffffff" stroke="rgba(11,11,11,0.13)" stroke-width="1.2"/>
<path d="M32 317 a10,10 0 0 1 10,-10 h0 v155 h0 a10,10 0 0 1 -10,-10 Z" fill="#eb6834"/>
<text x="52" y="333" font-size="15" fill="#eb6834" font-weight="700" text-anchor="start">선형 자료구조 비교</text>
<text x="418" y="333" font-size="14" fill="#898781" font-weight="700" text-anchor="end">②</text>
<text x="52" y="354" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">연속된 배열이거나, 흩어진 노드를 연결한 것이거나</text>
<line x1="52" y1="365" x2="420" y2="365" stroke="rgba(11,11,11,0.09)" stroke-width="1"/>
<circle cx="55" cy="382" r="2.4" fill="#eb6834" fill-opacity="0.65"/>
<text x="65" y="386" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">배열 계열은 인덱스 조회 O(1) · 중간 삽입은 밀기 O(n)</text>
<circle cx="55" cy="401.5" r="2.4" fill="#eb6834" fill-opacity="0.65"/>
<text x="65" y="405.5" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">노드 계열은 양 끝 조작 O(1) · 인덱스 접근은 O(n)</text>
<circle cx="55" cy="421.0" r="2.4" fill="#eb6834" fill-opacity="0.65"/>
<text x="65" y="425.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">Stack · Queue · Deque는 저장 구조가 아닌 접근 규칙</text>
<circle cx="55" cy="440.5" r="2.4" fill="#eb6834" fill-opacity="0.65"/>
<text x="65" y="444.5" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">Java 표준은 ArrayDeque (Stack · LinkedList는 비권장)</text>
<rect x="446" y="307" width="402" height="155" rx="10" fill="#ffffff" stroke="rgba(11,11,11,0.13)" stroke-width="1.2"/>
<path d="M446 317 a10,10 0 0 1 10,-10 h0 v155 h0 a10,10 0 0 1 -10,-10 Z" fill="#eb6834"/>
<text x="466" y="333" font-size="15" fill="#eb6834" font-weight="700" text-anchor="start">해시와 트리 비교</text>
<text x="832" y="333" font-size="14" fill="#898781" font-weight="700" text-anchor="end">②</text>
<text x="466" y="354" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">정확히 찾기만 하면 Hash, 순서와 범위가 필요하면 Tree</text>
<line x1="466" y1="365" x2="834" y2="365" stroke="rgba(11,11,11,0.09)" stroke-width="1"/>
<circle cx="469" cy="382" r="2.4" fill="#eb6834" fill-opacity="0.65"/>
<text x="479" y="386" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">HashMap은 위치를 계산 → 평균 O(1), 대신 순서가 없다</text>
<circle cx="469" cy="401.5" r="2.4" fill="#eb6834" fill-opacity="0.65"/>
<text x="479" y="405.5" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">TreeMap은 정렬 유지 → O(log n), 범위 · 순회에 강하다</text>
<circle cx="469" cy="421.0" r="2.4" fill="#eb6834" fill-opacity="0.65"/>
<text x="479" y="425.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">LinkedHashMap은 해시 속도 + 삽입(접근) 순서 기억</text>
<circle cx="469" cy="440.5" r="2.4" fill="#eb6834" fill-opacity="0.65"/>
<text x="479" y="444.5" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">Set은 값을 키 자리에 넣은 Map일 뿐이다</text>
<rect x="32" y="474" width="402" height="155" rx="10" fill="#ffffff" stroke="rgba(11,11,11,0.13)" stroke-width="1.2"/>
<path d="M32 484 a10,10 0 0 1 10,-10 h0 v155 h0 a10,10 0 0 1 -10,-10 Z" fill="#7a3ba7"/>
<text x="52" y="500" font-size="15" fill="#7a3ba7" font-weight="700" text-anchor="start">Heap과 PriorityQueue</text>
<text x="418" y="500" font-size="14" fill="#898781" font-weight="700" text-anchor="end">②</text>
<text x="52" y="521" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">전체 정렬이 아니라 가장 급한 하나만 앞에 두는 부분 정렬</text>
<line x1="52" y1="532" x2="420" y2="532" stroke="rgba(11,11,11,0.09)" stroke-width="1"/>
<circle cx="55" cy="549" r="2.4" fill="#7a3ba7" fill-opacity="0.65"/>
<text x="65" y="553" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">부모-자식 순서만 지키고 형제끼리는 순서가 없다</text>
<circle cx="55" cy="568.5" r="2.4" fill="#7a3ba7" fill-opacity="0.65"/>
<text x="65" y="572.5" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">조회 O(1) · 삽입/삭제 O(log n) · 배열 하나로 구현</text>
<circle cx="55" cy="588.0" r="2.4" fill="#7a3ba7" fill-opacity="0.65"/>
<text x="65" y="592.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">Top-K에서 O(n log n)을 O(n log K)로 줄인다</text>
<circle cx="55" cy="607.5" r="2.4" fill="#7a3ba7" fill-opacity="0.65"/>
<text x="65" y="611.5" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">PriorityQueue는 최소 힙 기본, 순회 순서 ≠ 정렬 순서</text>
<rect x="446" y="474" width="402" height="155" rx="10" fill="#ffffff" stroke="rgba(11,11,11,0.13)" stroke-width="1.2"/>
<path d="M446 484 a10,10 0 0 1 10,-10 h0 v155 h0 a10,10 0 0 1 -10,-10 Z" fill="#008300"/>
<text x="466" y="500" font-size="15" fill="#008300" font-weight="700" text-anchor="start">Collection 선택 기준</text>
<text x="832" y="500" font-size="14" fill="#898781" font-weight="700" text-anchor="end">③</text>
<text x="466" y="521" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">인터페이스를 먼저 정하고, 그다음 구현체를 고른다</text>
<line x1="466" y1="532" x2="834" y2="532" stroke="rgba(11,11,11,0.09)" stroke-width="1"/>
<circle cx="469" cy="549" r="2.4" fill="#008300" fill-opacity="0.65"/>
<text x="479" y="553" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">중복 · 순서 · 접근 방식 · 동시성 네 질문으로 좁힌다</text>
<circle cx="469" cy="568.5" r="2.4" fill="#008300" fill-opacity="0.65"/>
<text x="479" y="572.5" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">기본값 4개 — ArrayList · HashSet · HashMap · ArrayDeque</text>
<circle cx="469" cy="588.0" r="2.4" fill="#008300" fill-opacity="0.65"/>
<text x="479" y="592.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">잘못 고르면 대가가 크다 (contains 실측 2,000배 차이)</text>
<circle cx="469" cy="607.5" r="2.4" fill="#008300" fill-opacity="0.65"/>
<text x="479" y="611.5" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">순서와 null 허용 여부는 반드시 명시적으로 확인한다</text>
<rect x="32" y="651" width="816" height="90" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="46" y="672" font-size="13" fill="#008300" font-weight="700" text-anchor="start">이 섹션의 결론</text>
<text x="48" y="695" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">복잡도는 순위표가 아니라 판단 기준이다 — 데이터 크기 · 조회 횟수 · 동시 요청 수를 먼저 확인한다.</text>
<text x="48" y="715" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">구조는 결국 넷이다 — 연속(배열) · 연결(노드) · 계산(해시) · 정렬(트리), 여기에 부분 정렬(힙)이 붙는다.</text>
<text x="48" y="735" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">선택은 기본값 4개로 시작하고, 그것으로 안 되는 이유를 측정으로 증명한 뒤에만 바꾼다.</text>
</svg>