<text x="726" y="180" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="end">1,000배 이상</text>
<text x="258" y="206" font-size="11" fill="#52514e" font-weight="400" text-anchor="end" font-family="ui-monospace, Consolas, monospace">LinkedList get(i)</text>
