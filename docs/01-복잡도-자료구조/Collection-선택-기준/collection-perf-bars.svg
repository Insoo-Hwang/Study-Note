<text x="44" y="425" font-size="11.5" fill="#7a3ba7" font-weight="700" text-anchor="start">복잡도를 바꾸는 선택 (위 두 개) 은 1,000배 단위 — 반드시 잡는다</text>
<text x="44" y="442" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">같은 복잡도 안의 선택 (아래 두 개) 은 몇 배 수준 — 병목으로 측정된 뒤에 다룬다</text>
