<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="760" height="452" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="450" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">컬렉션 선택 흐름</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">네 가지 질문이면 구현체가 거의 하나로 좁혀진다</text>
<rect x="28" y="92" width="210" height="34" rx="4" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="133.0" y="114" font-size="11.5" fill="#7a3ba7" font-weight="700" text-anchor="middle">① 여러 스레드가 쓰는가?</text>
<line x1="238" y1="109" x2="268" y2="109" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)"/>
<text x="244" y="104" font-size="10.5" fill="#008300" font-weight="700" text-anchor="start">예</text>
<rect x="272" y="94" width="250" height="30" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="397.0" y="113.14" font-size="11.5" fill="#008300" font-weight="600" text-anchor="middle">ConcurrentHashMap 계열</text>
<line x1="133" y1="126" x2="133" y2="146" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="139" y="142" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="start">아니오</text>
<rect x="28" y="146" width="210" height="34" rx="4" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="133.0" y="168" font-size="11.5" fill="#7a3ba7" font-weight="700" text-anchor="middle">② 키로 값을 찾는가?</text>
<line x1="238" y1="163" x2="268" y2="163" stroke="#eb6834" stroke-width="1.4" marker-end="url(#aho)"/>
<text x="244" y="158" font-size="10.5" fill="#eb6834" font-weight="700" text-anchor="start">예</text>
<rect x="272" y="148" width="90" height="30" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="317.0" y="167.14" font-size="11.5" fill="#eb6834" font-weight="600" text-anchor="middle">Map</text>
<line x1="133" y1="180" x2="133" y2="200" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="139" y="196" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="start">아니오</text>
<rect x="28" y="200" width="210" height="34" rx="4" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="133.0" y="222" font-size="11.5" fill="#7a3ba7" font-weight="700" text-anchor="middle">③ 중복을 허용하는가?</text>
<line x1="238" y1="217" x2="268" y2="217" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ahb)"/>
<text x="244" y="212" font-size="10.5" fill="#2a78d6" font-weight="700" text-anchor="start">예</text>
<rect x="272" y="202" width="120" height="30" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="332.0" y="221.14" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="middle">List / Queue</text>
<line x1="133" y1="234" x2="133" y2="254" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="139" y="250" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="start">아니오</text>
<rect x="28" y="254" width="210" height="30" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="133.0" y="273.14" font-size="11.5" fill="#008300" font-weight="600" text-anchor="middle">Set</text>
<rect x="410" y="196" width="322" height="158" rx="9" fill="#7a3ba7" fill-opacity="0.07" stroke="#7a3ba7" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="424" y="217" font-size="13" fill="#7a3ba7" font-weight="700" text-anchor="start">④ 어떤 순서로 순회하는가</text>
<text x="424" y="234" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">Map 과 Set 의 구현체를 결정한다</text>
<text x="426" y="258" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">상관없다</text>
<text x="546" y="258" font-size="11" fill="#898781" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">HashMap · HashSet</text>
<text x="426" y="284" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">넣은 순서대로</text>
<text x="546" y="284" font-size="11" fill="#2a78d6" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">LinkedHashMap · LinkedHashSet</text>
<text x="426" y="310" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">정렬된 순서로</text>
<text x="546" y="310" font-size="11" fill="#7a3ba7" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">TreeMap · TreeSet</text>
<text x="426" y="336" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">키가 enum 이다</text>
<text x="546" y="336" font-size="11" fill="#008300" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">EnumMap · EnumSet</text>
<rect x="28" y="300" width="356" height="122" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="42" y="321" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start">List / Queue 갈래</text>
<text x="42" y="338" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">주된 연산으로 구현체를 고른다</text>
<text x="44" y="358" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">인덱스 조회 · 순회</text>
<text x="210" y="358" font-size="11.5" fill="#2a78d6" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">ArrayList</text>
<text x="44" y="382" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">양 끝 삽입 · 삭제</text>
<text x="210" y="382" font-size="11.5" fill="#eb6834" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">ArrayDeque</text>
<text x="44" y="406" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">우선순위로 꺼내기</text>
<text x="210" y="406" font-size="11.5" fill="#7a3ba7" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">PriorityQueue</text>
<text x="410" y="376" font-size="11.5" fill="#0b0b0b" font-weight="700" text-anchor="start">기본값 네 개로 시작한다</text>
<text x="410" y="396" font-size="11.5" fill="#008300" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">ArrayList · HashSet · HashMap · ArrayDeque</text>
<text x="410" y="416" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">이걸로 안 되는 이유가 생겼을 때만 바꾼다</text>
</svg>