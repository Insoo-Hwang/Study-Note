<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="334" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">테스트 한 개가 지나가는 길</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">같은 검증인데 준비하는 것이 다르다 — 실측 0.36 ms vs 265 ms (JDK 17 · Spring Boot 3.5.8)</text>
<rect x="34" y="82" width="330" height="176" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="103" font-size="13" fill="#008300" font-weight="700" text-anchor="start">단위 테스트</text>
<text x="48" y="120" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">필요한 것: 객체 두 개</text>
<rect x="50" y="126" width="298" height="30" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="62" y="145" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start" font-family="ui-monospace, Consolas, monospace">① new FakeRepository()</text>
<text x="336" y="145" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="end">가짜 저장소</text>
<rect x="50" y="158" width="298" height="30" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="62" y="177" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start" font-family="ui-monospace, Consolas, monospace">② new OrderService(...)</text>
<text x="336" y="177" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="end">테스트 대상</text>
<rect x="50" y="190" width="298" height="30" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="62" y="209" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start" font-family="ui-monospace, Consolas, monospace">③ svc.payable(1)</text>
<text x="336" y="209" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="end">메서드 호출</text>
<rect x="50" y="222" width="298" height="30" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="62" y="241" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start" font-family="ui-monospace, Consolas, monospace">④ assertEquals(27000, ...)</text>
<text x="336" y="241" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="end">결과 확인</text>
<text x="199.0" y="276" font-size="15" fill="#008300" font-weight="700" text-anchor="middle">합계  0.36 ms / 테스트</text>
<rect x="396" y="82" width="330" height="176" rx="9" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="410" y="103" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start">통합 테스트 (@SpringBootTest)</text>
<text x="410" y="120" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">필요한 것: 컨텍스트 전체</text>
<rect x="412" y="126" width="298" height="30" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="424" y="145" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">① 설정으로 캐시 키를 만든다</text>
<text x="698" y="145" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="end">클래스·프로퍼티</text>
<rect x="412" y="158" width="298" height="30" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="424" y="177" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">② 캐시에 있나?  없다</text>
<text x="698" y="177" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="end">기본 32개까지</text>
<rect x="412" y="190" width="298" height="30" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="424" y="209" font-size="11.5" fill="#0b0b0b" font-weight="700" text-anchor="start">③ 빈 282개를 만들어 엮는다</text>
<text x="698" y="209" font-size="10.5" fill="#e34948" font-weight="700" text-anchor="end">265 ms</text>
<rect x="412" y="222" width="298" height="30" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="424" y="241" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">④ @Autowired 주입 → 호출</text>
<text x="698" y="241" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="end">그다음은 같다</text>
<text x="561.0" y="276" font-size="15" fill="#eb6834" font-weight="700" text-anchor="middle">합계  265 ms / 컨텍스트</text>
<text x="380" y="172" font-size="13" fill="#52514e" font-weight="700" text-anchor="middle">vs</text>
<line x1="34" y1="292" x2="726" y2="292" stroke="rgba(11,11,11,0.10)" stroke-width="1"/>
<text x="34" y="314" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">③ 만 다르다 · 캐시가 맞으면 이 265 ms 를 건너뛴다 → 비싼 것은 테스트 개수가 아니라 컨텍스트 종류다</text>
</svg>