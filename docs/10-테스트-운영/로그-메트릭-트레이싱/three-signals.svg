<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 298" width="760" height="298" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="296" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">세 신호는 대체재가 아니라 단계다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">해상도가 낮은 것부터 좁혀 들어간다 — 실측 비용 10 ns → 5,008 ns</text>
<rect x="34" y="84" width="226" height="132" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="105" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start">① 메트릭</text>
<text x="48" y="122" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">무엇이 이상한가</text>
<rect x="48" y="134" width="198" height="40" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="58" y="150" font-size="10.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">19:40 부터 5xx 가</text>
<text x="58" y="165" font-size="10.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">0.2% → 7% 로 올랐다</text>
<text x="48" y="192" font-size="12.5" fill="#2a78d6" font-weight="700" text-anchor="start">10 ~ 21 ns</text>
<text x="246" y="192" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="end">전부 켜 둔다</text>
<rect x="275" y="84" width="226" height="132" rx="9" fill="#7a3ba7" fill-opacity="0.07" stroke="#7a3ba7" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="289" y="105" font-size="13" fill="#7a3ba7" font-weight="700" text-anchor="start">② 트레이스</text>
<text x="289" y="122" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">어디가 느린가</text>
<rect x="289" y="134" width="198" height="40" rx="4" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="299" y="150" font-size="10.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">느린 요청은 전부</text>
<text x="299" y="165" font-size="10.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">결제 API 구간에서 3초</text>
<text x="289" y="192" font-size="12.5" fill="#7a3ba7" font-weight="700" text-anchor="start">표본만 남긴다</text>
<text x="487" y="192" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="end">traceId 로 꿰맨다</text>
<rect x="516" y="84" width="226" height="132" rx="9" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="530" y="105" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start">③ 로그</text>
<text x="530" y="122" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">왜 그런가</text>
<rect x="530" y="134" width="198" height="40" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="540" y="150" font-size="10.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">PaymentTimeoutException</text>
<text x="540" y="165" font-size="10.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">traceId=abc-123</text>
<text x="530" y="192" font-size="12.5" fill="#eb6834" font-weight="700" text-anchor="start">5,008 ns / 줄</text>
<text x="728" y="192" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="end">94.6 B / 줄</text>
<line x1="261" y1="150.0" x2="274" y2="150.0" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="502" y1="150.0" x2="515" y2="150.0" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="267.5" y="238" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">시각을 좁힌다</text>
<text x="508.5" y="238" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">구간을 좁힌다</text>
<line x1="34" y1="256" x2="726" y2="256" stroke="rgba(11,11,11,0.10)" stroke-width="1"/>
<text x="34" y="278" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">거꾸로 가면 하루 81.7 GB 의 로그에서 무엇을 찾을지조차 모른다</text>
<text x="726" y="278" font-size="12" fill="#52514e" font-weight="400" text-anchor="end">메트릭 없이 로그부터 보지 않는다</text>
</svg>