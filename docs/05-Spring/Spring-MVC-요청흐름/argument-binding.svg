<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 352" width="780" height="352" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="778" height="350" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">@RequestBody 와 @ModelAttribute 는 다른 경로다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">Content-Type 이 어떤 경로를 탈지 결정한다</text>
<rect x="34" y="92" width="348" height="176" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="113" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start">@RequestBody</text>
<text x="48" y="130" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">HTTP 본문 전체를 역직렬화</text>
<rect x="54" y="148" width="308" height="34" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="208.0" y="168.96" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">Content-Type: application/json</text>
<text x="54" y="204" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">{ "name": "kim", "age": 30 }</text>
<line x1="208" y1="214" x2="208" y2="232" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ahb)"/>
<rect x="94" y="236" width="228" height="30" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="208.0" y="254.96" font-size="11" fill="#2a78d6" font-weight="600" text-anchor="middle">MessageConverter (Jackson)</text>
<rect x="398" y="92" width="348" height="176" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="412" y="113" font-size="13" fill="#008300" font-weight="700" text-anchor="start">@ModelAttribute</text>
<text x="412" y="130" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">요청 파라미터를 setter 로 바인딩</text>
<rect x="418" y="148" width="308" height="34" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="572.0" y="168.78" font-size="10.5" fill="#0b0b0b" font-weight="400" text-anchor="middle">Content-Type: x-www-form-urlencoded</text>
<text x="418" y="204" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">name=kim&amp;age=30</text>
<line x1="572" y1="214" x2="572" y2="232" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)"/>
<rect x="458" y="236" width="228" height="30" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="572.0" y="254.96" font-size="11" fill="#008300" font-weight="600" text-anchor="middle">기본 생성자 + setter</text>
<line x1="34" y1="288" x2="746" y2="288" stroke="#898781" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="34" y="312" font-size="12" fill="#e34948" font-weight="700" text-anchor="start">잘못 고르면   JSON + @ModelAttribute → 값이 전부 null   ·   form + @RequestBody → 415</text>
<text x="34" y="336" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">더 까다로운 것   @RequestBody 에서 필드명이 안 맞으면 예외 없이 그 필드만 null 이다</text>
</svg>