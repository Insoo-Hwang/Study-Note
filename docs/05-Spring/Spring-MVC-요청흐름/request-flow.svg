<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 486" width="780" height="486" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="778" height="484" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">요청 하나가 지나가는 경로</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">내가 쓰는 코드는 이 중 컨트롤러 한 칸뿐이다</text>
<rect x="34" y="88" width="250" height="32" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="46" y="109" font-size="11.5" fill="#898781" font-weight="700" text-anchor="start">톰캣 스레드 배정</text>
<text x="300" y="109" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">스레드 풀에서 1개 — 응답까지 점유</text>
<line x1="159" y1="120" x2="159" y2="124" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="34" y="126" width="250" height="32" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="46" y="147" font-size="11.5" fill="#eb6834" font-weight="700" text-anchor="start">Filter 체인</text>
<text x="300" y="147" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">서블릿 컨테이너 영역 · 인코딩 · 보안</text>
<line x1="159" y1="158" x2="159" y2="162" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="34" y="164" width="250" height="32" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="46" y="185" font-size="11.5" fill="#2a78d6" font-weight="700" text-anchor="start">DispatcherServlet</text>
<text x="300" y="185" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">Front Controller — 여기부터 Spring</text>
<line x1="159" y1="196" x2="159" y2="200" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="34" y="202" width="250" height="32" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="46" y="223" font-size="11.5" fill="#2a78d6" font-weight="700" text-anchor="start">HandlerMapping</text>
<text x="300" y="223" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">이 URL 은 누가 처리하나</text>
<line x1="159" y1="234" x2="159" y2="238" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="34" y="240" width="250" height="32" rx="4" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="46" y="261" font-size="11.5" fill="#7a3ba7" font-weight="700" text-anchor="start">Interceptor.preHandle</text>
<text x="300" y="261" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">false 면 여기서 끝난다</text>
<line x1="159" y1="272" x2="159" y2="276" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="34" y="278" width="250" height="32" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="46" y="299" font-size="11.5" fill="#2a78d6" font-weight="700" text-anchor="start">ArgumentResolver</text>
<text x="300" y="299" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">매개변수를 채운다 (@PathVariable 등)</text>
<line x1="159" y1="310" x2="159" y2="314" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="34" y="316" width="250" height="32" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="46" y="337" font-size="11.5" fill="#008300" font-weight="700" text-anchor="start">컨트롤러 메서드</text>
<text x="300" y="337" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">▶ 내가 쓴 코드 ◀</text>
<line x1="159" y1="348" x2="159" y2="352" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="34" y="354" width="250" height="32" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="46" y="375" font-size="11.5" fill="#2a78d6" font-weight="700" text-anchor="start">MessageConverter</text>
<text x="300" y="375" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">반환값 → JSON</text>
<line x1="159" y1="386" x2="159" y2="390" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="34" y="392" width="250" height="32" rx="4" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="46" y="413" font-size="11.5" fill="#7a3ba7" font-weight="700" text-anchor="start">Interceptor.afterCompletion</text>
<text x="300" y="413" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">예외가 나도 반드시 실행 — 정리는 여기</text>
<line x1="34" y1="440" x2="746" y2="440" stroke="#898781" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="34" y="464" font-size="12" fill="#e34948" font-weight="700" text-anchor="start">@ControllerAdvice 는 DispatcherServlet 안쪽만 커버한다  —  Filter 예외는 못 잡는다</text>
</svg>