<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="780" height="340" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="778" height="338" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">프로퍼티 우선순위 — 앞선 것이 이긴다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">Environment 가 PropertySource 를 순서대로 뒤져 먼저 찾은 값을 쓴다</text>
<rect x="34" y="96" width="250" height="36" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="46" y="119" font-size="11.5" fill="#e34948" font-weight="700" text-anchor="start">커맨드라인 인자</text>
<text x="300" y="119" font-size="11" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">--server.port=9090</text>
<text x="560" y="119" font-size="11" fill="#e34948" font-weight="700" text-anchor="start">← 가장 셈</text>
<rect x="34" y="138" width="250" height="36" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="46" y="161" font-size="11.5" fill="#eb6834" font-weight="700" text-anchor="start">시스템 프로퍼티</text>
<text x="300" y="161" font-size="11" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">-Dserver.port=9090</text>
<rect x="34" y="180" width="250" height="36" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="46" y="203" font-size="11.5" fill="#2a78d6" font-weight="700" text-anchor="start">환경 변수</text>
<text x="300" y="203" font-size="11" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">SERVER_PORT=9090</text>
<rect x="34" y="222" width="250" height="36" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="46" y="245" font-size="11.5" fill="#008300" font-weight="700" text-anchor="start">application-{profile}.yml</text>
<text x="300" y="245" font-size="11" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">프로파일별</text>
<rect x="34" y="264" width="250" height="36" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="46" y="287" font-size="11.5" fill="#898781" font-weight="700" text-anchor="start">application.yml</text>
<text x="300" y="287" font-size="11" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">기본값</text>
<text x="560" y="287" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">← 가장 약함</text>
<line x1="34" y1="288" x2="746" y2="288" stroke="#898781" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="34" y="312" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start">그래서 비밀값은 yml 이 아니라 환경 변수에 둔다  —  yml 은 저장소에 커밋된다</text>
<text x="34" y="334" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">${DB_PASSWORD:localpassword} 문법을 쓰면 로컬은 기본값, 운영은 환경 변수가 이긴다</text>
</svg>