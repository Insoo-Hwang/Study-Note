<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" width="780" height="320" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="778" height="318" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">인터페이스 유무가 프록시 종류를 가른다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">실측 (Spring 5.3.8) — 상속으로 만드는 CGLIB 은 final 을 못 쓴다</text>
<rect x="34" y="92" width="348" height="150" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="113" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start">인터페이스가 있다</text>
<text x="48" y="130" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">JDK 동적 프록시</text>
<text x="54" y="152" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">OrderService implements OrderApi</text>
<rect x="54" y="164" width="308" height="40" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="208.0" y="188.5" font-size="12.5" fill="#2a78d6" font-weight="700" text-anchor="middle">$Proxy18</text>
<text x="54" y="226" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">인터페이스를 구현 · 인터페이스로만 캐스팅 가능</text>
<rect x="398" y="92" width="348" height="150" rx="9" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="412" y="113" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start">인터페이스가 없다</text>
<text x="412" y="130" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">CGLIB 프록시</text>
<text x="418" y="152" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">ReportService (인터페이스 없음)</text>
<rect x="418" y="164" width="308" height="40" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="572.0" y="187.78" font-size="10.5" fill="#eb6834" font-weight="700" text-anchor="middle">ReportService$$EnhancerBySpringCGLIB$$</text>
<text x="418" y="226" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">클래스를 상속 · final 클래스/메서드에는 적용 불가</text>
<line x1="34" y1="260" x2="746" y2="260" stroke="#898781" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="34" y="284" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start">Spring Boot 는 2.0부터 CGLIB 이 기본이다  —  JDK 프록시가 인터페이스로만 캐스팅돼</text>
<text x="34" y="306" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">ClassCastException 혼란을 일으켰기 때문이다 (proxyTargetClass=true)</text>
</svg>