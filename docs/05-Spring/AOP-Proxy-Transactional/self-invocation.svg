<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 372" width="780" height="372" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="778" height="370" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">자기호출은 프록시를 우회한다 — AOP 가 안 걸리는 1번 원인</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">프록시는 밖에서 들어오는 호출만 가로챌 수 있다</text>
<rect x="34" y="92" width="348" height="122" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="113" font-size="13" fill="#008300" font-weight="700" text-anchor="start">밖에서 inner() 호출</text>
<text x="48" y="130" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">실측 — 트랜잭션 활성? 예</text>
<rect x="52" y="148" width="84" height="40" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="94.0" y="172.14" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">호출자</text>
<line x1="140" y1="168" x2="168" y2="168" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)"/>
<rect x="174" y="148" width="84" height="40" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="216.0" y="172.14" font-size="11.5" fill="#008300" font-weight="600" text-anchor="middle">프록시</text>
<line x1="262" y1="168" x2="290" y2="168" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)"/>
<rect x="296" y="148" width="68" height="40" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="330.0" y="172.14" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">원본</text>
<rect x="398" y="92" width="348" height="122" rx="9" fill="#e34948" fill-opacity="0.07" stroke="#e34948" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="412" y="113" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">outer() 안에서 inner() 호출</text>
<text x="412" y="130" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">실측 — 트랜잭션 활성? 아니오</text>
<rect x="416" y="148" width="84" height="40" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="458.0" y="172.14" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">호출자</text>
<line x1="504" y1="168" x2="532" y2="168" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="538" y="148" width="84" height="40" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="580.0" y="172.14" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">프록시</text>
<line x1="626" y1="168" x2="654" y2="168" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="660" y="148" width="68" height="40" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="694.0" y="172.14" font-size="11.5" fill="#e34948" font-weight="600" text-anchor="middle">원본</text>
<line x1="694" y1="192" x2="694" y2="216" stroke="#e34948" stroke-width="1.4" marker-end="url(#ahr)"/>
<text x="686" y="212" font-size="11" fill="#e34948" font-weight="700" text-anchor="end">this.inner()</text>
<line x1="34" y1="244" x2="746" y2="244" stroke="#898781" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="34" y="270" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start">this 는 프록시가 아니라 원본이다  —  이 한 문장이 전부다</text>
<text x="34" y="296" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">같은 이유로 안 걸리는 것들   private 메서드 · final 메서드 · final 클래스 · new 로 만든 객체 · static</text>
<text x="34" y="322" font-size="11.5" fill="#008300" font-weight="700" text-anchor="start">해결 (가장 좋은 순서)</text>
<text x="34" y="344" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">① 클래스를 분리해 다른 빈으로 만든다   ② TransactionTemplate   ③ 자기 주입(@Lazy)</text>
</svg>