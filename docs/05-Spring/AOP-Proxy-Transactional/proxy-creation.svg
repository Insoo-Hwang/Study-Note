<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 336" width="780" height="336" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="778" height="334" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">컨테이너는 원본이 아니라 프록시를 등록한다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">그래서 주입받는 것도, getBean() 으로 꺼내는 것도 프록시다</text>
<rect x="34" y="104" width="158" height="52" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="113.0" y="134.5" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">OrderService</text>
<text x="113" y="172" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle">① 원본 생성</text>
<line x1="198" y1="130" x2="240" y2="130" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="248" y="100" width="168" height="60" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="332" y="124" font-size="12" fill="#2a78d6" font-weight="700" text-anchor="middle">BeanPostProcessor</text>
<text x="332" y="145" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">@Transactional 있나?</text>
<line x1="422" y1="130" x2="464" y2="130" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ahb)"/>
<rect x="472" y="92" width="274" height="96" rx="9" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="486" y="113" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start">③ 프록시로 감싸 등록</text>
<rect x="492" y="130" width="234" height="44" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="609.0" y="156.32" font-size="12" fill="#eb6834" font-weight="600" text-anchor="middle">OrderService$$Proxy</text>
<text x="34" y="218" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start">프록시가 하는 일</text>
<rect x="34" y="234" width="160" height="36" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="114.0" y="256.14" font-size="11.5" fill="#008300" font-weight="600" text-anchor="middle">트랜잭션 시작</text>
<line x1="196" y1="252" x2="206" y2="252" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="210" y="234" width="160" height="36" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="290.0" y="256.14" font-size="11.5" fill="#898781" font-weight="600" text-anchor="middle">원본 메서드 호출</text>
<line x1="372" y1="252" x2="382" y2="252" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="386" y="234" width="160" height="36" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="466.0" y="256.14" font-size="11.5" fill="#008300" font-weight="600" text-anchor="middle">커밋 또는 롤백</text>
<text x="34" y="300" font-size="12" fill="#e34948" font-weight="700" text-anchor="start">예외가 프록시까지 올라와야 롤백을 판단할 수 있다  —  안에서 catch 하면 커밋된다</text>
<text x="34" y="322" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">그리고 checked 예외는 기본적으로 커밋 대상이다 (rollbackFor 로 지정해야 한다)</text>
</svg>