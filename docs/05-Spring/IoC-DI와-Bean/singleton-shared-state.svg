<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 356" width="780" height="356" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="778" height="354" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">싱글톤 빈에 상태를 두면 요청들이 같은 필드를 덮어쓴다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">빈은 하나, 요청 스레드는 여럿 — 그래서 경쟁 상태가 된다</text>
<rect x="34" y="106" width="190" height="34" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="129.0" y="127.14" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="middle">요청 A (스레드 1)</text>
<line x1="230" y1="123" x2="322" y2="168" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ahb)"/>
<rect x="34" y="152" width="190" height="34" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="129.0" y="173.14" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="middle">요청 B (스레드 2)</text>
<line x1="230" y1="169" x2="322" y2="168" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ahb)"/>
<rect x="34" y="198" width="190" height="34" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="129.0" y="219.14" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="middle">요청 C (스레드 3)</text>
<line x1="230" y1="215" x2="322" y2="168" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ahb)"/>
<rect x="330" y="130" width="190" height="76" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="425" y="156" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="middle">StatefulCounter</text>
<text x="425" y="178" font-size="11.5" fill="#e34948" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">private int count</text>
<text x="425" y="220" font-size="11" fill="#52514e" font-weight="700" text-anchor="middle">빈 하나 (싱글톤)</text>
<rect x="548" y="118" width="198" height="100" rx="9" fill="#e34948" fill-opacity="0.07" stroke="#e34948" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="562" y="139" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">실측 (100 × 1,000)</text>
<text x="566" y="172" font-size="13" fill="#52514e" font-weight="700" text-anchor="start">기대  100,000</text>
<text x="566" y="196" font-size="15" fill="#e34948" font-weight="700" text-anchor="start">실제   96,303</text>
<line x1="34" y1="250" x2="746" y2="250" stroke="#898781" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="34" y="276" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start">3,697번이 사라졌는데 예외도 로그도 없다  —  count++ 가 원자적이지 않기 때문이다</text>
<text x="34" y="302" font-size="11.5" fill="#008300" font-weight="400" text-anchor="start">빈 필드에 둬도 되는 것   기동 시점에 정해지고 안 바뀌는 협력 객체 (final)</text>
<text x="34" y="324" font-size="11.5" fill="#e34948" font-weight="400" text-anchor="start">빈 필드에 두면 안 되는 것  요청마다 달라지는 상태  →  매개변수로 넘긴다</text>
</svg>