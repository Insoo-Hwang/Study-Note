<text x="50" y="228" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">대기 최대  4,660 ms</text>
<text x="50" y="272" font-size="11" fill="#2a78d6" font-weight="700" text-anchor="start">메모리가 터질 때까지 조용하다</text>
