<text x="296" y="228" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">대기 최대    246 ms</text>
<text x="296" y="272" font-size="11" fill="#eb6834" font-weight="700" text-anchor="start">즉시 오류로 드러난다</text>
