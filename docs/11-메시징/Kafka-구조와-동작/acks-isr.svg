<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="338" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">acks=all 이 유실을 막지 못하는 조합</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">acks=all 은 'ISR 전부'라는 뜻이지 '복제본 3대 전부'가 아니다</text>
<rect x="34" y="86" width="692" height="108" rx="9" fill="#e34948" fill-opacity="0.07" stroke="#e34948" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="107" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">min.insync.replicas = 1  (브로커 기본값)</text>
<text x="48" y="124" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">팔로워가 뒤처져 ISR 이 리더 하나로 줄어도 프로듀서는 성공 응답을 받는다</text>
<rect x="60" y="138" width="120" height="34" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="120.0" y="159.32" font-size="12" fill="#e34948" font-weight="600" text-anchor="middle">리더</text>
<rect x="196" y="138" width="120" height="34" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="256.0" y="159.32" font-size="12" fill="#52514e" font-weight="600" text-anchor="middle">팔로워1</text>
<rect x="332" y="138" width="120" height="34" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="392.0" y="159.32" font-size="12" fill="#52514e" font-weight="600" text-anchor="middle">팔로워2</text>
<text x="468" y="152" font-size="12" fill="#e34948" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">ISR = { 리더 }</text>
<text x="468" y="170" font-size="11.5" fill="#e34948" font-weight="400" text-anchor="start">→ 1대만 받고 성공</text>
<text x="60" y="188" font-size="11.5" fill="#e34948" font-weight="700" text-anchor="start">리더가 죽으면 그 메시지는 아무 데도 없다 — 조용한 유실</text>
<rect x="34" y="210" width="692" height="96" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="231" font-size="13" fill="#008300" font-weight="700" text-anchor="start">min.insync.replicas = 2  (권장, replication.factor = 3)</text>
<text x="48" y="248" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">ISR 이 2 미만이면 쓰기가 NotEnoughReplicasException 으로 실패한다</text>
<rect x="60" y="262" width="120" height="32" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="120.0" y="282.32" font-size="12" fill="#008300" font-weight="600" text-anchor="middle">리더</text>
<rect x="196" y="262" width="120" height="32" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="256.0" y="282.32" font-size="12" fill="#008300" font-weight="600" text-anchor="middle">팔로워1</text>
<rect x="332" y="262" width="120" height="32" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="392.0" y="282.32" font-size="12" fill="#52514e" font-weight="600" text-anchor="middle">팔로워2</text>
<text x="468" y="276" font-size="12" fill="#008300" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">ISR = { 리더, 팔로워1 }</text>
<text x="468" y="294" font-size="11.5" fill="#008300" font-weight="400" text-anchor="start">→ 2대 확보, 성공</text>
<text x="34" y="328" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start">조용한 유실 대신 시끄러운 실패를 고르는 설정이다.</text>
</svg>