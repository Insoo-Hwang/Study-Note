<text x="190" y="292" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">배수로 늘리면 50%, 그렇지 않으면 최대 80%가 옮겨 간다.</text>
<text x="34" y="326" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start">이사한 키는 옛 파티션에 과거를, 새 파티션에 현재를 남긴다 — 그 순간 순서 보장이 끊긴다.</text>
