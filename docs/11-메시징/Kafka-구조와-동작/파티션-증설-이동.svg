<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">파티션을 늘리면 키가 이사한다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">키 10만 개로 계산 — murmur2(key) &amp; 0x7fffffff % 파티션수</text>
<text x="174" y="127" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="end" font-family="ui-monospace, Consolas, monospace">4개 → 5개</text>
