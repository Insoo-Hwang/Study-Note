<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="778" height="438" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">Bean 하나가 지나가는 단계</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">콜백마다 로그를 찍어 확인한 실제 순서 (Spring Boot 3.5.16)</text>
<rect x="30" y="84" width="720" height="96" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="44" y="105" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start">생성 · 주입</text>
<text x="44" y="122" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">생성자 주입이면 이 두 단계가 사실상 한 덩어리다</text>
<rect x="46" y="130" width="340" height="38" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="216.0" y="153.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">1. 생성자 — 의존 객체 주입 완료</text>
<rect x="410" y="130" width="340" height="38" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="580.0" y="153.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">2. Aware 콜백 (BeanNameAware …)</text>
<rect x="30" y="194" width="720" height="96" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="44" y="215" font-size="13" fill="#008300" font-weight="700" text-anchor="start">초기화 — 셋 중 하나를 고르는 게 아니라 순서대로 다 불린다</text>
<text x="44" y="232" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">@PostConstruct 는 BeanPostProcessor 가 실행한다 → afterPropertiesSet 보다 먼저다</text>
<rect x="46" y="240" width="128" height="38" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="110.0" y="263.14" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">3. BPP.before</text>
<line x1="176" y1="259" x2="184" y2="259" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)"/>
<rect x="186" y="240" width="128" height="38" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="250.0" y="263.14" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">4. @PostConstruct</text>
<line x1="316" y1="259" x2="324" y2="259" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)"/>
<rect x="326" y="240" width="128" height="38" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="390.0" y="263.14" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">5. afterPropertiesSet</text>
<line x1="456" y1="259" x2="464" y2="259" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)"/>
<rect x="466" y="240" width="128" height="38" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="530.0" y="263.14" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">6. initMethod</text>
<line x1="596" y1="259" x2="604" y2="259" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)"/>
<rect x="606" y="240" width="128" height="38" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="670.0" y="263.14" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">7. BPP.after</text>
<rect x="30" y="304" width="720" height="96" rx="9" fill="#e34948" fill-opacity="0.07" stroke="#e34948" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="44" y="325" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">소멸 — 초기화와 같은 순서</text>
<text x="44" y="342" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">singleton 만 해당한다. prototype 은 컨테이너가 참조를 안 들고 있어 아무 것도 안 불린다</text>
<rect x="46" y="350" width="216" height="38" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="154.0" y="373.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">8. @PreDestroy</text>
<line x1="264" y1="369" x2="274" y2="369" stroke="#e34948" stroke-width="1.4" marker-end="url(#ahr)"/>
<rect x="278" y="350" width="216" height="38" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="386.0" y="373.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">9. destroy()</text>
<line x1="496" y1="369" x2="506" y2="369" stroke="#e34948" stroke-width="1.4" marker-end="url(#ahr)"/>
<rect x="510" y="350" width="216" height="38" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="618.0" y="373.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">10. destroyMethod</text>
<text x="34" y="424" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">생성자에서는 의존 객체를 쓸 수 있지만, 그 객체의 초기화까지 끝났다는 보장은 없다.</text>
</svg>