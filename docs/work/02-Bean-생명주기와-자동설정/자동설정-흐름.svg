<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 322" width="780" height="322" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="778" height="320" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">Bean 이 등록되는 두 갈래</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">자동설정은 '등록' 단계에서만 특별하고, 그 뒤는 내 Bean 과 같은 길을 간다</text>
<rect x="40" y="100" width="196" height="44" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="138.0" y="126.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">컴포넌트 스캔 · 내 @Bean</text>
<rect x="40" y="180" width="196" height="44" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="138.0" y="206.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">.imports 자동설정 후보</text>
<rect x="258" y="180" width="168" height="44" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="342.0" y="206.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">@Conditional 평가</text>
<rect x="448" y="140" width="150" height="44" rx="4" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="523.0" y="166.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">BeanDefinition</text>
<rect x="620" y="140" width="130" height="44" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="685.0" y="166.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">생성 → 초기화</text>
<line x1="238" y1="122" x2="444" y2="152" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ahb)"/>
<line x1="238" y1="202" x2="254" y2="202" stroke="#eb6834" stroke-width="1.4" marker-end="url(#aho)"/>
<line x1="428" y1="202" x2="444" y2="172" stroke="#eb6834" stroke-width="1.4" marker-end="url(#aho)"/>
<line x1="600" y1="162" x2="616" y2="162" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="40" y="244" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="start">내 코드 — 먼저 평가된다</text>
<text x="40" y="262" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">메인 클래스 패키지 아래만 스캔한다</text>
<text x="258" y="244" font-size="11.5" fill="#eb6834" font-weight="600" text-anchor="start">156개는 후보일 뿐 — 통과분만 등록</text>
<text x="258" y="262" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">@ConditionalOnMissingBean 이 위 갈래의 결과를 본다</text>
<text x="34" y="300" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">자동설정이 나중에 평가되기 때문에 사용자 Bean 이 이긴다 — 배려가 아니라 순서의 결과다.</text>
</svg>