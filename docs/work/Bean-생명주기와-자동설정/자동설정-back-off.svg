<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 492" width="780" height="492" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="778" height="490" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">자동설정이 물러나는 이유 (back-off)</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">Spring Boot 3.3.4 · 사용자 설정이 먼저, 자동설정이 나중 — 이 순서가 back-off의 전부다</text>
<rect x="34" y="84" width="712" height="118" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="105" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start">① 사용자 설정 — 먼저 처리된다</text>
<text x="48" y="122" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">@ComponentScan · @Configuration · @Import</text>
<rect x="52" y="136" width="210" height="52" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="157.0" y="158" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">@ComponentScan 으로</text>
<text x="157.0" y="175" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">내 @Component 탐색</text>
<line x1="262" y1="162" x2="282" y2="162" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ahb)"/>
<rect x="282" y="136" width="210" height="52" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="387.0" y="158" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">@Configuration 의</text>
<text x="387.0" y="175" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">@Bean 메서드 분석</text>
<line x1="492" y1="162" x2="512" y2="162" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ahb)"/>
<rect x="512" y="136" width="210" height="52" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="617.0" y="158" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">내 BeanDefinition</text>
<text x="617.0" y="175" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">전부 등록 완료</text>
<line x1="120" y1="204" x2="120" y2="232" stroke="#e34948" stroke-width="1.8" marker-end="url(#ahr)"/>
<text x="140" y="224" font-size="11.5" fill="#e34948" font-weight="600" text-anchor="start">AutoConfigurationImportSelector 는 DeferredImportSelector — 맨 뒤로 밀린다</text>
<rect x="34" y="238" width="712" height="192" rx="9" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="259" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start">② 자동설정 — 그 다음에 처리된다</text>
<text x="48" y="276" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">@EnableAutoConfiguration → .imports → 조건 평가</text>
<rect x="52" y="290" width="168" height="50" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="136.0" y="311" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">starter 가 라이브러리를</text>
<text x="136.0" y="328" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">classpath 에 올린다</text>
<line x1="220" y1="315" x2="232" y2="315" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="232" y="290" width="168" height="50" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="316.0" y="311" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">.imports 에서 후보를</text>
<text x="316.0" y="328" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">읽는다 (3.3.4 = 152개)</text>
<line x1="400" y1="315" x2="412" y2="315" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="412" y="290" width="168" height="50" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="496.0" y="311" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">@ConditionalOnClass</text>
<text x="496.0" y="328" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">클래스가 있는가</text>
<line x1="580" y1="315" x2="592" y2="315" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="592" y="290" width="168" height="50" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="676.0" y="311" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">@ConditionalOnMissingBean</text>
<text x="676.0" y="328" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">내가 만든 Bean 이 있는가</text>
<line x1="676" y1="340" x2="676" y2="364" stroke="#898781" stroke-width="1.4"/>
<line x1="250" y1="364" x2="676" y2="364" stroke="#898781" stroke-width="1.4"/>
<line x1="250" y1="364" x2="250" y2="378" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)"/>
<line x1="560" y1="364" x2="560" y2="378" stroke="#e34948" stroke-width="1.4" marker-end="url(#ahr)"/>
<rect x="120" y="380" width="260" height="44" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="250" y="399" font-size="12" fill="#008300" font-weight="700" text-anchor="middle">없다 → 자동설정이 Bean 을 만든다</text>
<text x="250" y="415" font-size="10" fill="#52514e" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">mailSender = MailSender(host=smtp.example.com)</text>
<rect x="430" y="380" width="260" height="44" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="560" y="399" font-size="12" fill="#e34948" font-weight="700" text-anchor="middle">있다 → 자동설정이 물러난다</text>
<text x="560" y="415" font-size="10" fill="#52514e" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">mailSender = MailSender(host=my-own-host)</text>
<text x="34" y="456" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">순서가 반대였다면 @ConditionalOnMissingBean 은 내 Bean 을 볼 수 없었을 것이다.</text>
<text x="34" y="476" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">자동설정을 덮어쓰는 것이 아니라, 자동설정이 나를 보고 비켜 준다.</text>
</svg>