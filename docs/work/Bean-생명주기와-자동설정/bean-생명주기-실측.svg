<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">Bean 하나가 지나가는 순서 (실측)</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">Spring Boot 3.3.4 / Spring Framework 6.1.13 · 대괄호 숫자는 실행 로그의 순번</text>
<rect x="34" y="98" width="150" height="92" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="119" font-size="13" fill="#008300" font-weight="700" text-anchor="start">① 생성 · 주입</text>
<text x="48" y="136" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">객체가 만들어진다</text>
<rect x="34" y="186" width="150" height="266" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="207" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start">② 초기화</text>
<text x="48" y="224" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">BPP가 끼어드는 구간</text>
<rect x="34" y="454" width="150" height="42" rx="9" fill="#898781" fill-opacity="0.07" stroke="#898781" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="475" font-size="13" fill="#898781" font-weight="700" text-anchor="start">③ 사용</text>
<rect x="34" y="498" width="150" height="88" rx="9" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="519" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start">④ 소멸</text>
<text x="48" y="536" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">close() 시점</text>
<rect x="196" y="104" width="348" height="36" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="208" y="127" font-size="11.5" fill="#008300" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">[04]</text>
<text x="252" y="127" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">new UserService(greetingService)</text>
<text x="560" y="127" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">생성자 주입은 여기서 끝난다</text>
<line x1="370.0" y1="140" x2="370.0" y2="148" stroke="#898781" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="196" y="148" width="348" height="36" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="208" y="171" font-size="11.5" fill="#008300" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">[05]</text>
<text x="252" y="171" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">@Autowired 메서드 / 필드 주입</text>
<text x="560" y="171" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">AutowiredAnnotationBeanPostProcessor</text>
<line x1="370.0" y1="184" x2="370.0" y2="192" stroke="#898781" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="196" y="192" width="348" height="36" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="208" y="215" font-size="11.5" fill="#2a78d6" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">[06]</text>
<text x="252" y="215" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">BeanNameAware.setBeanName()</text>
<text x="560" y="215" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">컨테이너가 직접 호출</text>
<line x1="370.0" y1="228" x2="370.0" y2="236" stroke="#898781" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="196" y="236" width="348" height="36" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="208" y="259" font-size="11.5" fill="#2a78d6" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">[07]</text>
<text x="252" y="259" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">ApplicationContextAware</text>
<text x="560" y="259" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">ApplicationContextAwareProcessor (BPP)</text>
<line x1="370.0" y1="272" x2="370.0" y2="280" stroke="#898781" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="196" y="280" width="348" height="36" rx="4" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="208" y="303" font-size="11.5" fill="#7a3ba7" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">[08]</text>
<text x="252" y="303" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">사용자 BPP · before 초기화</text>
<text x="560" y="303" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">FirstBpp / LastBpp / LoggingBpp</text>
<line x1="370.0" y1="316" x2="370.0" y2="324" stroke="#898781" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="196" y="324" width="348" height="36" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="208" y="347" font-size="11.5" fill="#e34948" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">[11]</text>
<text x="252" y="347" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">@PostConstruct</text>
<text x="560" y="347" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">CommonAnnotationBeanPostProcessor</text>
<line x1="370.0" y1="360" x2="370.0" y2="368" stroke="#898781" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="196" y="368" width="348" height="36" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="208" y="391" font-size="11.5" fill="#2a78d6" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">[12]</text>
<text x="252" y="391" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">afterPropertiesSet() · init-method</text>
<text x="560" y="391" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">컨테이너가 직접 호출</text>
<line x1="370.0" y1="404" x2="370.0" y2="412" stroke="#898781" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="196" y="412" width="348" height="36" rx="4" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="208" y="435" font-size="11.5" fill="#7a3ba7" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">[13]</text>
<text x="252" y="435" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">사용자 BPP · after 초기화</text>
<text x="560" y="435" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">AOP 프록시로 바꿔치기하는 자리</text>
<line x1="370.0" y1="448" x2="370.0" y2="456" stroke="#898781" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="196" y="456" width="348" height="36" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="208" y="479" font-size="11.5" fill="#898781" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">[--]</text>
<text x="252" y="479" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">사용</text>
<text x="560" y="479" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">싱글톤이면 컨테이너가 계속 들고 있다</text>
<line x1="370.0" y1="492" x2="370.0" y2="500" stroke="#898781" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="196" y="500" width="348" height="36" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="208" y="523" font-size="11.5" fill="#eb6834" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">[18]</text>
<text x="252" y="523" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">@PreDestroy</text>
<text x="560" y="523" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">CommonAnnotationBeanPostProcessor</text>
<line x1="370.0" y1="536" x2="370.0" y2="544" stroke="#898781" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="196" y="544" width="348" height="36" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="208" y="567" font-size="11.5" fill="#eb6834" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">[19]</text>
<text x="252" y="567" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">DisposableBean.destroy()</text>
<text x="560" y="567" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">컨테이너가 직접 호출</text>
<text x="34" y="608" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">[08] 과 [11] 사이가 핵심 — 사용자 BPP의 before는 순서를 어떻게 주든 @PostConstruct보다 먼저 끝난다.</text>
