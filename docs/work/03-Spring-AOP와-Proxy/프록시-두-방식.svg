<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 392" width="780" height="392" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="778" height="390" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">프록시를 만드는 두 방식</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">Spring Boot 는 spring.aop.proxy-target-class=true 가 기본이라 CGLIB 을 쓴다</text>
<rect x="30" y="84" width="352" height="190" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="44" y="105" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start">JDK 동적 프록시</text>
<text x="44" y="122" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">인터페이스를 구현한 객체를 만든다</text>
<rect x="48" y="140" width="316" height="36" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="206.0" y="162.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">interface Notifier</text>
<rect x="48" y="212" width="150" height="36" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="123.0" y="234.14" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">EmailNotifier</text>
<rect x="214" y="212" width="150" height="36" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="289.0" y="234.14" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">jdk.proxy2.$Proxy44</text>
<line x1="123" y1="212" x2="123" y2="176" stroke="#2a78d6" stroke-width="1.4"/>
<line x1="289" y1="212" x2="289" y2="176" stroke="#2a78d6" stroke-width="1.4"/>
<text x="48" y="194" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">구현</text>
<text x="214" y="194" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">구현</text>
<rect x="398" y="84" width="352" height="190" rx="9" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="412" y="105" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start">CGLIB</text>
<text x="412" y="122" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">대상 클래스를 상속한 서브클래스를 만든다</text>
<rect x="416" y="140" width="316" height="36" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="574.0" y="162.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">class PaymentService</text>
<rect x="490" y="212" width="168" height="36" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="574.0" y="234.14" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">…$$SpringCGLIB$$0</text>
<line x1="574" y1="212" x2="574" y2="176" stroke="#eb6834" stroke-width="1.4"/>
<text x="490" y="194" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">상속</text>
<text x="34" y="298" font-size="12" fill="#2a78d6" font-weight="700" text-anchor="start">구현 클래스 타입으로 못 꺼낸다</text>
<text x="34" y="318" font-size="11" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">getBean(EmailNotifier.class)</text>
<text x="34" y="336" font-size="11" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">→ NoSuchBeanDefinitionException</text>
<text x="402" y="298" font-size="12" fill="#eb6834" font-weight="700" text-anchor="start">final · private 은 못 감싼다</text>
<text x="402" y="318" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">final 메서드는 프록시 자신의 필드를 읽어</text>
<text x="402" y="336" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">값이 null 이 된다</text>
<text x="34" y="372" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">Boot 가 CGLIB 을 기본으로 둔 이유 — 인터페이스를 추가했다고 주입이 깨지지 않게.</text>
</svg>