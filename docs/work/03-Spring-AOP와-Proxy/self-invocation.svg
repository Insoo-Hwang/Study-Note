<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 372" width="780" height="372" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="778" height="370" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">외부 호출과 내부 호출 — 프록시가 끼어드는 자리</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">같은 @Transactional 메서드인데 호출 경로에 따라 결과가 갈린다 (Spring Boot 3.5.16)</text>
<rect x="30" y="84" width="720" height="104" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="44" y="105" font-size="13" fill="#008300" font-weight="700" text-anchor="start">외부 호출 — 트랜잭션이 걸린다</text>
<text x="44" y="122" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">프록시가 호출을 받아 begin / commit 을 부르고 나서 원본에 넘긴다</text>
<rect x="46" y="136" width="112" height="40" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="102.0" y="160.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">클라이언트</text>
<rect x="190" y="136" width="210" height="40" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="295.0" y="160.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">proxy.savePayment()</text>
<rect x="432" y="136" width="200" height="40" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="532.0" y="160.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">target.savePayment()</text>
<line x1="160" y1="156" x2="186" y2="156" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)"/>
<line x1="402" y1="156" x2="428" y2="156" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)"/>
<text x="646" y="161" font-size="13" fill="#008300" font-weight="700" text-anchor="start">→ true</text>
<rect x="30" y="200" width="720" height="104" rx="9" fill="#e34948" fill-opacity="0.07" stroke="#e34948" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="44" y="221" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">내부 호출 — 트랜잭션이 안 걸린다</text>
<text x="44" y="238" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">target 이 자기 자신을 부르는 것이라 프록시가 개입할 지점이 없다</text>
<rect x="46" y="252" width="100" height="40" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="96.0" y="276.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">클라이언트</text>
<rect x="176" y="252" width="150" height="40" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="251.0" y="276.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">proxy.process()</text>
<rect x="356" y="252" width="150" height="40" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="431.0" y="276.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">target.process()</text>
<rect x="536" y="252" width="150" height="40" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="611.0" y="276.14" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">this.savePayment()</text>
<line x1="148" y1="272" x2="172" y2="272" stroke="#e34948" stroke-width="1.4" marker-end="url(#ahr)"/>
<line x1="328" y1="272" x2="352" y2="272" stroke="#e34948" stroke-width="1.4" marker-end="url(#ahr)"/>
<line x1="508" y1="272" x2="532" y2="272" stroke="#e34948" stroke-width="1.4" marker-end="url(#ahr)"/>
<text x="696" y="277" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">→ false</text>
<text x="34" y="330" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">점선 칸이 프록시 밖이다 — 여기서부터는 애노테이션이 주석과 같다.</text>
<text x="34" y="352" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">예외도 경고도 없이 트랜잭션 없이 돈다. 그래서 알아채기 어렵다.</text>
</svg>