<text x="34" y="221" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start">2회차</text>
<text x="34" y="239" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">2 + 11 = 13</text>
<text x="636" y="221" font-size="11.5" fill="#008300" font-weight="700" text-anchor="start">13 == 13 → 발견</text>
<rect x="34" y="276" width="712" height="56" rx="9" fill="#e34948" fill-opacity="0.07" stroke="#e34948" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="297" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">15 를 버려도 되는 이유</text>
<text x="48" y="314" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">15 는 가장 큰 값이다. 가장 작은 2 와 더해도 이미 13 을 넘으므로 어떤 값과 짝지어도 13 이 될 수 없다.</text>
<rect x="34" y="342" width="712" height="50" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="380" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">원소 하나를 버릴 때마다 그 원소가 낀 모든 쌍이 사라진다 · 실측 n=4만에서 이중 반복문 214.50ms → 투 포인터 0.0394ms</text>
