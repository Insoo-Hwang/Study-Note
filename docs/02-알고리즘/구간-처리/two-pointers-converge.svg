<text x="592.0" y="156" font-size="10.5" fill="#eb6834" font-weight="700" text-anchor="middle">hi</text>
<text x="34" y="125" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start">1회차</text>
<text x="34" y="143" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">2 + 15 = 17</text>
<text x="636" y="125" font-size="11.5" fill="#eb6834" font-weight="700" text-anchor="start">17 &gt; 13 → hi 를 줄인다</text>
