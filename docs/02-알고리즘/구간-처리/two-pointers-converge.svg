<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">투 포인터 — 한 번의 비교로 후보를 통째로 버린다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">정렬된 배열 [2 4 7 11 15] 에서 합이 13 인 두 수 찾기</text>
