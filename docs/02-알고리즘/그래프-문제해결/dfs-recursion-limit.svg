<text x="544.0" y="268" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle">-Xss8m</text>
<line x1="52" y1="250" x2="596" y2="250" stroke="#898781" stroke-width="1.2"/>
<text x="60" y="288" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">스택 크기에 거의 정비례한다 (막대는 제곱근 스케일)</text>
<rect x="596" y="96" width="150" height="172" rx="9" fill="#e34948" fill-opacity="0.07" stroke="#e34948" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="610" y="117" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">재귀 DFS</text>
<text x="610" y="134" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">JVM 호출 스택</text>
<text x="610" y="158" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">기본값</text>
<text x="610" y="178" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">약 24,900</text>
<text x="610" y="202" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">DFS 형태</text>
<text x="610" y="222" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">약 10,739</text>
<text x="610" y="248" font-size="11" fill="#e34948" font-weight="700" text-anchor="start">여기서 터진다</text>
<rect x="34" y="296" width="356" height="88" rx="9" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="317" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start">프레임 크기가 깊이를 좌우한다</text>
<text x="48" y="334" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">같은 -Xss 에서도 3배 이상 차이가 난다</text>
<text x="48" y="350" font-size="11" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">단순 재귀 약 24,900   /   long 인자 5개 약 7,159</text>
<text x="48" y="370" font-size="11" fill="#e34948" font-weight="700" text-anchor="start">같은 코드도 실행마다 다름 (23,408 과 24,960)</text>
<rect x="406" y="296" width="340" height="88" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="420" y="317" font-size="13" fill="#008300" font-weight="700" text-anchor="start">명시적 스택 DFS (힙 사용)</text>
<text x="420" y="334" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">깊이 제한이 사실상 없다</text>
<text x="420" y="350" font-size="11" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">깊이 1,000,000  →  63.4 ms 완주</text>
<text x="420" y="370" font-size="11" fill="#008300" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">깊이 10,000,000 →  135.4 ms 완주</text>
