<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">재귀 DFS 의 깊이 한계는 스택 크기가 정한다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">JDK 17.0.12 실측 · 재귀는 스레드 호출 스택, 명시적 스택은 힙을 쓴다</text>
<text x="60" y="108" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start">-Xss 설정별 최대 재귀 깊이</text>
