<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 384" width="780" height="384" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="778" height="382" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">방문 표시는 큐에 넣을 때 해야 한다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">정점 6개 완전 그래프 실측 · 큐에 들어간 총 횟수 비교</text>
<rect x="34" y="96" width="356" height="200" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="117" font-size="13" fill="#008300" font-weight="700" text-anchor="start">① 큐에 넣을 때 표시 (올바름)</text>
<text x="48" y="134" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">각 정점이 정확히 한 번만 큐에 들어간다</text>
<text x="50" y="152" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">for (next : 이웃) {</text>
<text x="50" y="172" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">    if (!visited[next]) {</text>
<text x="50" y="192" font-size="11.5" fill="#008300" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">        visited[next] = true;</text>
<text x="50" y="212" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">        queue.offer(next);</text>
<text x="50" y="232" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">    }</text>
<text x="50" y="252" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">}</text>
<rect x="50" y="262" width="320" height="26" rx="4" fill="#eaf5ea" stroke="#008300" stroke-width="1.3"/>
<text x="210.0" y="279.32" font-size="12" fill="#008300" font-weight="600" text-anchor="middle">큐 삽입 총 6회 = 정점 수</text>
<rect x="406" y="96" width="340" height="200" rx="9" fill="#e34948" fill-opacity="0.07" stroke="#e34948" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="420" y="117" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">② 큐에서 꺼낼 때 표시 (중복 발생)</text>
<text x="420" y="134" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">아직 안 꺼낸 정점을 여러 이웃이 또 넣는다</text>
<text x="422" y="152" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">int cur = queue.poll();</text>
<text x="422" y="172" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">if (visited[cur]) continue;</text>
<text x="422" y="192" font-size="11.5" fill="#e34948" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">visited[cur] = true;</text>
<text x="422" y="212" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">for (next : 이웃)</text>
<text x="422" y="232" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">    if (!visited[next])</text>
<text x="422" y="252" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">        queue.offer(next);</text>
<rect x="422" y="262" width="306" height="26" rx="4" fill="#fdeee7" stroke="#e34948" stroke-width="1.3"/>
<text x="575.0" y="279.32" font-size="12" fill="#e34948" font-weight="600" text-anchor="middle">큐 삽입 총 16회 — 약 2.7배</text>
<rect x="34" y="310" width="712" height="62" rx="9" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="331" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start">왜 중복되는가</text>
<text x="48" y="348" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">A 와 B 가 둘 다 X 와 연결되어 있을 때, X 를 아직 안 꺼냈다면 A 도 B 도 X 를 큐에 넣는다.</text>
<text x="48" y="364" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">간선이 많은 그래프에서는 큐 크기가 최악 O(E) 까지 부푼다 — 메모리와 시간 모두에 영향을 준다.</text>
</svg>