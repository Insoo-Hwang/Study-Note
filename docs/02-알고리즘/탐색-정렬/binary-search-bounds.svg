<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 306" width="720" height="306" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="718" height="304" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">lower bound 와 upper bound</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">중복이 있는 배열에서 경계 두 개를 구하면 개수가 뺄셈으로 나온다</text>
<text x="156.0" y="92" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">0</text>
<text x="240.0" y="92" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">1</text>
<text x="324.0" y="92" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">2</text>
<text x="408.0" y="92" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">3</text>
<text x="492.0" y="92" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">4</text>
<text x="576.0" y="92" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">5</text>
<rect x="118" y="102" width="76" height="42" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="156.0" y="127.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">1</text>
<rect x="202" y="102" width="76" height="42" rx="4" fill="#e7f0fb" stroke="#2a78d6" stroke-width="1.3"/>
<text x="240.0" y="127.68" font-size="13" fill="#2a78d6" font-weight="600" text-anchor="middle">2</text>
<rect x="286" y="102" width="76" height="42" rx="4" fill="#e7f0fb" stroke="#2a78d6" stroke-width="1.3"/>
<text x="324.0" y="127.68" font-size="13" fill="#2a78d6" font-weight="600" text-anchor="middle">2</text>
<rect x="370" y="102" width="76" height="42" rx="4" fill="#e7f0fb" stroke="#2a78d6" stroke-width="1.3"/>
<text x="408.0" y="127.68" font-size="13" fill="#2a78d6" font-weight="600" text-anchor="middle">2</text>
<rect x="454" y="102" width="76" height="42" rx="4" fill="#e7f0fb" stroke="#2a78d6" stroke-width="1.3"/>
<text x="492.0" y="127.68" font-size="13" fill="#2a78d6" font-weight="600" text-anchor="middle">2</text>
<rect x="538" y="102" width="76" height="42" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="576.0" y="127.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">3</text>
<line x1="202" y1="186" x2="202" y2="150" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)"/>
<text x="202" y="206" font-size="12" fill="#008300" font-weight="700" text-anchor="middle">lower bound(2) = 1</text>
<text x="202" y="223" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle">2 이상인 첫 위치</text>
<line x1="538" y1="186" x2="538" y2="150" stroke="#7a3ba7" stroke-width="1.4" marker-end="url(#ahp)"/>
<text x="538" y="206" font-size="12" fill="#7a3ba7" font-weight="700" text-anchor="middle">upper bound(2) = 5</text>
<text x="538" y="223" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle">2 초과인 첫 위치</text>
<line x1="206" y1="158" x2="534" y2="158" stroke="#2a78d6" stroke-width="2"/>
<text x="370.0" y="174" font-size="11" fill="#2a78d6" font-weight="700" text-anchor="middle">값이 2 인 구간</text>
<rect x="34" y="240" width="652" height="50" rx="9" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="261" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start">2 의 개수 = upper − lower = 5 − 1 = 4</text>
<text x="48" y="278" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">Arrays.binarySearch 는 이 중 어느 것을 줄지 보장하지 않는다 (인덱스 2)</text>
