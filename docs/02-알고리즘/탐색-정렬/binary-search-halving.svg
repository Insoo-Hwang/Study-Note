<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 408" width="780" height="408" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="778" height="406" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">이진 탐색 — 비교 한 번에 절반을 버린다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">정렬된 배열 [10 20 30 40 50 60 70] 에서 60 찾기</text>
<text x="174.0" y="84" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">0</text>
<text x="240.0" y="84" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">1</text>
<text x="306.0" y="84" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">2</text>
<text x="372.0" y="84" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">3</text>
<text x="438.0" y="84" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">4</text>
<text x="504.0" y="84" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">5</text>
<text x="570.0" y="84" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">6</text>
<text x="34" y="130" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start">1회차</text>
<text x="34" y="148" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">후보 7개</text>
<rect x="144" y="110" width="60" height="38" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="174.0" y="133.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">10</text>
<rect x="210" y="110" width="60" height="38" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="240.0" y="133.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">20</text>
<rect x="276" y="110" width="60" height="38" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="306.0" y="133.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">30</text>
<rect x="342" y="110" width="60" height="38" rx="4" fill="#fdeee7" stroke="#eb6834" stroke-width="1.3"/>
<text x="372.0" y="133.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">40</text>
<rect x="408" y="110" width="60" height="38" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="438.0" y="133.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">50</text>
<rect x="474" y="110" width="60" height="38" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="504.0" y="133.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">60</text>
<rect x="540" y="110" width="60" height="38" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="570.0" y="133.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">70</text>
<text x="372.0" y="101" font-size="10.5" fill="#eb6834" font-weight="700" text-anchor="middle">mid</text>
<text x="174.0" y="164" font-size="10.5" fill="#2a78d6" font-weight="700" text-anchor="middle">low</text>
<text x="570.0" y="164" font-size="10.5" fill="#2a78d6" font-weight="700" text-anchor="middle">high</text>
<text x="612" y="126" font-size="11.5" fill="#eb6834" font-weight="700" text-anchor="start">40 &lt; 60</text>
<text x="612" y="144" font-size="11.5" fill="#eb6834" font-weight="700" text-anchor="start">→ 왼쪽 버림</text>
<text x="34" y="232" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start">2회차</text>
<text x="34" y="250" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">후보 3개</text>
<rect x="144" y="212" width="60" height="38" rx="4" fill="#f4f3f1" stroke="#c9c7c3" stroke-width="1.3"/>
<text x="174.0" y="235.68" font-size="13" fill="#b0aeaa" font-weight="600" text-anchor="middle">10</text>
<rect x="210" y="212" width="60" height="38" rx="4" fill="#f4f3f1" stroke="#c9c7c3" stroke-width="1.3"/>
<text x="240.0" y="235.68" font-size="13" fill="#b0aeaa" font-weight="600" text-anchor="middle">20</text>
<rect x="276" y="212" width="60" height="38" rx="4" fill="#f4f3f1" stroke="#c9c7c3" stroke-width="1.3"/>
<text x="306.0" y="235.68" font-size="13" fill="#b0aeaa" font-weight="600" text-anchor="middle">30</text>
<rect x="342" y="212" width="60" height="38" rx="4" fill="#f4f3f1" stroke="#c9c7c3" stroke-width="1.3"/>
<text x="372.0" y="235.68" font-size="13" fill="#b0aeaa" font-weight="600" text-anchor="middle">40</text>
<rect x="408" y="212" width="60" height="38" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="438.0" y="235.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">50</text>
<rect x="474" y="212" width="60" height="38" rx="4" fill="#eaf5ea" stroke="#008300" stroke-width="1.3"/>
<text x="504.0" y="235.68" font-size="13" fill="#008300" font-weight="600" text-anchor="middle">60</text>
<rect x="540" y="212" width="60" height="38" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="570.0" y="235.68" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">70</text>
<text x="504.0" y="203" font-size="10.5" fill="#008300" font-weight="700" text-anchor="middle">mid</text>
<text x="438.0" y="266" font-size="10.5" fill="#2a78d6" font-weight="700" text-anchor="middle">low</text>
<text x="570.0" y="266" font-size="10.5" fill="#2a78d6" font-weight="700" text-anchor="middle">high</text>
<text x="612" y="228" font-size="11.5" fill="#008300" font-weight="700" text-anchor="start">60 == 60</text>
<text x="612" y="246" font-size="11.5" fill="#008300" font-weight="700" text-anchor="start">→ 발견</text>
<text x="34" y="302" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start">후보 수</text>
<text x="144" y="302" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">7 → 3 → 1   /   비교 2번으로 끝난다 (선형 탐색이면 6번)</text>
<rect x="34" y="322" width="712" height="70" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="343" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start">값이 없을 때는 low 가 곧 삽입점이다</text>
<text x="48" y="360" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">Arrays.binarySearch 는 −(삽입점) − 1 을 반환한다. 25 를 못 찾으면 −3 이고, −(−3+1) = 2 가 삽입점이다.</text>
<text x="48" y="382" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">삽입점이 0 이면 −0 = 0 이 되어 '인덱스 0에서 찾음'과 구분되지 않으므로 1을 더 뺀다.</text>
</svg>