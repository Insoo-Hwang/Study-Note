<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 384" width="780" height="384" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="778" height="382" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">기준이 클래스 안에 있는가, 밖에 있는가</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">Comparable 은 타입의 기본 순서 하나, Comparator 는 갈아 끼우는 순서 여럿</text>
<rect x="34" y="92" width="348" height="250" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="113" font-size="13" fill="#008300" font-weight="700" text-anchor="start">Comparable  (java.lang)</text>
<text x="48" y="130" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">클래스가 직접 구현한다 · 클래스당 1개</text>
<rect x="58" y="146" width="300" height="116" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="74" y="172" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">class Member</text>
<text x="74" y="194" font-size="11.5" fill="#008300" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">implements Comparable</text>
<rect x="88" y="206" width="240" height="44" rx="4" fill="#eaf5ea" stroke="#008300" stroke-width="1.3"/>
<text x="208.0" y="232.32" font-size="12" fill="#008300" font-weight="600" text-anchor="middle">compareTo(Member o)</text>
<text x="58" y="286" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">· 클래스를 수정할 수 있어야 한다</text>
<text x="58" y="306" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">· 기준을 바꾸려면 클래스를 고쳐야 한다</text>
<text x="58" y="326" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">· sort(arr) 로 바로 쓴다</text>
<rect x="398" y="92" width="348" height="250" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="412" y="113" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start">Comparator  (java.util)</text>
<text x="412" y="130" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">별도 객체로 만든다 · 필요한 만큼 여러 개</text>
<rect x="414" y="146" width="152" height="46" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="490.0" y="173.32" font-size="12" fill="#2a78d6" font-weight="600" text-anchor="middle">이름순</text>
<rect x="578" y="146" width="152" height="46" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="654.0" y="173.32" font-size="12" fill="#2a78d6" font-weight="600" text-anchor="middle">나이순</text>
<rect x="414" y="200" width="152" height="46" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="490.0" y="227.32" font-size="12" fill="#2a78d6" font-weight="600" text-anchor="middle">금액 내림차순</text>
<rect x="578" y="200" width="152" height="46" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="654.0" y="227.32" font-size="12" fill="#2a78d6" font-weight="600" text-anchor="middle">등급 + 금액</text>
<text x="414" y="286" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">· 남의 클래스에도 적용된다 (String 등)</text>
<text x="414" y="306" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">· 자연 순서를 덮어쓸 수 있다</text>
<text x="414" y="326" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">· sort(arr, comparator) 로 지정한다</text>
<text x="34" y="366" font-size="11.5" fill="#0b0b0b" font-weight="700" text-anchor="start">실무에서는 보통 둘 다 쓴다 — 논란 없는 기본 순서 하나는 Comparable, 화면·용도별 순서는 Comparator 상수로.</text>
</svg>