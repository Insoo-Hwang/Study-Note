<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" width="760" height="412" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="410" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">HashMap 버킷은 언제 트리가 되는가</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">버킷 길이 8은 필요조건일 뿐, table 길이 64 이상이라는 조건이 함께 붙는다</text>
<rect x="28" y="96" width="176" height="44" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="116" y="114" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">버킷에 8번째</text>
<text x="116" y="130" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">노드가 추가됨</text>
<line x1="204" y1="118" x2="236" y2="118" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="238" y="96" width="176" height="44" rx="4" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="326" y="114" font-size="11.5" fill="#7a3ba7" font-weight="700" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">table.length</text>
<text x="326" y="131" font-size="11.5" fill="#7a3ba7" font-weight="700" text-anchor="middle">≥ 64 인가?</text>
<line x1="414" y1="108" x2="452" y2="88" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)"/>
<text x="424" y="92" font-size="11" fill="#008300" font-weight="700" text-anchor="start">예</text>
<rect x="454" y="70" width="278" height="36" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="593.0" y="92.32" font-size="12" fill="#008300" font-weight="600" text-anchor="middle">트리화 — TreeNode 로 전환  O(log n)</text>
<line x1="414" y1="130" x2="452" y2="150" stroke="#eb6834" stroke-width="1.4" marker-end="url(#aho)"/>
<text x="410" y="158" font-size="11" fill="#eb6834" font-weight="700" text-anchor="end">아니오</text>
<rect x="454" y="132" width="278" height="36" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="593.0" y="154.32" font-size="12" fill="#eb6834" font-weight="600" text-anchor="middle">트리화하지 않고 resize — table 2배</text>
<rect x="28" y="190" width="704" height="192" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="42" y="211" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start">실측 (JDK 17)</text>
<text x="42" y="228" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">해시가 모두 같은 키를 기본 HashMap 에 하나씩 추가</text>
<text x="60" y="250" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="start">넣은 개수</text>
<text x="210" y="250" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="start">table 길이</text>
<text x="400" y="250" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="start">가장 긴 버킷의 상태</text>
<line x1="60" y1="258" x2="700" y2="258" stroke="rgba(11,11,11,0.10)" stroke-width="1"/>
<text x="60" y="280" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">8개</text>
<text x="210" y="280" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">16</text>
<text x="400" y="280" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start">8칸 연결 리스트</text>
<text x="60" y="301" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">9개</text>
<text x="210" y="301" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">32</text>
<text x="400" y="301" font-size="11.5" fill="#eb6834" font-weight="700" text-anchor="start">9칸 연결 리스트 — resize 발생</text>
<text x="60" y="322" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">10개</text>
<text x="210" y="322" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">64</text>
<text x="400" y="322" font-size="11.5" fill="#eb6834" font-weight="700" text-anchor="start">10칸 연결 리스트 — resize 발생</text>
<text x="60" y="343" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">11개</text>
<text x="210" y="343" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">64</text>
<text x="400" y="343" font-size="11.5" fill="#008300" font-weight="700" text-anchor="start">TreeNode — 이제서야 트리화</text>
<text x="60" y="370" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">table 을 미리 128로 키워 두면 9번째에서 곧바로 TreeNode 가 된다</text>
</svg>