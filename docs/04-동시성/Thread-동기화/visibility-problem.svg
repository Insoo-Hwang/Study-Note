<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="338" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">volatile 없는 플래그가 보이지 않는 이유</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">JDK 17 실측 — plainFlag = false 로 바꾼 뒤 3초가 지나도 워커는 RUNNABLE</text>
<rect x="34" y="82" width="214" height="132" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="103" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start">메인 스레드 · 코어 A</text>
<text x="48" y="120" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">plainFlag = false 실행</text>
<rect x="50" y="138" width="182" height="34" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="141.0" y="159.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">캐시   flag = false</text>
<text x="50" y="196" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">메인 메모리로 밀어낸다</text>
<rect x="276" y="82" width="190" height="132" rx="9" fill="#7a3ba7" fill-opacity="0.07" stroke="#7a3ba7" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="290" y="103" font-size="13" fill="#7a3ba7" font-weight="700" text-anchor="start">메인 메모리</text>
<text x="290" y="120" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">실제 값은 바뀌었다</text>
<rect x="292" y="138" width="158" height="34" rx="4" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="371.0" y="159.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">flag = false</text>
<text x="292" y="196" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">여기까지는 정상이다</text>
<rect x="494" y="82" width="232" height="132" rx="9" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="508" y="103" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start">워커 스레드 · 코어 B</text>
<text x="508" y="120" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">while (plainFlag) { i++; }</text>
<rect x="510" y="138" width="200" height="34" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="610.0" y="159.32" font-size="12" fill="#e34948" font-weight="600" text-anchor="middle">캐시   flag = true</text>
<text x="510" y="196" font-size="11.5" fill="#e34948" font-weight="400" text-anchor="start">캐시만 본다 — 다시 안 읽는다</text>
<line x1="248" y1="155" x2="272" y2="155" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ahb)"/>
<line x1="490" y1="155" x2="470" y2="155" stroke="#e34948" stroke-width="1.4" marker-end="url(#ahr)" stroke-dasharray="5 4"/>
<text x="478" y="130" font-size="17" fill="#e34948" font-weight="700" text-anchor="middle">✕</text>
<rect x="34" y="230" width="692" height="76" rx="9" fill="#e34948" fill-opacity="0.07" stroke="#e34948" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="251" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">JIT 최적화가 한 겹 더 얹힌다</text>
<text x="48" y="268" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">while (plainFlag) { i++; }   →   if (plainFlag) { while (true) { i++; } }   — 변수를 아예 다시 읽지 않는다</text>
<text x="48" y="288" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">실측   plain 플래그: 3초 후에도 살아 있음 (RUNNABLE)   /   volatile 플래그: 즉시 종료</text>
</svg>