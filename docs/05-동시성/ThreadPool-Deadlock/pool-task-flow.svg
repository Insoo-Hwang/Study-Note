<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 464" width="760" height="464" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="462" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">작업이 코어 · 큐 · 추가 스레드 · 거부를 거치는 순서</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">JDK 17 실측 — core=2, max=4, queue=2 인 풀에 2초짜리 작업 7개를 연속 제출</text>
<rect x="34" y="84" width="34" height="56" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="51.0" y="117.4" font-size="15" fill="#2a78d6" font-weight="600" text-anchor="middle">1</text>
<rect x="80" y="84" width="250" height="56" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="94" y="108" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">실행 중 &lt; corePoolSize ?</text>
<text x="94" y="128" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">새 스레드를 만든다</text>
<line x1="336" y1="112" x2="362" y2="112" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ahb)"/>
<rect x="368" y="84" width="358" height="56" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="384" y="117" font-size="12.5" fill="#2a78d6" font-weight="600" text-anchor="start">작업 1·2  →  pool=1, 2</text>
<line x1="51" y1="144" x2="51" y2="158" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="64" y="156" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="start">아니면</text>
<rect x="34" y="162" width="34" height="56" rx="4" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="51.0" y="195.4" font-size="15" fill="#7a3ba7" font-weight="600" text-anchor="middle">2</text>
<rect x="80" y="162" width="250" height="56" rx="4" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="94" y="186" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">큐에 넣을 수 있나 ?</text>
<text x="94" y="206" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">큐에 넣는다</text>
<line x1="336" y1="190" x2="362" y2="190" stroke="#7a3ba7" stroke-width="1.4" marker-end="url(#ahp)"/>
<rect x="368" y="162" width="358" height="56" rx="4" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="384" y="195" font-size="12.5" fill="#7a3ba7" font-weight="600" text-anchor="start">작업 3·4  →  queue=1, 2</text>
<line x1="51" y1="222" x2="51" y2="236" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="64" y="234" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="start">아니면</text>
<rect x="34" y="240" width="34" height="56" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="51.0" y="273.4" font-size="15" fill="#eb6834" font-weight="600" text-anchor="middle">3</text>
<rect x="80" y="240" width="250" height="56" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="94" y="264" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">스레드 &lt; maximumPoolSize ?</text>
<text x="94" y="284" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">새 스레드를 만든다</text>
<line x1="336" y1="268" x2="362" y2="268" stroke="#eb6834" stroke-width="1.4" marker-end="url(#aho)"/>
<rect x="368" y="240" width="358" height="56" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="384" y="273" font-size="12.5" fill="#eb6834" font-weight="600" text-anchor="start">작업 5·6  →  pool=3, 4</text>
<line x1="51" y1="300" x2="51" y2="314" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="64" y="312" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="start">아니면</text>
<rect x="34" y="318" width="34" height="56" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="51.0" y="351.4" font-size="15" fill="#e34948" font-weight="600" text-anchor="middle">4</text>
<rect x="80" y="318" width="250" height="56" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="94" y="342" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">그 외</text>
<text x="94" y="362" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">거부 정책을 실행한다</text>
<line x1="336" y1="346" x2="362" y2="346" stroke="#e34948" stroke-width="1.4" marker-end="url(#ahr)"/>
<rect x="368" y="318" width="358" height="56" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="384" y="351" font-size="12.5" fill="#e34948" font-weight="600" text-anchor="start">작업 7  →  RejectedExecutionException</text>
<rect x="34" y="392" width="692" height="58" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="413" font-size="13" fill="#008300" font-weight="700" text-anchor="start">2번이 3번보다 먼저라는 것이 모든 함정의 근원이다</text>
<text x="48" y="430" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">큐가 무한이면 2번에서 항상 성공하므로 3번에 도달하지 못한다 — 실측 max=100 인데 poolSize=1, queue=49</text>
</svg>