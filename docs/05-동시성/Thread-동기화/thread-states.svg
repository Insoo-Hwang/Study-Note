<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="378" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">스레드의 6가지 상태와 각 상태를 만드는 호출</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">JDK 17 실측 — Thread.State.values() 및 각 상태를 직접 재현</text>
<rect x="48" y="92" width="128" height="44" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="112.0" y="119.04" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="middle">NEW</text>
<rect x="276" y="92" width="152" height="44" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="352.0" y="119.04" font-size="14" fill="#008300" font-weight="600" text-anchor="middle">RUNNABLE</text>
<rect x="572" y="92" width="152" height="44" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="648.0" y="119.04" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="middle">TERMINATED</text>
<line x1="180" y1="114" x2="272" y2="114" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="226" y="106" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle">start()</text>
<line x1="432" y1="114" x2="568" y2="114" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="500" y="106" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle">run() 반환</text>
<line x1="352" y1="138" x2="352" y2="170" stroke="#898781" stroke-width="1.4"/>
<line x1="156" y1="170" x2="618" y2="170" stroke="#898781" stroke-width="1.4"/>
<line x1="156" y1="170" x2="156" y2="200" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="388" y1="170" x2="388" y2="200" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="618" y1="170" x2="618" y2="200" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="248" y="190" font-size="11" fill="#008300" font-weight="600" text-anchor="middle">대기 진입 ↔ 조건이 풀리면 RUNNABLE 로 복귀</text>
<rect x="48" y="206" width="216" height="94" rx="9" fill="#e34948" fill-opacity="0.07" stroke="#e34948" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="62" y="227" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">BLOCKED</text>
<text x="62" y="244" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">락 진입 대기 — entry set</text>
<text x="62" y="276" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">synchronized 블록 앞에서 대기</text>
<rect x="280" y="206" width="216" height="94" rx="9" fill="#7a3ba7" fill-opacity="0.07" stroke="#7a3ba7" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="294" y="227" font-size="13" fill="#7a3ba7" font-weight="700" text-anchor="start">WAITING</text>
<text x="294" y="244" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">무기한 대기 — wait set</text>
<text x="294" y="276" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">wait()   ·   join()   ·   take()</text>
<rect x="512" y="206" width="212" height="94" rx="9" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="526" y="227" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start">TIMED_WAITING</text>
<text x="526" y="244" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">시간 제한 대기</text>
<text x="526" y="276" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">sleep(n)   ·   wait(n)   ·   poll(n)</text>
<rect x="34" y="314" width="692" height="54" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="335" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start">RUNNABLE 은 '실행 중'이 아니라 '실행 가능'이다</text>
<text x="48" y="352" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">JVM 은 OS 의 실행 중 / I-O 대기를 구분하지 않는다 — 디스크를 기다리는 스레드도 RUNNABLE 로 보인다</text>
</svg>