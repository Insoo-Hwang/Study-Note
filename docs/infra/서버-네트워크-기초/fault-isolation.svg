<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 358" width="760" height="358" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="356" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">증상으로 원인 구간을 자른다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">위에서부터 하나씩 확인하면 '안 된다'가 '어디서 끊겼다'로 바뀐다</text>
<rect x="34" y="92" width="232" height="30" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="46" y="112" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">404 가 뜬다</text>
<line x1="272" y1="107" x2="300" y2="107" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)"/>
<text x="308" y="112" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">네트워크·포트·프로세스 전부 정상. 라우팅만 보면 된다</text>
<rect x="34" y="130" width="232" height="30" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="46" y="150" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">localhost 성공</text>
<line x1="272" y1="145" x2="300" y2="145" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)"/>
<text x="308" y="150" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">Application 은 살아 있다</text>
<rect x="34" y="168" width="232" height="30" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="46" y="188" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">Private IP 도 성공</text>
<line x1="272" y1="183" x2="300" y2="183" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)"/>
<text x="308" y="188" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">bind 정상 — *:8080 으로 열려 있다</text>
<rect x="34" y="206" width="232" height="30" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="46" y="226" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">외부에서만 실패</text>
<line x1="272" y1="221" x2="300" y2="221" stroke="#eb6834" stroke-width="1.4" marker-end="url(#aho)"/>
<text x="308" y="226" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">Network 또는 Firewall 구간</text>
<rect x="34" y="244" width="232" height="30" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="46" y="264" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">tcpdump 에 패킷 없음</text>
<line x1="272" y1="259" x2="300" y2="259" stroke="#e34948" stroke-width="1.4" marker-end="url(#ahr)"/>
<text x="308" y="264" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">서버에 도착조차 못 했다 → LAN 구간 (AP Isolation 등)</text>
<rect x="34" y="282" width="232" height="30" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="46" y="302" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">curl: (7) Couldn't connect</text>
<line x1="272" y1="297" x2="300" y2="297" stroke="#e34948" stroke-width="1.4" marker-end="url(#ahr)"/>
<text x="308" y="302" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">TCP 연결 실패 — LISTEN 중인 프로세스부터 확인</text>
<text x="34" y="340" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">설정을 바꾸기 전에 '어디까지 왔는지' 부터 자른다.</text>
</svg>