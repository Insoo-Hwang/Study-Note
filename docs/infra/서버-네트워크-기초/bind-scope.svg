<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" width="760" height="344" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="342" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">bind 주소가 접근 범위를 정한다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">같은 프로세스·같은 포트라도 닿을 수 있는 곳이 달라진다</text>
<rect x="34" y="84" width="344" height="218" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="105" font-size="13" fill="#008300" font-weight="700" text-anchor="start">기본값 — 모든 인터페이스에 bind</text>
<text x="48" y="122" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">server.address 미지정 시</text>
<text x="48" y="150" font-size="12" fill="#008300" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">TCP *:8080 (LISTEN)</text>
<rect x="48" y="162" width="150" height="32" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="123.0" y="182.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">Spring Boot</text>
<rect x="48" y="212" width="172" height="22" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="58" y="227" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start">localhost / ::1</text>
<text x="296" y="227" font-size="11.5" fill="#008300" font-weight="700" text-anchor="middle">닿는다</text>
<line x1="228" y1="223" x2="254" y2="223" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)"/>
<rect x="48" y="242" width="172" height="22" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="58" y="257" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start">172.29.57.15 (LAN)</text>
<text x="296" y="257" font-size="11.5" fill="#008300" font-weight="700" text-anchor="middle">닿는다</text>
<line x1="228" y1="253" x2="254" y2="253" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)"/>
<rect x="48" y="272" width="172" height="22" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="58" y="287" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start">스마트폰 (같은 Wi-Fi)</text>
<text x="296" y="287" font-size="11.5" fill="#008300" font-weight="700" text-anchor="middle">닿는다</text>
<line x1="228" y1="283" x2="254" y2="283" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)"/>
<rect x="392" y="84" width="334" height="218" rx="9" fill="#e34948" fill-opacity="0.07" stroke="#e34948" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="406" y="105" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">127.0.0.1 에만 bind</text>
<text x="406" y="122" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">server.address=127.0.0.1</text>
<text x="406" y="150" font-size="12" fill="#e34948" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">TCP 127.0.0.1:8080 (LISTEN)</text>
<rect x="406" y="162" width="150" height="32" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="481.0" y="182.32" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">Spring Boot</text>
<rect x="406" y="212" width="172" height="22" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="416" y="227" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start">localhost / 127.0.0.1</text>
<text x="654" y="227" font-size="11.5" fill="#008300" font-weight="700" text-anchor="middle">닿는다</text>
<line x1="586" y1="223" x2="612" y2="223" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)"/>
<rect x="406" y="242" width="172" height="22" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="416" y="257" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start">172.29.57.15 (LAN)</text>
<text x="654" y="257" font-size="11.5" fill="#e34948" font-weight="700" text-anchor="middle">막힌다</text>
<line x1="586" y1="253" x2="612" y2="253" stroke="#e34948" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="599" y="258" font-size="13" fill="#e34948" font-weight="700" text-anchor="middle">✕</text>
<rect x="406" y="272" width="172" height="22" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="416" y="287" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start">스마트폰 (같은 Wi-Fi)</text>
<text x="654" y="287" font-size="11.5" fill="#e34948" font-weight="700" text-anchor="middle">막힌다</text>
<line x1="586" y1="283" x2="612" y2="283" stroke="#e34948" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="599" y="288" font-size="13" fill="#e34948" font-weight="700" text-anchor="middle">✕</text>
<text x="34" y="328" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">판별법 — lsof 의 NAME 칸이 * 로 시작하면 외부에 열려 있고, 127.0.0.1 이면 자기 자신만이다.</text>
</svg>