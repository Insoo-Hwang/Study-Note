<text x="123.0" y="179.0" font-size="12" fill="#2a78d6" font-weight="700" text-anchor="middle">Browser</text>
<text x="123.0" y="194.0" font-size="10" fill="#52514e" font-weight="400" text-anchor="middle">example.com</text>
<rect x="270" y="148" width="170" height="64" rx="6" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="355.0" y="179.0" font-size="13" fill="#eb6834" font-weight="700" text-anchor="middle">Nginx</text>
<text x="355.0" y="194.5" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">Reverse Proxy</text>
<line x1="202" y1="180" x2="266" y2="180" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="540" y="95" width="180" height="48" rx="6" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="630.0" y="123.32" font-size="12" fill="#008300" font-weight="700" text-anchor="middle">backend-1 :8080</text>
<line x1="444" y1="180" x2="536" y2="119" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="540" y="156" width="180" height="48" rx="6" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="630.0" y="184.32" font-size="12" fill="#008300" font-weight="700" text-anchor="middle">backend-2 :8080</text>
<line x1="444" y1="180" x2="536" y2="180" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="540" y="217" width="180" height="48" rx="6" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="630.0" y="245.32" font-size="12" fill="#008300" font-weight="700" text-anchor="middle">backend-3 :8080</text>
<line x1="444" y1="180" x2="536" y2="241" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="34" y="288" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">backend의 실제 IP와 Port를 아는 것은 Nginx뿐이다. 그래서 뒤를 바꿔도 사용자는 모른다.</text>
