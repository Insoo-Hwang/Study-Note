<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 285" width="760" height="285" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="283" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">Port는 '그 컴퓨터의 어떤 프로그램인가'</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">IP 하나 안에서 실행 중인 프로그램들을 번호로 구분한다</text>
<rect x="40" y="88" width="680" height="132" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="54" y="109" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start">MacBook — 192.168.0.10</text>
<text x="54" y="126" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">IP는 하나, Port는 여럿</text>
<rect x="70" y="142" width="190" height="58" rx="6" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="165.0" y="170.0" font-size="13" fill="#008300" font-weight="700" text-anchor="middle">Nginx</text>
<text x="165.0" y="185.5" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">:80</text>
<rect x="285" y="142" width="190" height="58" rx="6" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="380.0" y="170.0" font-size="13" fill="#eb6834" font-weight="700" text-anchor="middle">Spring Boot</text>
<text x="380.0" y="185.5" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">:8080</text>
<rect x="500" y="142" width="190" height="58" rx="6" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="595.0" y="170.0" font-size="13" fill="#7a3ba7" font-weight="700" text-anchor="middle">PostgreSQL</text>
<text x="595.0" y="185.5" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">:5432</text>
<text x="34" y="248" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">192.168.0.10:8080  →  이 컴퓨터에서 8080을 듣고 있는 Spring Boot</text>
<text x="34" y="268" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">lsof -i :8080 (macOS) · netstat -ano | findstr :8080 (Windows) 로 누가 쓰는지 본다.</text>
</svg>