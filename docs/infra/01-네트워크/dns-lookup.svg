<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 265" width="760" height="265" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="263" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">DNS는 이름을 IP로 바꿔 준다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">브라우저는 먼저 물어보고, 답으로 받은 IP로 접속한다</text>
<rect x="40" y="105" width="150" height="62" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="115.0" y="140.68" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="middle">Browser</text>
<rect x="300" y="105" width="160" height="62" rx="6" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="380.0" y="135.0" font-size="13" fill="#eb6834" font-weight="700" text-anchor="middle">DNS Resolver</text>
<text x="380.0" y="150.5" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">이름 → 주소</text>
<rect x="570" y="105" width="150" height="62" rx="6" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="645.0" y="135.0" font-size="13" fill="#008300" font-weight="700" text-anchor="middle">Web Server</text>
<text x="645.0" y="150.5" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">203.0.113.10</text>
<line x1="194" y1="124" x2="296" y2="124" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="245" y="117" font-size="9.5" fill="#52514e" font-weight="400" text-anchor="middle">① example.com ?</text>
<polyline points="296,152 194,152" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="245" y="168" font-size="9.5" fill="#52514e" font-weight="400" text-anchor="middle">② 203.0.113.10</text>
<polyline points="115,171 115,210 645,210 645,171" fill="none" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)"/>
<text x="380" y="228" font-size="11" fill="#008300" font-weight="600" text-anchor="middle">③ 받은 IP로 직접 접속한다 (DNS는 여기서 빠진다)</text>
<text x="34" y="252" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">nslookup example.com · dig example.com 으로 같은 질의를 직접 해 볼 수 있다.</text>
</svg>