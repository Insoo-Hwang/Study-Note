<text x="34" y="302" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">밖에서 보이는 것은 변환된 주소뿐이라, 외부에서 안쪽 기기를 먼저 찾아갈 수는 없다.</text>
