<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">Client와 Server는 '역할'이다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">같은 프로그램도 상대가 누구냐에 따라 Client가 되고 Server가 된다</text>
<rect x="48" y="100" width="180" height="66" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="138.0" y="132.0" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="middle">Browser</text>
<text x="138.0" y="147.5" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">요청을 시작하는 쪽</text>
<rect x="290" y="100" width="180" height="66" rx="6" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="380.0" y="132.0" font-size="13" fill="#008300" font-weight="700" text-anchor="middle">Spring Boot</text>
<text x="380.0" y="147.5" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">받아서 처리하는 쪽</text>
<rect x="532" y="100" width="180" height="66" rx="6" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="622.0" y="132.0" font-size="13" fill="#7a3ba7" font-weight="700" text-anchor="middle">Payment API</text>
<text x="622.0" y="147.5" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">외부 서비스</text>
<line x1="232" y1="122" x2="284" y2="122" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<polyline points="284,148 232,148" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="474" y1="122" x2="526" y2="122" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<polyline points="526,148 474,148" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="258" y="114" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">요청</text>
<text x="258" y="165" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">응답</text>
<text x="500" y="114" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">요청</text>
<text x="500" y="165" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">응답</text>
<text x="138" y="192" font-size="12" fill="#2a78d6" font-weight="700" text-anchor="middle">Client</text>
<text x="380" y="192" font-size="12" fill="#008300" font-weight="700" text-anchor="middle">Server 이면서 Client</text>
<text x="622" y="192" font-size="12" fill="#7a3ba7" font-weight="700" text-anchor="middle">Server</text>
<text x="34" y="224" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">Spring도 다른 API를 호출하는 순간에는 Client다. 컴퓨터의 종류가 아니라 그 통신에서의 위치가 역할을 정한다.</text>
