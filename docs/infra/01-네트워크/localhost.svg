<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 275" width="760" height="275" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="273" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">localhost는 언제나 '말하는 그 기기 자신'</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">127.0.0.1은 절대 주소가 아니라 상대적인 자기 자신이다</text>
<rect x="60" y="92" width="300" height="122" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="74" y="113" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start">MacBook</text>
<text x="74" y="130" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">127.0.0.1 = MacBook</text>
<rect x="85" y="148" width="110" height="48" rx="6" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="140.0" y="176.68" font-size="13" fill="#898781" font-weight="700" text-anchor="middle">curl</text>
<line x1="199" y1="172" x2="219" y2="172" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)"/>
<rect x="223" y="148" width="112" height="48" rx="6" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="279.0" y="171.0" font-size="13" fill="#008300" font-weight="700" text-anchor="middle">Spring</text>
<text x="279.0" y="186.5" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">:8080</text>
<rect x="400" y="92" width="300" height="122" rx="9" fill="#7a3ba7" fill-opacity="0.07" stroke="#7a3ba7" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="414" y="113" font-size="13" fill="#7a3ba7" font-weight="700" text-anchor="start">iPhone</text>
<text x="414" y="130" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">127.0.0.1 = iPhone</text>
<rect x="425" y="148" width="110" height="48" rx="6" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="480.0" y="176.68" font-size="13" fill="#898781" font-weight="700" text-anchor="middle">브라우저</text>
<line x1="539" y1="172" x2="559" y2="172" stroke="#e34948" stroke-width="1.4" marker-end="url(#ahr)"/>
<rect x="563" y="148" width="112" height="48" rx="6" fill="#ffffff" stroke="#e34948" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="619.0" y="171.0" font-size="13" fill="#e34948" font-weight="700" text-anchor="middle">아무것도</text>
<text x="619.0" y="186.5" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">없음</text>
<text x="34" y="238" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">iPhone에서 localhost:8080을 열면 MacBook이 아니라 iPhone 자신을 찾는다.</text>
<text x="34" y="258" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">다른 기기에서 MacBook의 서버를 열려면 192.168.0.10:8080 처럼 IP를 써야 한다.</text>
</svg>