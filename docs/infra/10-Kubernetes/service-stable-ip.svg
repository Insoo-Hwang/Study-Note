<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 305" width="760" height="305" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="303" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">Pod IP는 바뀌어도 Service 주소는 그대로</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">그래서 Pod IP가 아니라 Service 이름으로 부른다</text>
<rect x="48" y="152" width="145" height="58" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="120.5" y="180.0" font-size="12" fill="#2a78d6" font-weight="700" text-anchor="middle">다른 Pod</text>
<text x="120.5" y="195.0" font-size="10" fill="#52514e" font-weight="400" text-anchor="middle">또는 Ingress</text>
<rect x="250" y="142" width="190" height="78" rx="6" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="345.0" y="180.0" font-size="13" fill="#eb6834" font-weight="700" text-anchor="middle">Service</text>
<text x="345.0" y="195.0" font-size="10" fill="#52514e" font-weight="400" text-anchor="middle">backend-svc:8080</text>
<line x1="197" y1="181" x2="246" y2="181" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="520" y="98" width="200" height="46" rx="6" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="620.0" y="125.14" font-size="11.5" fill="#008300" font-weight="700" text-anchor="middle">Pod  10.1.0.4</text>
<rect x="520" y="158" width="200" height="46" rx="6" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="620.0" y="185.14" font-size="11.5" fill="#008300" font-weight="700" text-anchor="middle">Pod  10.1.0.7</text>
<rect x="520" y="218" width="200" height="46" rx="6" fill="#ffffff" stroke="#008300" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="620.0" y="244.78" font-size="10.5" fill="#008300" font-weight="700" text-anchor="middle">Pod  10.1.0.31 (새로 생김)</text>
<line x1="444" y1="181" x2="516" y2="121" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="444" y1="181" x2="516" y2="181" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="444" y1="181" x2="516" y2="241" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="34" y="292" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">Pod가 죽고 다시 뜨면 IP가 바뀐다. 변하지 않는 이름을 한 겹 씌운 것이 Service다.</text>
