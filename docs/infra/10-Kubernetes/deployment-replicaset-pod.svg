<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="318" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">Deployment → ReplicaSet → Pod</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">우리가 만드는 것은 Deployment 하나뿐, 나머지는 만들어진다</text>
<rect x="280" y="95" width="200" height="56" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="380.0" y="122.0" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="middle">Deployment</text>
<text x="380.0" y="137.0" font-size="10" fill="#52514e" font-weight="400" text-anchor="middle">replicas: 3</text>
<line x1="380" y1="155" x2="380" y2="172" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="280" y="176" width="200" height="52" rx="6" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="380.0" y="201.0" font-size="13" fill="#008300" font-weight="700" text-anchor="middle">ReplicaSet</text>
<text x="380.0" y="216.0" font-size="10" fill="#52514e" font-weight="400" text-anchor="middle">개수를 지킨다</text>
<rect x="130" y="250" width="150" height="48" rx="6" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="205.0" y="278.32" font-size="12" fill="#7a3ba7" font-weight="700" text-anchor="middle">Pod 1</text>
<polyline points="380,232 380,241 205,241 205,246" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="305" y="250" width="150" height="48" rx="6" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="380.0" y="278.32" font-size="12" fill="#7a3ba7" font-weight="700" text-anchor="middle">Pod 2</text>
<polyline points="380,232 380,241 380,241 380,246" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="480" y="250" width="150" height="48" rx="6" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="555.0" y="278.32" font-size="12" fill="#7a3ba7" font-weight="700" text-anchor="middle">Pod 3</text>
<polyline points="380,232 380,241 555,241 555,246" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="34" y="310" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">새 버전을 배포하면 새 ReplicaSet이 생기고, 옛 ReplicaSet은 0개로 줄어든다 — 그래서 Rollback이 빠르다.</text>
</svg>