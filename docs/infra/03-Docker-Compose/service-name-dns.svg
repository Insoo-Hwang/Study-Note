<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="298" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">Service 이름이 곧 호스트 이름이다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">Compose가 만든 네트워크 안에서는 Docker 내부 DNS가 이름을 IP로 바꾼다</text>
<rect x="40" y="88" width="680" height="158" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="54" y="109" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start">Docker Network (compose 기본 네트워크)</text>
<rect x="70" y="150" width="165" height="62" rx="6" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="152.5" y="180.0" font-size="12" fill="#008300" font-weight="700" text-anchor="middle">backend</text>
<text x="152.5" y="195.0" font-size="10" fill="#52514e" font-weight="400" text-anchor="middle">Spring Boot</text>
<rect x="295" y="150" width="170" height="62" rx="6" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="380.0" y="180.0" font-size="12" fill="#eb6834" font-weight="700" text-anchor="middle">Docker 내부 DNS</text>
<text x="380.0" y="195.0" font-size="10" fill="#52514e" font-weight="400" text-anchor="middle">이름 → IP</text>
<rect x="525" y="150" width="165" height="62" rx="6" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="607.5" y="180.0" font-size="12" fill="#7a3ba7" font-weight="700" text-anchor="middle">db</text>
<text x="607.5" y="195.0" font-size="10" fill="#52514e" font-weight="400" text-anchor="middle">172.18.0.3:5432</text>
<line x1="239" y1="168" x2="291" y2="168" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="265" y="161" font-size="9.5" fill="#52514e" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">db?</text>
<polyline points="291,196 239,196" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="265" y="212" font-size="9" fill="#52514e" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">172.18.0.3</text>
<line x1="469" y1="181" x2="521" y2="181" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)"/>
<text x="34" y="270" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">jdbc:postgresql://db:5432/app</text>
<text x="34" y="290" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">IP는 재시작마다 바뀔 수 있지만 Service 이름은 그대로다. 그래서 이름으로 부른다.</text>
</svg>