<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 265" width="760" height="265" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="263" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">HTTPS는 이 순서로 시작된다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">③번이 끝난 뒤부터 주고받는 내용이 암호화된다</text>
<rect x="40" y="108" width="148" height="66" rx="6" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="114.0" y="140.0" font-size="12" fill="#898781" font-weight="700" text-anchor="middle">① DNS 조회</text>
<text x="114.0" y="154.5" font-size="9.5" fill="#52514e" font-weight="400" text-anchor="middle">example.com → IP</text>
<line x1="192" y1="141" x2="212" y2="141" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="216" y="108" width="148" height="66" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="290.0" y="140.0" font-size="12" fill="#2a78d6" font-weight="700" text-anchor="middle">② TCP 연결</text>
<text x="290.0" y="154.5" font-size="9.5" fill="#52514e" font-weight="400" text-anchor="middle">IP의 443 포트</text>
<line x1="368" y1="141" x2="388" y2="141" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="392" y="108" width="148" height="66" rx="6" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="466.0" y="140.0" font-size="12" fill="#eb6834" font-weight="700" text-anchor="middle">③ TLS Handshake</text>
<text x="466.0" y="154.5" font-size="9.5" fill="#52514e" font-weight="400" text-anchor="middle">인증서 검증 · 키 협상</text>
<line x1="544" y1="141" x2="564" y2="141" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="568" y="108" width="148" height="66" rx="6" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="642.0" y="140.0" font-size="12" fill="#008300" font-weight="700" text-anchor="middle">④ HTTPS 요청</text>
<text x="642.0" y="154.5" font-size="9.5" fill="#52514e" font-weight="400" text-anchor="middle">GET /api/users</text>
<line x1="392" y1="190" x2="716" y2="190" stroke="#008300" stroke-width="1.4" stroke-dasharray="4 3"/>
<line x1="392" y1="186" x2="392" y2="194" stroke="#008300" stroke-width="1.4"/>
<line x1="716" y1="186" x2="716" y2="194" stroke="#008300" stroke-width="1.4"/>
<text x="554" y="210" font-size="11.5" fill="#008300" font-weight="700" text-anchor="middle">여기서부터 내용이 암호화된다</text>
<text x="34" y="240" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">TLS가 붙어도 앞의 DNS 조회와 TCP 연결은 그대로 있다. 느리다면 어느 단계인지부터 나눈다.</text>
</svg>