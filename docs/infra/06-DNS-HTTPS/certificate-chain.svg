<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="318" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">인증서 — '이 서버가 정말 그 서버인가'를 확인한다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">암호화만으로는 부족하다. 상대가 누구인지도 확인해야 한다</text>
<rect x="48" y="110" width="170" height="64" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="133.0" y="141.0" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="middle">Browser</text>
<text x="133.0" y="156.0" font-size="10" fill="#52514e" font-weight="400" text-anchor="middle">신뢰 목록을 내장</text>
<rect x="300" y="110" width="190" height="64" rx="6" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="395.0" y="141.0" font-size="13" fill="#008300" font-weight="700" text-anchor="middle">example.com</text>
<text x="395.0" y="156.0" font-size="10" fill="#52514e" font-weight="400" text-anchor="middle">서버 인증서 제시</text>
<rect x="570" y="110" width="150" height="64" rx="6" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="645.0" y="141.0" font-size="13" fill="#7a3ba7" font-weight="700" text-anchor="middle">CA</text>
<text x="645.0" y="156.0" font-size="10" fill="#52514e" font-weight="400" text-anchor="middle">발급 기관</text>
<polyline points="296,142 222,142" fill="none" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)"/>
<text x="259" y="100" font-size="10" fill="#008300" font-weight="400" text-anchor="middle">인증서</text>
<polyline points="133,106 133,88 645,88 645,106" fill="none" stroke="#7a3ba7" stroke-width="1.4" marker-end="url(#ahp)" stroke-dasharray="5 4"/>
<text x="389" y="82" font-size="10.5" fill="#7a3ba7" font-weight="600" text-anchor="middle">브라우저·OS에 미리 들어 있는 신뢰 목록과 대조한다</text>
<text x="70" y="216" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">① 신뢰하는 CA가 발급한 인증서인가</text>
<text x="70" y="242" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">② 인증서의 도메인이 접속한 도메인과 같은가</text>
<text x="70" y="268" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">③ 유효기간이 지나지 않았는가</text>
<text x="48" y="216" font-size="12" fill="#52514e" font-weight="400" text-anchor="start"></text>
<text x="34" y="300" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">셋 중 하나라도 어긋나면 브라우저가 '연결이 비공개로 설정되어 있지 않습니다' 경고를 띄운다.</text>
</svg>