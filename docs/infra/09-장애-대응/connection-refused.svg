<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="298" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">Connection Refused — 도착은 했는데 받아 줄 프로세스가 없다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">'주소가 틀렸다'가 아니라 '그 문을 지키는 사람이 없다'는 신호다</text>
<rect x="48" y="130" width="150" height="62" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="123.0" y="160.0" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="middle">Client</text>
<text x="123.0" y="175.0" font-size="10" fill="#52514e" font-weight="400" text-anchor="middle">curl</text>
<rect x="250" y="100" width="250" height="130" rx="9" fill="#898781" fill-opacity="0.07" stroke="#898781" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="264" y="121" font-size="13" fill="#898781" font-weight="700" text-anchor="start">Server 도착</text>
<rect x="278" y="152" width="195" height="56" rx="6" fill="#ffffff" stroke="#e34948" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="375.5" y="179.0" font-size="12" fill="#e34948" font-weight="700" text-anchor="middle">TCP 8080</text>
<text x="375.5" y="193.5" font-size="9.5" fill="#52514e" font-weight="400" text-anchor="middle">LISTEN 중인 게 없음</text>
<line x1="202" y1="148" x2="246" y2="148" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<polyline points="246,178 202,178" fill="none" stroke="#e34948" stroke-width="1.4" marker-end="url(#ahr)"/>
<text x="224" y="196" font-size="10" fill="#e34948" font-weight="700" text-anchor="middle">즉시 거절</text>
<rect x="540" y="130" width="180" height="62" rx="6" fill="#ffffff" stroke="#898781" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="630.0" y="160.0" font-size="13" fill="#898781" font-weight="700" text-anchor="middle">Timeout</text>
<text x="630.0" y="175.0" font-size="10" fill="#52514e" font-weight="400" text-anchor="middle">응답 자체가 없음</text>
<text x="630" y="210" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">↕ 헷갈리기 쉬운 다른 증상</text>
<text x="34" y="258" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start">Refused = 즉시 끊긴다 → 프로세스 · 포트 · bind 주소를 본다.</text>
<text x="34" y="280" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start">Timeout = 한참 기다린다 → 방화벽 · 과부하 · 느린 DB나 외부 API를 본다.</text>
</svg>