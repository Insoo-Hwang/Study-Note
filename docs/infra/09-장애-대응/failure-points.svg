<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="328" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">장애는 '어디까지 도달했는가'로 좁힌다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">증상을 보고 바로 Spring 로그부터 열지 않는다 — 흐름을 따라 자른다</text>
<rect x="40" y="100" width="120" height="54" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="100.0" y="131.68" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="middle">User</text>
<line x1="164" y1="127" x2="178" y2="127" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="100" y="178" font-size="10" fill="#0b0b0b" font-weight="600" text-anchor="middle">브라우저 · curl</text>
<text x="100" y="200" font-size="8.5" fill="#52514e" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">curl -I https://…</text>
<rect x="182" y="100" width="120" height="54" rx="6" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="242.0" y="131.68" font-size="13" fill="#eb6834" font-weight="700" text-anchor="middle">DNS</text>
<line x1="306" y1="127" x2="320" y2="127" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="242" y="178" font-size="10" fill="#0b0b0b" font-weight="600" text-anchor="middle">이름을 못 찾음</text>
<text x="242" y="200" font-size="8.5" fill="#52514e" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">nslookup example.com</text>
<rect x="324" y="100" width="120" height="54" rx="6" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="384.0" y="131.68" font-size="13" fill="#7a3ba7" font-weight="700" text-anchor="middle">Nginx</text>
<line x1="448" y1="127" x2="462" y2="127" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="384" y="178" font-size="10" fill="#0b0b0b" font-weight="600" text-anchor="middle">502 · 진입은 됨</text>
<text x="384" y="200" font-size="8.5" fill="#52514e" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">docker logs nginx</text>
<rect x="466" y="100" width="120" height="54" rx="6" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="526.0" y="131.68" font-size="13" fill="#008300" font-weight="700" text-anchor="middle">Spring</text>
<line x1="590" y1="127" x2="604" y2="127" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="526" y="178" font-size="10" fill="#0b0b0b" font-weight="600" text-anchor="middle">500 · 앱 예외</text>
<text x="526" y="200" font-size="8.5" fill="#52514e" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">docker logs backend</text>
<rect x="608" y="100" width="120" height="54" rx="6" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="668.0" y="131.68" font-size="13" fill="#e34948" font-weight="700" text-anchor="middle">DB</text>
<text x="668" y="178" font-size="10" fill="#0b0b0b" font-weight="600" text-anchor="middle">Connection Error</text>
<text x="668" y="200" font-size="8.5" fill="#52514e" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">docker logs db</text>
<rect x="40" y="220" width="680" height="62" rx="9" fill="#898781" fill-opacity="0.07" stroke="#898781" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="70" y="256" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">① 현상 확인</text>
<text x="182" y="256" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">② 어디까지 갔나</text>
<text x="294" y="256" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">③ 가설</text>
<text x="406" y="256" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">④ 확인</text>
<text x="518" y="256" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">⑤ 원인</text>
<text x="630" y="256" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">⑥ 해결</text>
<text x="34" y="310" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">Status Code가 첫 이정표다. 4xx면 요청 쪽, 5xx면 서버 쪽, 502면 Nginx는 살아 있고 그 뒤가 문제다.</text>
</svg>