<text x="34" y="320" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">Job끼리는 기본적으로 병렬이고, needs로 순서를 준다. Step은 같은 Job 안에서 위에서 아래로 실행된다.</text>
