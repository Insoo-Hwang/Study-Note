<text x="380.0" y="136.0" font-size="10" fill="#52514e" font-weight="400" text-anchor="middle">on: push</text>
<rect x="110" y="175" width="200" height="54" rx="6" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="210.0" y="201.0" font-size="12" fill="#008300" font-weight="700" text-anchor="middle">Job: test</text>
<text x="210.0" y="215.5" font-size="9.5" fill="#52514e" font-weight="400" text-anchor="middle">runs-on: ubuntu-latest</text>
