<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">Workflow &gt; Job &gt; Step</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">Workflow 하나가 여러 Job을, Job 하나가 여러 Step을 갖는다</text>
<rect x="280" y="95" width="200" height="54" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
