<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="328" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">Dockerfile → build → Image → run → Container</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">레시피를 적고, 굽고, 꺼내 먹는 세 단계다</text>
<rect x="48" y="100" width="180" height="66" rx="6" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="138.0" y="132.0" font-size="13" fill="#7a3ba7" font-weight="700" text-anchor="middle">Dockerfile</text>
<text x="138.0" y="147.5" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">무엇을 담을지 적는 파일</text>
<rect x="290" y="100" width="180" height="66" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="380.0" y="132.0" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="middle">Image</text>
<text x="380.0" y="147.5" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">my-spring-app:1.0</text>
<rect x="532" y="100" width="180" height="66" rx="6" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="622.0" y="132.0" font-size="13" fill="#008300" font-weight="700" text-anchor="middle">Container</text>
<text x="622.0" y="147.5" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">실행 중인 프로세스</text>
<line x1="232" y1="133" x2="286" y2="133" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="259" y="92" font-size="10.5" fill="#0b0b0b" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">build</text>
<line x1="474" y1="133" x2="528" y2="133" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="501" y="92" font-size="10.5" fill="#0b0b0b" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">run</text>
<rect x="48" y="190" width="300" height="110" rx="6" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="198.0" y="249.68" font-size="13" fill="#7a3ba7" font-weight="700" text-anchor="middle"></text>
<text x="64" y="214" font-size="10" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">FROM eclipse-temurin:21-jre</text>
<text x="64" y="236" font-size="10" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">WORKDIR /app</text>
<text x="64" y="258" font-size="10" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">COPY build/libs/app.jar app.jar</text>
<text x="64" y="280" font-size="10" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">ENTRYPOINT ["java","-jar","app.jar"]</text>
<text x="390" y="214" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">docker build -t my-spring-app .</text>
<text x="390" y="240" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">docker run -p 8080:8080 my-spring-app</text>
<text x="390" y="272" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">docker images  /  docker ps  로 각각을 확인한다</text>
</svg>