<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="298" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">Container마다 localhost가 따로 있다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">Spring 컨테이너의 localhost는 Spring 컨테이너 자신이다</text>
<rect x="50" y="92" width="300" height="130" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="64" y="113" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start">Spring Container</text>
<text x="64" y="130" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">localhost = 이 컨테이너</text>
<rect x="78" y="152" width="108" height="50" rx="6" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="132.0" y="181.32" font-size="12" fill="#898781" font-weight="700" text-anchor="middle">app</text>
<line x1="190" y1="177" x2="208" y2="177" stroke="#e34948" stroke-width="1.4" marker-end="url(#ahr)"/>
<rect x="212" y="152" width="118" height="50" rx="6" fill="#ffffff" stroke="#e34948" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="271.0" y="176.0" font-size="11" fill="#e34948" font-weight="700" text-anchor="middle">localhost:5432</text>
<text x="271.0" y="190.5" font-size="9.5" fill="#52514e" font-weight="400" text-anchor="middle">아무도 없음</text>
<rect x="410" y="92" width="300" height="130" rx="9" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="424" y="113" font-size="13" fill="#008300" font-weight="700" text-anchor="start">PostgreSQL Container</text>
<text x="424" y="130" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">localhost = 이 컨테이너</text>
<rect x="500" y="152" width="170" height="50" rx="6" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="585.0" y="176.0" font-size="12" fill="#008300" font-weight="700" text-anchor="middle">postgres</text>
<text x="585.0" y="191.5" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">:5432</text>
<polyline points="330,226 380,250 585,250 585,208" fill="none" stroke="#008300" stroke-width="1.4" marker-end="url(#ahg)" stroke-dasharray="5 4"/>
<text x="455" y="268" font-size="11" fill="#008300" font-weight="600" text-anchor="middle">같은 네트워크의 이름 db:5432 로 불러야 닿는다</text>
<text x="34" y="288" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">Compose에서 jdbc:postgresql://localhost:5432 로 두면 Connection Refused가 난다.</text>
</svg>