<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="288" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">Port Mapping — Host의 Port를 Container 안으로 잇는다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">-p 9000:8080 은 '내 9000으로 온 것을 컨테이너 8080으로 보내라'는 뜻</text>
<rect x="40" y="88" width="680" height="152" rx="9" fill="#898781" fill-opacity="0.07" stroke="#898781" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="54" y="109" font-size="13" fill="#898781" font-weight="700" text-anchor="start">MacBook (Host)</text>
<rect x="70" y="152" width="160" height="56" rx="6" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="150.0" y="179.0" font-size="12" fill="#eb6834" font-weight="700" text-anchor="middle">Host :9000</text>
<text x="150.0" y="194.0" font-size="10" fill="#52514e" font-weight="400" text-anchor="middle">내가 접속하는 곳</text>
<rect x="300" y="130" width="400" height="96" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="314" y="151" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start">Container</text>
<text x="314" y="168" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">독립된 네트워크 공간</text>
<rect x="430" y="168" width="240" height="44" rx="6" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="550.0" y="194.32" font-size="12" fill="#008300" font-weight="700" text-anchor="middle">Spring Boot :8080</text>
<line x1="234" y1="180" x2="296" y2="180" stroke="#eb6834" stroke-width="1.4" marker-end="url(#aho)"/>
<text x="265" y="172" font-size="9.5" fill="#0b0b0b" font-weight="400" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">-p</text>
<line x1="330" y1="190" x2="426" y2="190" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ahb)"/>
<text x="34" y="262" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">curl localhost:9000  →  Container의 8080. 두 번호가 같을 필요는 없다.</text>
<text x="34" y="282" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">Port Mapping을 안 하면 컨테이너 안에서만 열려 있고 Host에서는 보이지 않는다.</text>
</svg>