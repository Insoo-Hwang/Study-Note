<text x="466" y="131" font-size="10" fill="#2a78d6" font-weight="600" text-anchor="end">② 요청은 그 통로를 타고 들어온다</text>
<text x="34" y="322" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">연결을 여는 쪽이 안쪽이라 방화벽의 '들어오는 연결' 규칙을 건드리지 않는다.</text>
