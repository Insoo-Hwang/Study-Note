<text x="34" y="212" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">외부 8080   →   192.168.0.10 의 8080</text>
<text x="34" y="234" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">이 규칙 하나가 곧 그 포트를 인터넷 전체에 여는 일이다. 열기 전에 무엇이 붙어 있는지 먼저 본다.</text>
