<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">Port Forwarding — 공유기에 '이 포트는 저 기기로' 규칙을 준다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">NAT가 막아 둔 바깥→안쪽 방향에 구멍을 하나 뚫는 일이다</text>
