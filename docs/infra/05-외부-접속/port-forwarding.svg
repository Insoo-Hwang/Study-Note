<text x="380.0" y="149.0" font-size="13" fill="#eb6834" font-weight="700" text-anchor="middle">공유기</text>
<text x="380.0" y="164.0" font-size="10" fill="#52514e" font-weight="400" text-anchor="middle">Port Forwarding 규칙</text>
