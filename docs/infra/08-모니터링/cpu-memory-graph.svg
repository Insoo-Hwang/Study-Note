<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">CPU는 출렁이고, Memory는 우상향이면 의심한다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">값 하나보다 '어떤 모양으로 움직이는가'가 정보다</text>
