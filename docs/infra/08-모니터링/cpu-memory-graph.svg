<text x="94" y="282" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start">CPU — 오르내린다. 급등하면 트래픽 · 무한루프 · GC를 본다.</text>
<line x1="56" y1="302" x2="86" y2="302" stroke="#7a3ba7" stroke-width="2.4"/>
<text x="94" y="306" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start">Memory — 내려오지 않고 계속 오르면 Memory Leak을 의심한다.</text>
