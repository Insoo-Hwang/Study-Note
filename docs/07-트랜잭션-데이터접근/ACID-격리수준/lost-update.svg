<line x1="130" y1="180" x2="700" y2="180" stroke="#eb6834" stroke-width="1.6"/>
<circle cx="160" cy="108" r="6" fill="#2a78d6" stroke="#2a78d6"/>
<text x="160" y="112.86" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle"></text>
<text x="160" y="98" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">SELECT → 100</text>
<circle cx="400" cy="108" r="6" fill="#2a78d6" stroke="#2a78d6"/>
