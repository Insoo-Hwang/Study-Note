<text x="560" y="98" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">COMMIT</text>
<circle cx="230" cy="180" r="6" fill="#eb6834" stroke="#eb6834"/>
<text x="230" y="184.86" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle"></text>
<text x="230" y="200" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">SELECT → 100</text>
<circle cx="560" cy="180" r="6" fill="#eb6834" stroke="#eb6834"/>
<text x="560" y="184.86" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle"></text>
<text x="560" y="200" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">UPDATE qty = 99</text>
<circle cx="680" cy="180" r="6" fill="#eb6834" stroke="#eb6834"/>
<text x="680" y="184.86" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle"></text>
<text x="680" y="200" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">COMMIT</text>
<text x="230" y="148" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle">여기서 읽은 100 이</text>
<line x1="250" y1="156" x2="540" y2="170" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)" stroke-dasharray="3 3"/>
<text x="560" y="218" font-size="10.5" fill="#e34948" font-weight="400" text-anchor="middle">여기서 쓰인다 — 이미 낡았다</text>
<rect x="34" y="236" width="340" height="62" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="50" y="258" font-size="13" fill="#e34948" font-weight="700" text-anchor="start">결과 99  ·  1건이 사라졌다</text>
<text x="50" y="280" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">RC · RR · SERIALIZABLE 전부 동일</text>
<rect x="392" y="236" width="334" height="62" rx="4" fill="#ffffff" stroke="#008300" stroke-width="1.3"/>
<text x="408" y="258" font-size="13" fill="#008300" font-weight="700" text-anchor="start">결과 98  ·  정확</text>
<text x="408" y="280" font-size="11" fill="#52514e" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">UPDATE stock SET qty = qty - 1</text>
