<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">갱신 손실은 어떤 격리 수준으로도 막히지 않는다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">재고 100 에서 둘이 1씩 뺀다 — 기대값 98</text>
<text x="34" y="96" font-size="12" fill="#2a78d6" font-weight="700" text-anchor="start">트랜잭션 A</text>
<text x="34" y="168" font-size="12" fill="#eb6834" font-weight="700" text-anchor="start">트랜잭션 B</text>
