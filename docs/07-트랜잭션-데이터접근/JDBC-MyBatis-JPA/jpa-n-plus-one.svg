<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 336" width="780" height="336" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="778" height="334" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">지연 로딩 + 반복문 = N+1 이 자동으로 생긴다</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">코드에는 SQL 이 한 줄도 없는데 1,001번의 쿼리가 나간다</text>
<rect x="34" y="96" width="300" height="34" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="184.0" y="117.14" font-size="11.5" fill="#2a78d6" font-weight="400" text-anchor="middle">orderRepository.findAll()</text>
<text x="348" y="118" font-size="11.5" fill="#2a78d6" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">SELECT * FROM orders   ← 1번</text>
<rect x="34" y="146" width="300" height="34" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="184.0" y="167.14" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="middle">for (Order o : orders)</text>
<rect x="58" y="186" width="276" height="34" rx="4" fill="#ffffff" stroke="#e34948" stroke-width="1.3"/>
<text x="196.0" y="207.14" font-size="11.5" fill="#e34948" font-weight="400" text-anchor="middle">o.getUser().getName()</text>
<text x="348" y="208" font-size="11.5" fill="#e34948" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">SELECT * FROM users WHERE id=?</text>
<text x="348" y="226" font-size="11" fill="#e34948" font-weight="700" text-anchor="start">× 1,000번  ← 프록시를 건드릴 때마다</text>
<line x1="34" y1="254" x2="746" y2="254" stroke="#898781" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="34" y="278" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start">EAGER 로 바꿔도 해결되지 않는다  —  findAll · JPQL 은 여전히 N+1 이다</text>
<text x="34" y="302" font-size="11.5" fill="#008300" font-weight="700" text-anchor="start">정석   연관은 전부 LAZY  →  단건은 fetch join  ·  목록은 default_batch_fetch_size</text>
<text x="34" y="324" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">일대다 fetch join 은 행이 뻥튀기돼 페이징이 깨지고 전체를 메모리로 읽어 OOM 위험이 있다</text>
</svg>