<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="778" height="358" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">영속성 컨텍스트 — setter 만 불러도 UPDATE 가 나가는 이유</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">조회 시점의 스냅숏을 따로 저장해 두고 커밋 시점에 비교한다</text>
<rect x="34" y="96" width="216" height="38" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="46" y="120" font-size="11" fill="#2a78d6" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">find(Order, 1L)</text>
<text x="266" y="120" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">SELECT 실행 → 1차 캐시에 저장 + 스냅숏 기록</text>
<line x1="142" y1="134" x2="142" y2="140" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="34" y="148" width="216" height="38" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="46" y="172" font-size="11" fill="#2a78d6" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">find(Order, 1L) again</text>
<text x="266" y="172" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">1차 캐시에서 반환 — SELECT 없음 (== 비교 true)</text>
<line x1="142" y1="186" x2="142" y2="192" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="34" y="200" width="216" height="38" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="46" y="224" font-size="11" fill="#898781" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">order.setStatus(PAID)</text>
<text x="266" y="224" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">아직 아무 일도 안 일어난다</text>
<line x1="142" y1="238" x2="142" y2="244" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="34" y="252" width="216" height="38" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="46" y="276" font-size="11" fill="#eb6834" font-weight="700" text-anchor="start" font-family="ui-monospace, Consolas, monospace">commit</text>
<text x="266" y="276" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">flush — 스냅숏과 비교 → 바뀐 필드로 UPDATE 생성</text>
<line x1="34" y1="306" x2="746" y2="306" stroke="#898781" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="34" y="330" font-size="12" fill="#e34948" font-weight="700" text-anchor="start">save() 를 부르지 않아도 UPDATE 가 나간다  —  조회한 엔티티를 무심코 수정하면 사고가 된다</text>
<text x="34" y="352" font-size="11.5" fill="#008300" font-weight="700" text-anchor="start">조회 전용 서비스에 @Transactional(readOnly = true) 를 거는 이유 — 스냅숏을 안 만든다</text>
</svg>