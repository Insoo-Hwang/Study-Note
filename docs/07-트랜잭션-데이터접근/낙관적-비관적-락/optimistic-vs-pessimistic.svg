<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="760" height="396" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect x="1" y="1" width="758" height="394" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#898781"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34948"/></marker><marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#008300"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a3ba7"/></marker></defs>
<text x="34" y="40" font-size="20" font-weight="700" fill="#0b0b0b">일을 시작하기 전에 막느냐, 마친 뒤에 검사하느냐</text>
<text x="34" y="61" font-size="12.5" fill="#52514e">비관적 락은 대기로, 낙관적 락은 재시도로 값을 치른다</text>
<rect x="34" y="84" width="340" height="272" rx="9" fill="#7a3ba7" fill-opacity="0.07" stroke="#7a3ba7" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="48" y="105" font-size="13" fill="#7a3ba7" font-weight="700" text-anchor="start">비관적 락</text>
<text x="48" y="122" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">충돌할 테니 미리 잠근다</text>
<rect x="50" y="132" width="308" height="30" rx="4" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="64" y="152" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">SELECT ... FOR UPDATE</text>
<line x1="204" y1="162" x2="204" y2="172" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="50" y="172" width="308" height="30" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="64" y="192" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">(남들은 여기서 대기)</text>
<line x1="204" y1="202" x2="204" y2="212" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="50" y="212" width="308" height="30" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="64" y="232" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">계산</text>
<line x1="204" y1="242" x2="204" y2="252" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="50" y="252" width="308" height="30" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="64" y="272" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">UPDATE</text>
<line x1="204" y1="282" x2="204" y2="292" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="50" y="292" width="308" height="30" rx="4" fill="#ffffff" stroke="#7a3ba7" stroke-width="1.3"/>
<text x="64" y="312" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">COMMIT — 잠금 해제</text>
<text x="50" y="340" font-size="11.5" fill="#7a3ba7" font-weight="700" text-anchor="start">비용: 대기 시간 (518 ms)</text>
<rect x="386" y="84" width="340" height="272" rx="9" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.30" stroke-width="1.2"/>
<text x="400" y="105" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start">낙관적 락</text>
<text x="400" y="122" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">충돌 안 할 테니 그냥 한다</text>
<rect x="402" y="132" width="308" height="30" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="416" y="152" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">SELECT qty, version</text>
<line x1="556" y1="162" x2="556" y2="172" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="402" y="172" width="308" height="30" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="416" y="192" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">(남들도 동시에 진행)</text>
<line x1="556" y1="202" x2="556" y2="212" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="402" y="212" width="308" height="30" rx="4" fill="#ffffff" stroke="#898781" stroke-width="1.3"/>
<text x="416" y="232" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">계산</text>
<line x1="556" y1="242" x2="556" y2="252" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="402" y="252" width="308" height="30" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/>
<text x="416" y="272" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">UPDATE ... WHERE version = ?</text>
<line x1="556" y1="282" x2="556" y2="292" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="402" y="292" width="308" height="30" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="416" y="312" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="start">영향 행 1 → 성공 / 0 → 재시도</text>
<text x="402" y="340" font-size="11.5" fill="#2a78d6" font-weight="700" text-anchor="start">비용: 재시도로 날린 일 (738회)</text>
<text x="34" y="382" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">낙관적 락은 사실 아무것도 잠그지 않는다 — WHERE 조건이 확인과 갱신을 원자적으로 묶을 뿐이다.</text>
</svg>