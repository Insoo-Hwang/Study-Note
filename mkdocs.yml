site_name: Study Note
site_description: 개발 학습 정리 노트
site_url: https://Insoo-Hwang.github.io/Study-Note/
repo_url: https://github.com/Insoo-Hwang/Study-Note
repo_name: Insoo-Hwang/Study-Note

theme:
  name: material
  language: ko
  font: false   # 외부(Google) 폰트 대신 시스템 폰트 사용 — 한글 렌더링·로딩 속도에 유리
  features:
    - navigation.tabs         # 최상위 항목을 헤더의 탭으로 — 'CS 노트' / '인프라 노트' / '실무 노트' 모드 전환
    - navigation.tabs.sticky  # 스크롤해도 탭이 헤더에 붙어 있어 언제든 모드를 바꿀 수 있다
    - navigation.instant      # SPA 방식 즉시 로딩
    - navigation.tracking     # 스크롤 시 URL 갱신
    - navigation.top          # 맨 위로 버튼
    - navigation.footer       # 이전/다음 문서 링크
    - navigation.indexes      # 섹션 인덱스 페이지 지원
    - search.highlight        # 검색어 하이라이트
    - search.suggest          # 검색 자동완성
    - content.code.copy       # 코드 블록 복사 버튼
    - toc.follow              # 목차 자동 스크롤
  palette:
    # 라이트 모드
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    # 다크 모드
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환

# 좌측 메뉴 구성 — 새 노트를 추가하면 이 목록에 한 줄 추가하면 됩니다.
#
# ── 최상위 세 항목이 '모드'다 ──
# theme features의 navigation.tabs 때문에 최상위 항목(`CS 노트` / `인프라 노트` / `실무 노트`)은
# 좌측 메뉴가 아니라 **헤더의 탭**으로 그려집니다. 탭을 누르면 좌측 메뉴가 그 트리로
# 통째로 바뀌므로, 세 트리가 한 화면에 같이 보이지 않습니다.
# → 그래서 새 노트는 반드시 세 최상위 항목 중 **하나의 안쪽에** 넣습니다.
#
# **최상위 항목의 개수와 순서를 바꾸면 `stylesheets/mode.css`가 깨집니다.**
# 그 파일이 모드별 헤더 색을 `nth-child(2)`(인프라) · `nth-child(3)`(실무)로 판별하기
# 때문입니다. 탭을 더 늘리거나 순서를 바꾼다면 mode.css도 같이 고쳐야 합니다.
#
# 각 그룹의 첫 줄에 라벨 없이 놓인 `index.md`는 그 그룹의 인덱스 페이지입니다.
# (theme features의 navigation.indexes) 탭이나 섹션 제목을 누르면 별도 항목 없이
# 그 그룹의 '한 페이지 요약'이 열립니다.
# 파일명은 반드시 `index.md`여야 합니다 — Material이 is_index로 판별합니다.
nav:
  - CS 노트:
      - index.md
      - 01. 복잡도 · 자료구조:
          - 01-복잡도-자료구조/index.md
          - 시간 복잡도와 공간 복잡도: 01-복잡도-자료구조/시간-공간-복잡도/시간-공간-복잡도.md
          - Amortized Analysis: 01-복잡도-자료구조/Amortized-Analysis/Amortized-Analysis.md
          - 선형 자료구조 비교: 01-복잡도-자료구조/선형-자료구조-비교/선형-자료구조-비교.md
          - 해시와 트리 비교: 01-복잡도-자료구조/해시-트리-비교/해시-트리-비교.md
          - Heap과 PriorityQueue: 01-복잡도-자료구조/Heap-PriorityQueue/Heap-PriorityQueue.md
          - Collection 선택 기준: 01-복잡도-자료구조/Collection-선택-기준/Collection-선택-기준.md
      - 02. 알고리즘:
          - 02-알고리즘/index.md
          - 탐색과 정렬: 02-알고리즘/탐색-정렬/탐색-정렬.md
          - 구간 처리: 02-알고리즘/구간-처리/구간-처리.md
          - 그래프 문제 해결: 02-알고리즘/그래프-문제해결/그래프-문제해결.md
      - 03. Java:
          - 03-Java/index.md
          - Java Collection: 03-Java/Java-Collection/Java-Collection.md
          - equals · hashCode: 03-Java/equals-hashCode/equals-hashCode.md
          - 객체지향과 SOLID: 03-Java/객체지향-SOLID/객체지향-SOLID.md
          - Generic · Exception · Stream: 03-Java/Generic-Exception-Stream/Generic-Exception-Stream.md
          - JVM 메모리와 GC: 03-Java/JVM-메모리-GC/JVM-메모리-GC.md
      - 04. 동시성:
          - Thread와 동기화: 04-동시성/Thread-동기화/Thread-동기화.md
          - Atomic과 Concurrent Collection: 04-동시성/Atomic-Concurrent-Collection/Atomic-Concurrent-Collection.md
          - ThreadPool과 Deadlock: 04-동시성/ThreadPool-Deadlock/ThreadPool-Deadlock.md
      - 05. Spring:
          - IoC · DI와 Bean: 05-Spring/IoC-DI와-Bean/IoC-DI와-Bean.md
          - AOP · Proxy와 Transactional: 05-Spring/AOP-Proxy-Transactional/AOP-Proxy-Transactional.md
          - Spring MVC 요청 흐름: 05-Spring/Spring-MVC-요청흐름/Spring-MVC-요청흐름.md
          - Spring Boot와 예외 처리: 05-Spring/Spring-Boot와-예외처리/Spring-Boot와-예외처리.md
      - 06. 데이터베이스:
          - 인덱스와 실행 계획: 06-데이터베이스/인덱스-실행계획/인덱스-실행계획.md
          - 조인과 페이지네이션: 06-데이터베이스/조인-페이지네이션/조인-페이지네이션.md
          - 대용량 데이터 분할: 06-데이터베이스/대용량-데이터-분할/대용량-데이터-분할.md
          - Connection Pool과 쿼리 튜닝: 06-데이터베이스/ConnectionPool과-쿼리튜닝/ConnectionPool과-쿼리튜닝.md
      - 07. 트랜잭션 · 데이터 접근:
          - ACID와 격리 수준: 07-트랜잭션-데이터접근/ACID-격리수준/ACID-격리수준.md
          - MVCC: 07-트랜잭션-데이터접근/MVCC/MVCC.md
          - 낙관적 락 · 비관적 락: 07-트랜잭션-데이터접근/낙관적-비관적-락/낙관적-비관적-락.md
          - JDBC · MyBatis · JPA: 07-트랜잭션-데이터접근/JDBC-MyBatis-JPA/JDBC-MyBatis-JPA.md
      - 08. 캐시 · Redis:
          - 08-캐시-Redis/index.md
          - 캐시 전략과 정합성: 08-캐시-Redis/캐시-전략-정합성/캐시-전략-정합성.md
          - Cache Stampede와 Request Collapsing: 08-캐시-Redis/Cache-Stampede/Cache-Stampede.md
          - Redis 자료구조와 활용: 08-캐시-Redis/Redis-자료구조/Redis-자료구조.md
          - 분산 락과 멱등성: 08-캐시-Redis/분산락-멱등성/분산락-멱등성.md
      - 09. 웹 · 보안:
          - 09-웹-보안/index.md
          - HTTP · TCP 네트워크: 09-웹-보안/HTTP-TCP-네트워크/HTTP-TCP-네트워크.md
          - REST와 API 설계: 09-웹-보안/REST-API-설계/REST-API-설계.md
          - 쿠키 · 세션 · JWT: 09-웹-보안/쿠키-세션-JWT/쿠키-세션-JWT.md
          - 인증 · 인가 · CORS · CSRF: 09-웹-보안/인증인가-CORS-CSRF/인증인가-CORS-CSRF.md
      - 10. 테스트 · 운영:
          - 10-테스트-운영/index.md
          - 단위 테스트와 통합 테스트: 10-테스트-운영/단위-통합-테스트/단위-통합-테스트.md
          - Mock · Spring Test · Testcontainers: 10-테스트-운영/Mock-SpringTest-Testcontainers/Mock-SpringTest-Testcontainers.md
          - 로그 · 메트릭 · 트레이싱: 10-테스트-운영/로그-메트릭-트레이싱/로그-메트릭-트레이싱.md
          - 장애 분석과 성능 개선: 10-테스트-운영/장애분석-성능개선/장애분석-성능개선.md
      # 11-메시징-시스템설계,
      # 12-경험기반-면접은 노트를 쓰는 시점에 이 자리에 번호 순서대로 추가한다.
  #
  # ── 여기부터는 면접 커리큘럼(01~12) 밖이다 ──
  # `docs/infra/`와 `docs/work/`는 번호 없는 별도 트리이자 별도 탭이다.
  # 커리큘럼 번호를 이어받지 않으며 `docs/index.md` 목차와 README 커리큘럼 트리에도 넣지 않는다.
  # 각 트리의 노트는 그 트리의 `index.md` 목차에만 등록한다 (검사기가 이 규칙을 본다).
  # 카테고리가 필요해지면 폴더를 더 파지 말고 각 그룹 안에서 중첩해 묶는다.
  #
  # 설치·설정·환경이 주인공이면 `infra/`, 코드·API·라이브러리가 주인공이면 `work/`다.
  - 인프라 노트:
      - infra/index.md
      - 서버와 네트워크 기초: infra/서버-네트워크-기초/서버-네트워크-기초.md
  - 실무 노트:
      - work/index.md

markdown_extensions:
  - admonition               # !!! note 콜아웃 박스
  - attr_list                # 이미지/링크에 속성 부여
  - md_in_html
  - tables
  - footnotes
  - toc:
      # 노트가 6개 섹션(##) + 하위 절(###) + 키워드별 절(####) 구조라
      # 3단계까지만 목차에 넣어야 우측 사이드바가 읽을 만하다.
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      # ```mermaid 다이어그램 지원 (앞으로 필요할 때 사용 가능)
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search   # 한국어는 기본 토크나이저로 색인됩니다

# 책갈피(이어읽기) — 읽던 위치를 브라우저 localStorage에 저장하고 되돌아간다.
# GitHub Pages에는 서버가 없으므로 저장은 전적으로 브라우저 안에서만 이뤄진다.
#
# `extra_css`는 **하나만** 둔다. YAML은 같은 키가 두 번 나오면 뒤엣것이 앞엣것을
# 통째로 덮어써서, 블록을 나눠 쓰면 앞 블록의 CSS가 조용히 사라진다.
extra_css:
  - stylesheets/typography.css   # 모바일에서 본문 글씨 확대
  - stylesheets/bookmark.css
  - stylesheets/mode.css         # 인프라 모드일 때 헤더 색을 바꿔 두 트리를 눈으로 구분한다

extra_javascript:
  - javascripts/bookmark.js
